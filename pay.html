<style>
:root{--azul:#1F7BFF;--azul2:#1663F0;--fundo:#050E26;--card:rgba(10,24,60,.72);--linha:#233A6E;--txt:#EAF1FF;--mut:#9FB2D9;--ok:#22C55E;--bad:#F87171;--warn:#FBBF24}
*{box-sizing:border-box}html{background:#030918}html,body{margin:0;min-height:100%}body{font-family:Poppins,Inter,system-ui,sans-serif;color:var(--txt);background:radial-gradient(120% 70% at 50% 0%,#0A1E4A 0%,#050E26 55%,#030918 100%) fixed;min-height:100dvh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:300px;height:300px;border-radius:64px;border:1.5px solid rgba(46,147,255,.45);background:linear-gradient(135deg,rgba(31,95,232,.22),rgba(31,95,232,0));transform:rotate(45deg);z-index:0;pointer-events:none}
body:before{right:-210px;top:200px}body:after{left:-210px;bottom:-90px}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 20px 40px;min-height:100dvh;display:flex;flex-direction:column}
.mk{display:flex;justify-content:center;margin:36px 0 26px}.mk>div{display:inline-flex;flex-direction:column;align-items:flex-end}.mk img{height:52px}.mk .py{color:var(--azul);font-weight:700;letter-spacing:.34em;font-size:26px;margin:-4px -8px 0 0}
h1{text-align:center;font-size:26px;line-height:1.2;margin:0}h1 span{color:#2E93FF}.sb{text-align:center;color:var(--mut);font-size:14px;margin:10px 0 26px}
.in{display:flex;align-items:center;gap:12px;border:1.5px solid var(--linha);background:var(--card);border-radius:16px;padding:0 16px;height:58px;margin-bottom:14px;color:var(--mut)}.in:focus-within{border-color:var(--azul)}

.bt{width:100%;height:58px;border-radius:999px;border:0;background:linear-gradient(90deg,#1F8BFF,#1663F0);color:#fff;font:inherit;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(31,123,255,.35);cursor:pointer}.bt:disabled{opacity:.6}
.bt2{width:100%;height:54px;border-radius:999px;border:1.5px solid var(--azul);background:none;color:#fff;font:inherit;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none}
.ou{display:flex;align-items:center;gap:14px;color:#7E90B8;font-size:13px;margin:18px 0}.ou:before,.ou:after{content:"";flex:1;height:1px;background:var(--linha)}
.pe{margin-top:auto;padding-top:28px;text-align:center;font-size:14px}.pe span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}.top img{height:30px}.top .py{color:var(--azul);font-weight:700;letter-spacing:.2em;font-size:15px}.top .sp{flex:1}.top button{border:1px solid var(--linha);background:none;color:var(--mut);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}

h2{font-size:15px;margin:18px 0 10px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.cb{border:1px solid var(--linha);background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}.cb .t{flex:1;min-width:0}.cb .t b{display:block;font-size:17px}.cb .t span{color:var(--mut);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pg{border:1px solid var(--linha);background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px}.pg .vl{font-size:34px;font-weight:700}.pg .dt{color:var(--mut);font-size:13.5px}

.qr{background:#fff;border-radius:16px;padding:14px;text-align:center;color:#0B1E4A}.qr img{width:210px;height:210px;display:block;margin:4px auto 10px}.cp{width:100%;border:1px solid #CBD5E8;border-radius:10px;padding:10px;font:12px monospace;color:#33415F;word-break:break-all;background:#F7F9FF;margin-bottom:10px;max-height:72px;overflow:auto}
.qr .bt{height:48px;font-size:15px}.lnk{display:block;text-align:center;color:#2E93FF;font-weight:600;margin-top:12px;font-size:14px;cursor:pointer;text-decoration:none}
.ok-t{text-align:center;padding:26px 10px}.ok-t .i{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.15);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B1E4A;border:1px solid var(--linha);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 24px)}.msg.bad{border-color:var(--bad)}
.hide{display:none!important}
</style></head><body><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function () {
  var CFG = { apiKey: 'AIzaSyDdcLJdO2qnmiGsR1EsKFu-uJfs4FRNvA4', authDomain: 'nexum-30044.firebaseapp.com', projectId: 'nexum-30044' };
  var app = document.getElementById('app'), q = new URLSearchParams(location.search), BASE = '', ESTADO = {};
  var I = { user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>', lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>', eye: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', seta: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>', add: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M3 21c1.3-3.6 4-5.5 7-5.5M18 14v6M15 17h6"/></svg>' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- login ---------- */
  function telaLogin() {

  /* ---------- minhas cobranças ---------- */
  function telaLista() {

        else {
          var corpo = forma === 'pix' ? (c.pix ? '<div class="qr"><b>Pague com PIX</b><img src="data:image/png;base64,' + c.pix.img + '" alt="QR code do PIX"><div class="cp" id="cp">' + esc(c.pix.copia) + '</div><button class="bt" id="cpb">Copiar código PIX</button><p style="font-size:12.5px;color:#5E6782;margin:10px 0 0">O pagamento é confirmado na hora e o acesso é liberado sozinho.</p></div>' : '<div class="vazio">O PIX não está disponível para esta cobrança. Use o boleto ou o cartão.</div>')
            : forma === 'boleto' ? (c.linha || c.boleto ? '<div class="qr"><b>Boleto</b>' + (c.linha ? '<div class="cp" id="cp" style="margin-top:10px">' + esc(c.linha) + '</div><button class="bt" id="cpb">Copiar a linha digitável</button>' : '') + (c.boleto ? '<a class="lnk" href="' + esc(c.boleto) + '" target="_blank" rel="noopener" style="color:#1663F0">Abrir o boleto em PDF</a>' : '') + '<p style="font-size:12.5px;color:#5E6782;margin:10px 0 0">O boleto leva até 2 dias úteis para ser confirmado.</p></div>' : '<div class="vazio">O boleto não está disponível para esta cobrança.</div>')
            : forma === 'cartao' ? '<div class="qr"><b>Cartão de crédito</b><p style="font-size:13.5px;color:#33415F">Você digita os dados do cartão no ambiente seguro do Asaas, a instituição de pagamento que processa as cobranças da NEXUM. Os dados do cartão nunca passam pelo NEXUM.</p><a class="bt" href="' + esc(c.fatura) + '" target="_blank" rel="noopener" style="text-decoration:none">Pagar com cartão</a></div>'
            : '<div class="qr"><b>Carnê</b><p style="font-size:13.5px;color:#33415F">Para pagar as mensalidades em boletos mensais, entre no NEXUM PAY com o seu login e toque em "Gerar carnê". Cada parcela paga renova o acesso por mais um mês.</p></div>';
          app.innerHTML = topo + '<div class="pg"><div class="dt">' + esc(j.empresa) + '</div><div class="vl">' + brl(c.valor) + '</div><div class="dt">' + esc(c.parcela ? 'Parcela ' + c.parcela + ' · ' : '') + 'vence em ' + dt(c.vencimento) + '</div>' +
            '<div class="op"><button data-f="pix" class="' + (forma === 'pix' ? 'on' : '') + '">PIX<small>libera na hora</small></button><button data-f="cartao" class="' + (forma === 'cartao' ? 'on' : '') + '">Cartão de crédito<small>no ambiente seguro</small></button><button data-f="boleto" class="' + (forma === 'boleto' ? 'on' : '') + '">Boleto<small>1 a 2 dias úteis</small></button><button data-f="carne" class="' + (forma === 'carne' ? 'on' : '') + '">Carnê<small>parcelas mensais</small></button></div>' + corpo +
            '<a class="lnk" id="jp">Já paguei? Atualizar</a></div>' + rodape;
          [].forEach.call(app.querySelectorAll('[data-f]'), function (b) { b.onclick = function () { forma = b.dataset.f; desenha(); }; });
          var cpb = document.getElementById('cpb'); if (cpb) cpb.onclick = function () { navigator.clipboard.writeText(document.getElementById('cp').textContent).then(function () { msg('Copiado! Cole no app do seu banco.'); }).catch(function () { msg('Selecione e copie o código.', true); }); };
          document.getElementById('jp').onclick = function () { telaPagar(id, k, voltar); };
        }
        var v = document.getElementById('volta'); if (v) v.onclick = telaLista;
      }
      desenha();
      if (!c.pago && c.status !== 'DELETED') { var conta = 0, t = setInterval(function () { if (++conta > 60 || !document.getElementById('jp')) return clearInterval(t); api('/api/pay/ver', { c: id, k: k }).then(function (n) { if (n.cobranca.pago) { clearInterval(t); c = n.cobranca; j = n; desenha(); msg('Pagamento confirmado! 🎉'); } }).catch(function () { }); }, 10000); }
    }).catch(function (e) { app.innerHTML = marca + '<div class="vazio">' + esc(e.message) + '</div>' + rodape; });
  }
  /* ---------- início ---------- */
  fetch('https://firestore.googleapis.com/v1/projects/nexum-30044/databases/(default)/documents/plataforma/publico?key=' + CFG.apiKey).then(function (r) { return r.json(); }).then(function (j) { BASE = String(((j.fields || {}).asaasUrl || {}).stringValue || '').replace(/\/+$/, ''); }).catch(function () { })
    .then(function () {
      if (!BASE) { app.innerHTML = marca + '<div class="vazio">O NEXUM PAY está em manutenção. Tente de novo em instantes.</div>' + rodape; return; }
      if (q.get('c') && q.get('k')) return telaPagar(q.get('c'), q.get('k'), false);
      firebase.initializeApp(CFG); firebase.auth().onAuthStateChanged(function (u) { if (u) { if (sesLer()) telaLista(); else telaCodigo(); } else telaLogin(); });
    });
})();
