  const sis = `Você ajuda o RH de uma loja no Brasil na triagem de candidatos. Avalie só a aderência profissional à vaga, com base nos dados. Ignore e não comente nome, idade, gênero, estado civil, aparência, religião, origem ou qualquer característica pessoal protegida (Lei 9.029/1995). Responda SOMENTE um JSON: {"nota": 0 a 10, "resumo": "até 2 frases", "fortes": ["até 3 itens"], "lacunas": ["até 3 itens"], "perguntar": ["até 2 perguntas para a entrevista"]}`;
  const txt = `VAGA: ${v.titulo}${v.depto ? ` (${v.depto})` : ''}\nDescrição/requisitos: ${v.desc || '—'}\n\nCANDIDATO\nRelato de experiência: ${c.notas || '—'}\nCidade: ${c.cidade || '—'}\nRespostas às perguntas da vaga: ${(c.respostas || []).map(r => `${r.t} → ${r.r}`).join('; ') || '—'}\nCurrículo (texto extraído): ${cv || (img ? 'ver imagem anexada' : 'não enviado')}`;
  let resp;

      if (!r.ok) throw new Error(); resp = ((await r.json()).choices[0].message.content) || ''; } catch (e) { resp = await perguntarIA([{ role: 'user', content: txt.replace('ver imagem anexada', 'imagem não pôde ser lida') }], sis); } }
  else resp = await perguntarIA([{ role: 'user', content: txt }], sis);
  const j = JSON.parse((resp.match(/\{[\s\S]*\}/) || ['{}'])[0]);
  c.ia = { nota: Math.max(0, Math.min(10, Math.round(+j.nota || 0))), resumo: String(j.resumo || '').slice(0, 400), fortes: (j.fortes || []).slice(0, 3).map(String), lacunas: (j.lacunas || []).slice(0, 3).map(String), perguntar: (j.perguntar || []).slice(0, 2).map(String), em: new Date().toISOString(), leuCurriculo: !!(cv || img) };
  save('cands'); return c.ia;

/* ---------- Agenda de RH ---------- */
function quintoDiaUtil(a, m) { let n = 0; for (let d = 1; d <= 31; d++) { const dt = new Date(a, m, d); if (dt.getMonth() !== m) break; if (dt.getDay() !== 0 && ++n === 5) return dt; } }
function eventosAgenda(ini, fim) {
  const ev = [], add = (d, t, tipo, extra = {}) => { const ds = typeof d === 'string' ? d : iso(d); if (ds >= iso(ini) && ds <= iso(fim)) ev.push({ data: ds, t, tipo, ...extra }); };
  S.data.agenda.forEach(e => add(e.data, e.titulo, e.tipo || 'manual', { hora: e.hora, id: e.id, obs: e.obs }));
  ativos().forEach(c => { const adm = pd(c.admissao);
    if (c.tipo === 'experiencia' && adm) { add(addD(adm, 44), `Fim do 1º prazo de experiência: ${c.nome}`, 'prazo'); add(addD(adm, 89), `Fim da experiência: ${c.nome}`, 'prazo'); }
    if (c.nascimento) { const n = pd(c.nascimento); for (let y = ini.getFullYear(); y <= fim.getFullYear(); y++) add(new Date(y, n.getMonth(), n.getDate()), `Aniversário: ${c.nome}`, 'aniv'); }
    const st = statusFerias(c); if (st.limite && st.saldo) add(st.limite, `Limite para conceder férias: ${c.nome}`, 'prazo'); });
  S.data.ferias.forEach(f => { const c = colabById(f.colabId); if (c) add(f.inicio, `Início das férias: ${c.nome}`, 'ferias'); });
  S.data.admis.filter(p => p.status === 'andamento').forEach(p => add(p.inicio, `Início de ${p.nome} (${p.cargo})`, 'adm'));
  S.data.cands.filter(c => c.entrevista).forEach(c => add(c.entrevista.slice(0, 10), `Entrevista: ${c.nome}`, 'entrev', { hora: c.entrevista.slice(11, 16) }));
  S.data.colab.filter(c => c.status === 'desligado' && c.desligamento).forEach(c => add(addD(pd(c.desligamento), 10), `Prazo de pagamento da rescisão: ${c.nome}`, 'prazo'));
  for (let a = ini.getFullYear(); a <= fim.getFullYear(); a++) { add(new Date(a, 10, 30), 'Prazo da 1ª parcela do 13º salário', 'prazo'); add(new Date(a, 11, 20), 'Prazo da 2ª parcela do 13º salário', 'prazo'); }
  for (let a = ini.getFullYear(); a <= fim.getFullYear(); a++) Object.entries(feriadosAno(a, S.data.config)).forEach(([d, x]) => add(d, `Feriado: ${x.nome}`, 'feriado'));
  for (let a = ini.getFullYear(), m = ini.getMonth(); new Date(a, m, 1) <= fim; m++) { if (m > 11) { m = 0; a++; } add(quintoDiaUtil(a, m), 'Pagamento de salários (5º dia útil)', 'pag'); add(new Date(a, m, 20), 'Vencimento DAS / FGTS Digital (dia 20)', 'pag'); }
  return ev.sort((a, b) => a.data.localeCompare(b.data) || (a.hora || '').localeCompare(b.hora || ''));
}

  const n = $('#ag-n', el); if (n) n.onclick = () => modal('Novo compromisso', `<div class="grid"><div class="fld full"><label for="ag-t">Título</label><input class="inp" id="ag-t" placeholder="Ex.: Exame periódico da equipe"></div><div class="fld"><label for="ag-d">Data</label><input class="inp" type="date" id="ag-d" value="${iso(hoje())}"></div><div class="fld"><label for="ag-hh">Hora</label><input class="inp" type="time" id="ag-hh"></div><div class="fld full"><label for="ag-o">Observação</label><input class="inp" id="ag-o"></div></div>`, { size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="ag-ok">Salvar</button>', onMount: md => $('#ag-ok', md).onclick = () => { const t = $('#ag-t', md).value.trim(), d = $('#ag-d', md).value; if (!t || !d) return toast('Informe título e data.', true); S.data.agenda.push({ id: uid(), titulo: t, data: d, hora: $('#ag-hh', md).value, obs: $('#ag-o', md).value.trim(), tipo: 'manual' }); save('agenda'); closeModal(); vAgenda(el); } });

/* ---------- Alertas gerais (Painel e botão Atenção) ---------- */
function alertasGerais() {
  const at = ativos(), h = hoje(), alertas = [];
  at.forEach(c => {
    const adm = pd(c.admissao); if (!adm) return;
    if (c.tipo === 'experiencia') [[44, '1º prazo'], [89, 'prazo final']].forEach(([n, l]) => { const fim = addD(adm, n), d = diffD(h, fim); if (d >= 0 && d <= 15) alertas.push({ p: d, t: `Experiência de ${c.nome}`, s: `${l} vence em ${fd(iso(fim))} (${d} dia${d === 1 ? '' : 's'})`, cls: 'warn', v: 'colab' }); });
    const st = statusFerias(c);
    if (st.cls === 'bad') alertas.push({ p: -1, t: `Férias vencidas: ${c.nome}`, s: `Limite de concessão era ${fd(iso(st.limite))}`, cls: 'bad', v: 'ferias' });
    else if (st.cls === 'warn') alertas.push({ p: diffD(h, st.limite), t: `Férias a conceder: ${c.nome}`, s: `Conceder até ${fd(iso(st.limite))}`, cls: 'warn', v: 'ferias' });
    if (!c.cpf || !c.pis) alertas.push({ p: 99, t: `Cadastro incompleto: ${c.nome}`, s: `Faltando ${[!c.cpf && 'CPF', !c.pis && 'PIS'].filter(Boolean).join(' e ')}`, cls: 'mut', v: 'colab' });
  });
  const nSol = S.data.solic.filter(x => x.status === 'pendente').length, nDoc = S.data.docs.filter(d => d.status === 'pendente').length, nRev = revisoesPend().length, nFace = S.data.faces.filter(f => f.status === 'pendente').length, nAn = anomalias(7).filter(a => a.g === 'bad').length;
  if (nSol) alertas.push({ p: -3, t: `${nSol} solicitaç${nSol > 1 ? 'ões' : 'ão'} do portal aguardando você`, s: 'Aprove ou recuse em Portal do colaborador', cls: 'warn', v: 'portal' });

/* ---------- 13º salário ---------- */
function calc13(c, ano) {
  const adm = pd(c.admissao), fim = new Date(ano, 11, 31); if (!adm || adm > fim) return null;
  const avos = meses13(adm, fim), sal = num(c.salario);
  const fs = S.data.folhas.filter(f => !f.tipo && f.comp.startsWith(ano + '-') && f.comp < `${ano}-12`).map(f => f.itens.find(i => i.colabId === c.id)).filter(Boolean);
  const media = fs.length ? r2(fs.reduce((s, i) => { const p = i.ponto || {}; return s + num(i.adic) + num(p.he50) + num(p.he100) + num(p.not) + num(p.dsr); }, 0) / fs.length) : 0;
  const total = r2((sal + media) * avos / 12);
  const adiant = S.data.ferias.filter(f => f.colabId === c.id && (f.inicio || '').startsWith(ano + '-')).reduce((s, f) => s + num(f.calc && f.calc.d13), 0);
  const p1 = Math.max(0, r2(total / 2 - adiant)), inss = calcINSS(total), irrf = calcIRRF(total, inss, c.dependentes);
  return { c, avos, sal, media, total, adiant, p1, inss, irrf, p2: r2(total - p1 - adiant - inss - irrf), fgts1: r2((p1 + adiant) * T().fgts), fgts2: r2((total - p1 - adiant) * T().fgts) };
}

/* ---------- Logo da empresa ---------- */
function lerLogo(file) {
  return new Promise((res, rej) => { if (!/^image\//.test(file.type)) return rej(new Error('tipo')); const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, 360 / img.width, 140 / img.height), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/png')); };
    img.onerror = () => rej(new Error('img')); img.src = u; });
}

function trctHTML(c) {

  const L = (n, rot, v) => `<td style="width:4%;font-size:10px;color:#555">${n}</td><td><span style="font-size:10px;color:#555">${rot}</span><br><b>${v || '&nbsp;'}</b></td>`;
  const lin = (arr, ini) => arr.map((x, i) => `<tr><td>${ini + i}</td><td>${esc(x[0])}</td><td class="n">${brl(x[1])}</td></tr>`).join('');
  return `<h2 style="text-align:center">Termo de Rescisão do Contrato de Trabalho</h2>
    <table><tr><th colspan="4">Identificação do empregador</th></tr><tr>${L('01', 'CNPJ', esc(e.cnpj || '—'))}${L('02', 'Razão social', esc(e.nome || S.tenant.nome))}</tr><tr>${L('03', 'Endereço', esc(e.endereco || ''))}${L('04', 'Município/UF', esc(e.cidade || ''))}</tr></table>
    <table><tr><th colspan="4">Identificação do trabalhador</th></tr><tr>${L('10', 'PIS/PASEP', esc(c.pis || '—'))}${L('11', 'Nome', esc(c.nome))}</tr><tr>${L('12', 'Endereço', esc(c.endereco || ''))}${L('13', 'Município/UF', esc(c.cidade || ''))}</tr><tr>${L('17', 'CPF', esc(c.cpf || '—'))}${L('18', 'Data de nascimento', fd(c.nascimento))}</tr></table>
    <table><tr><th colspan="4">Dados do contrato</th></tr><tr>${L('21', 'Tipo de contrato', esc((TIPOS_CONTRATO[c.tipo] || '').split(' (')[0]))}${L('22', 'Causa do afastamento', esc(c.motivoDeslig || '—'))}</tr><tr>${L('24', 'Data de admissão', fd(c.admissao))}${L('26', 'Data de afastamento', fd(c.desligamento))}</tr><tr>${L('23', 'Remuneração mês anterior', brl(c.salario))}${L('27', 'Código de afastamento', '')}</tr></table>
    <table><tr><th colspan="3">Discriminação das verbas rescisórias</th></tr><tr><th style="width:6%">Rubrica</th><th>Descrição</th><th class="n">Valor</th></tr>${lin(r.prov, 50)}<tr><th colspan="2">Total bruto</th><th class="n">${brl(tp)}</th></tr>
      <tr><th colspan="3">Deduções</th></tr>${lin(r.desc, 100)}<tr><th colspan="2">Total de deduções</th><th class="n">${brl(td)}</th></tr><tr><th colspan="2">Valor líquido</th><th class="n">${brl(r.liq)}</th></tr></table>
    <p style="font-size:12px">Foi realizada a rescisão do contrato de trabalho do trabalhador acima qualificado, nos termos do art. 477 da CLT, sendo paga a quantia líquida de <b>${brl(r.liq)}</b>, que o trabalhador declara ter recebido, dando quitação apenas das parcelas e valores aqui discriminados.</p>
    <div class="ass"><div>Empregador ou preposto</div><div>Trabalhador</div></div><p style="font-size:11px;color:#555">Código de afastamento (campo 27) conforme a tabela do eSocial utilizada pela contabilidade.</p>`;
}

/* ---------- Ponto externo autorizado ---------- */
function externoAtivo(cid, dia = iso(hoje())) { return (S.data.externos || []).find(x => x.colabId === cid && x.de <= dia && x.ate >= dia); }
function painelExterno(bi, re) {
  const hojeS = iso(hoje()), l = (S.data.externos || []).filter(x => x.ate >= hojeS).sort((a, b) => a.de.localeCompare(b.de)), ed = podeEditar();
  bi.insertAdjacentHTML('beforeend', `<section class="panel" style="margin-top:16px"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Ponto externo autorizado</h2><span class="sp"></span>${ed ? '<button class="btn sm" id="ex-novo">Autorizar ponto externo</button>' : ''}</div>
    <p class="hint" style="margin-top:0">Para entregas, visitas a clientes, eventos ou trabalho em outro local: no período autorizado, o ponto fora da loja é aceito sem cair como "fora da cerca". O celular cadastrado e a biometria continuam valendo.</p>
    ${l.length ? `<ul class="list">${l.map(x => `<li><div class="t"><div>${esc((colabById(x.colabId) || {}).nome || '—')} · ${fd(x.de)}${x.ate !== x.de ? ' a ' + fd(x.ate) : ''}</div><div>${esc(x.motivo)} · por ${esc(x.por || '')}</div></div>${x.de <= hojeS ? '<span class="pill ok">Hoje</span>' : '<span class="pill">Agendado</span>'}${ed ? `<button class="btn ghost sm" data-exx="${x.id}" style="color:var(--bad)">Cancelar</button>` : ''}</li>`).join('')}</ul>` : '<div class="empty">Nenhuma autorização ativa.</div>'}</section>`);
  const n = $('#ex-novo', bi); if (n) n.onclick = () => { const at = ativos().filter(c => c.tipo !== 'pj').sort((a, b) => a.nome.localeCompare(b.nome)); if (!at.length) return toast('Cadastre funcionários primeiro.', true);
    modal('Autorizar ponto externo', `<div class="grid"><div class="fld full"><label for="ex-c">Funcionário</label><select class="inp" id="ex-c">${opts(at.map(c => [c.id, c.nome]), at[0].id)}</select></div>
      <div class="fld"><label for="ex-d">De</label><input class="inp" type="date" id="ex-d" value="${hojeS}"></div><div class="fld"><label for="ex-a">Até</label><input class="inp" type="date" id="ex-a" value="${hojeS}"></div>
      <div class="fld full"><label for="ex-m">Motivo</label><input class="inp" id="ex-m" placeholder="Ex.: entrega para cliente no centro, feira na cidade vizinha"></div></div>`, {
      size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="ex-ok">Autorizar</button>', onMount: m => $('#ex-ok', m).onclick = () => { const de = $('#ex-d', m).value, ate = $('#ex-a', m).value, mot = $('#ex-m', m).value.trim(), c = colabById($('#ex-c', m).value);
        if (!de || !ate || ate < de) return toast('Confira as datas.', true); if (!mot) return toast('Informe o motivo.', true); if (diffD(pd(de), pd(ate)) > 31) return toast('Autorize no máximo 31 dias por vez.', true);
        S.data.externos.push({ id: uid(), colabId: c.id, de, ate, motivo: mot, por: S.user.nome, em: new Date().toISOString() }); save('externos'); audit(`Autorizou ponto externo de ${c.nome} (${fd(de)} a ${fd(ate)}): ${mot}`); closeModal(); toast('Ponto externo autorizado.'); re(); } }); };
  $$('[data-exx]', bi).forEach(b => b.onclick = () => { S.data.externos = S.data.externos.filter(x => x.id !== b.dataset.exx); save('externos'); audit('Cancelou autorização de ponto externo'); re(); });
}

/* ---------- Cadastro completo ---------- */
const CAMPOS_CAD = [['cpf', 'CPF'], ['rg', 'RG'], ['pis', 'PIS'], ['nascimento', 'Nascimento'], ['telefone', 'Telefone'], ['email', 'E-mail'], ['endereco', 'Endereço'], ['cep', 'CEP'], ['cidade', 'Cidade'], ['banco', 'Banco/PIX']];
const faltando = c => CAMPOS_CAD.filter(([k]) => !String(c[k] || '').trim()).map(x => x[1]);
const pctCadastro = c => Math.round((1 - faltando(c).length / CAMPOS_CAD.length) * 100);
function blocoCompletude(c) {
  const f = faltando(c), p = pctCadastro(c);
  return `<div style="margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:10px"><div class="row"><b>Cadastro ${p}% completo</b><span class="sp"></span>${f.length && c.portal && c.portal.ativo && podeEditar() ? `<button class="btn ghost sm" onclick="pedirDados('${c.id}')">Pedir pelo portal</button>` : ''}</div>
    <div class="bar" style="margin:8px 0 4px"><i style="width:${p}%;background:${p === 100 ? 'var(--ok)' : p >= 70 ? 'var(--warn)' : 'var(--bad)'}"></i></div>${f.length ? `<div class="hint">Faltam: ${f.join(', ')}</div>` : '<div class="hint">Todos os dados principais preenchidos.</div>'}</div>`;
}
function pedirDados(id) {
  const c = colabById(id), f = faltando(c); if (!f.length) return;
  S.data.chat.push({ id: uid(), colabId: c.id, de: 'rh', texto: `Olá, ${c.nome.split(' ')[0]}! Para completar seu cadastro, precisamos de: ${f.join(', ')}. Envie pelo portal, em Meu perfil > "Pedir alteração de dados". Obrigado!`, em: new Date().toISOString(), por: S.user.nome, lido: false });
  save('chat'); audit(`Pediu dados pendentes a ${c.nome}`); toast('Pedido enviado pelo chat do portal.');
}

/* ---------- Lojas: gestor vê só a própria loja ---------- */
function lojasVisiveis() {
  const me = (S.data.users || []).find(u => u.id === S.user.id) || S.user, minhas = me.role === 'gestor' && (me.lojas || []).length ? me.lojas : null;
  if (minhas) return S.lojaSel && minhas.includes(S.lojaSel) ? [S.lojaSel] : minhas;
  return S.lojaSel ? [S.lojaSel] : null;
}
function noEscopoLoja(c) { const v = lojasVisiveis(); return !v || v.includes(c.loja); }
function escolherLojasUsuario(uidU, depois) {
  const u = S.data.users.find(x => x.id === uidU), lojas = S.data.config.lojas || [];
  modal(`Lojas de ${u.nome}`, `<p class="hint" style="margin-top:0">O gestor só verá funcionários, ponto e relatórios das lojas marcadas. Sem nenhuma marcada, vê todas.</p>${lojas.map(l => `<label class="check-row"><input type="checkbox" value="${l.id}" ${(u.lojas || []).includes(l.id) ? 'checked' : ''}> <span>${esc(l.nome)}</span></label>`).join('')}`, {
    size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="lu-ok">Salvar</button>', onMount: m => $('#lu-ok', m).onclick = () => { u.lojas = $$('input:checked', m).map(i => i.value); save('users'); audit(`Definiu as lojas do gestor ${u.nome}`); closeModal(); toast('Lojas do gestor salvas.'); depois(); } });
}

/* ---------- Página pública de vagas ---------- */
const publicoVaga = () => { const e = S.data.config.empresa || {}; return { empresa: e.nome || S.tenant.nome, cidade: e.cidade || '', logo: e.logo || null, retencaoMeses: +S.data.config.recrRetencaoMeses || 6 }; };
function linkVagas() { const u = new URL('vagas.html', location.href); u.search = ''; u.hash = ''; u.searchParams.set('empresa', S.tenant.id); return u.href; }
function modalPaginaVagas() {
  const link = linkVagas(), n = S.data.vagas.filter(v => v.publica && v.status === 'aberta').length, emp = (S.data.config.empresa || {}).nome || S.tenant.nome;
  const txt = `Estamos contratando na ${emp}! Veja as vagas e candidate-se pelo link: ${link}`;
  modal('Página de vagas', `<p style="margin-top:0">${n ? `${n} vaga${n > 1 ? 's publicadas' : ' publicada'}.` : '<b>Nenhuma vaga publicada ainda.</b> Abra uma vaga e clique em "Publicar na página".'} O candidato preenche os dados, anexa o currículo e cai direto na coluna Triagem.</p>
    <div class="fld"><label for="pv-l">Link para divulgar (Instagram, WhatsApp, Google)</label><input class="inp" id="pv-l" value="${esc(link)}" readonly></div>`, {
    size: 'sm', foot: `<a class="btn sec" href="${esc(link)}" target="_blank" rel="noopener">Abrir página</a><button class="btn sec" id="pv-cp">Copiar link</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Divulgar no WhatsApp</a>`,
    onMount: m => $('#pv-cp', m).onclick = () => navigator.clipboard.writeText(link).then(() => toast('Link copiado.'), () => toast('Selecione e copie o link.', true)) });
}
function verCurriculo(c) { const a = c.curriculo; if (!a || !a.data) return toast('Sem currículo anexado.', true);
  modal(`Currículo — ${c.nome}`, /pdf/.test(a.tipo) ? `<iframe src="${a.data}" title="Currículo" style="width:100%;height:70vh;border:0"></iframe>` : `<img src="${a.data}" alt="Currículo" style="width:100%;border-radius:8px">`, { size: 'lg', foot: `<a class="btn sec" href="${a.data}" download="${esc(a.nome || 'curriculo')}">Baixar</a>` }); }

/* ---------- Espelhos: quem assinou e cobrança ---------- */
const espelhoAssinado = (cid, comp) => S.data.assin.find(a => a.colabId === cid && a.tipo === 'espelho' && a.ref === comp);
function cobrarEspelhos(comp, lista) {
  const falta = lista.filter(c => !espelhoAssinado(c.id, comp) && c.portal && c.portal.ativo);
  if (!falta.length) return toast('Todos com acesso ao portal já assinaram.');
  falta.forEach(c => S.data.chat.push({ id: uid(), colabId: c.id, de: 'rh', texto: `Olá, ${c.nome.split(' ')[0]}! O espelho de ponto de ${mesNome(comp)} está disponível para assinatura no portal, em "Espelho de ponto". Confira e assine, por favor.`, em: new Date().toISOString(), por: S.user.nome, lido: false }));
  save('chat'); audit(`Cobrou assinatura do espelho de ${mesNome(comp)} de ${falta.length} funcionário(s)`); toast(`Lembrete enviado para ${falta.length} funcionário(s).`);
}

/* ---------- Licenciamento ----------
   Formato: NXM-PPDD-TTTT-CCCC
   PP = plano (ES/PR/EM), DD = meses (base 36), TTTT = hash do tenant, CCCC = checksum.
   As chaves são geradas no Painel do Dono (nexum_admin.html). O SEGREDO precisa ser igual nos dois arquivos. */
const SEGREDO = 'nx-fed54b4be9eec3be635eaadb';
const PL_COD = { essencial: 'ES', profissional: 'PR', empresa: 'EM' };
function h4(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return (h % 1679616).toString(36).toUpperCase().padStart(4, '0'); }
function validarChave(k, tid) {
  const m = String(k).trim().toUpperCase().match(/^NXM-([A-Z]{2})([0-9A-Z]{2})-([0-9A-Z]{4})-([0-9A-Z]{4})$/); if (!m) return null;
  const plano = Object.keys(PL_COD).find(p => PL_COD[p] === m[1]); if (!plano) return null;
  if (m[3] !== h4(tid) || m[4] !== h4(m[1] + m[2] + m[3] + SEGREDO)) return null;
  return { plano, dias: parseInt(m[2], 36) * 30 };
}

document.documentElement.dataset.theme = localStorage.getItem('nexum:tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

(function avisoFirebase() {
  let msg = '';
  if (FIREBASE_CONFIG.apiKey && location.protocol === 'file:') msg = 'Você abriu o arquivo direto do computador. O Firebase só funciona com o sistema hospedado (ex.: GitHub Pages). Aqui ele roda em modo local, com dados só neste navegador.';
  else if (FIREBASE_CONFIG.apiKey && typeof firebase === 'undefined') msg = 'Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.';
  if (!msg) return;
  const el = document.createElement('div'); el.setAttribute('role', 'alert');
  el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:90;background:#B42318;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 44px 10px 16px;text-align:center';
  el.innerHTML = msg + '<button aria-label="Fechar aviso" style="position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer">×</button>';
  el.querySelector('button').onclick = () => el.remove(); document.body.appendChild(el);
})();

  } catch (e) { }
  renderAuth();
})();
