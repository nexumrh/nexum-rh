<style>
:root{
  --ink:#0A1733;--ink2:#13244D;--ink3:#26406F;
  --bg:#F4F4F8;--card:#FFFFFF;--line:#E2E1EC;--line2:#EEEDF4;
  --txt:#1B1A2E;--mut:#696784;
  --pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;
  --soft:#FAFAFC;--hover:#F7F6FB;
  --r:10px;--rs:6px;
  --f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
#root{height:100%;min-height:100vh;min-height:100dvh}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- Login ---------- */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;min-height:100dvh}
.auth-art{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px)}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%}
.auth-art>*:not(canvas){position:relative}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.02em}
.brand .marca{height:30px;width:auto;display:block}
.brand-sub{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:500;font-size:.9em;letter-spacing:.06em;color:rgba(255,255,255,.72);line-height:1.1}
.brand small{font-weight:500;opacity:.6;letter-spacing:0}
.auth-claim{font-size:clamp(34px,4.6vw,60px);font-weight:700;line-height:1.02;letter-spacing:-.035em;max-width:11ch}
.auth-sub{opacity:.72;max-width:40ch;margin-top:16px}
.auth-foot{font-size:13px;opacity:.5}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--card)}
.auth-box{width:100%;max-width:400px}
.seg{display:flex;background:var(--bg);border-radius:var(--r);padding:4px;margin-bottom:28px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(10,23,51,.12)}

/* ---------- Form ---------- */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}
.inp.err{border-color:var(--bad)}
textarea.inp{min-height:90px;resize:vertical}
.grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:9px 16px;min-height:40px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--pri);padding:6px 10px;min-height:32px}
.btn.ghost:hover{background:var(--pri-s)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;height:100dvh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.side .brand{padding:4px 8px 22px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.66);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side-foot .who{font-weight:600}
.side-foot .role{opacity:.55}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:20px}
.menu-btn{display:none;border:0;background:none;padding:6px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px)}
.wrap{max-width:1240px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.pill.mut{background:var(--line2);color:var(--mut)}
.banner{padding:10px 16px;background:var(--warn-s);color:var(--warn);font-size:14px;font-weight:500;border-bottom:1px solid #F1DDB8}
.banner.bad{background:var(--bad-s);color:var(--bad);border-color:#F2C9C9}

/* ---------- Blocks ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.panel h2{font-size:16px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--card);padding:18px 20px}
.kpi b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:13.5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}

<script>
/* =====================================================================
   NEXUM RH — Sistema de gestão de RH em formato SaaS
   Arquivo único • PWA-ready • Multiempresa (tenant) • pt-BR
   ---------------------------------------------------------------------
   Camada de dados: objeto Store (localStorage). Para produção com
   Firebase, troque apenas Store.get/Store.set por Firestore mantendo
   a mesma assinatura (tenant, coleção, valor).
   ===================================================================== */

const NEXUM = {
  produto: 'NEXUM RH',
  versao: '1.0.0',
  trialDias: 14,
  linkAssinatura: '', // cole aqui o link de pagamento (ex.: Mercado Pago)
  suporte: '', // seu WhatsApp de suporte com DDD, ex.: '45999999999'
  planos: {
    essencial:    { nome: 'Essencial',    limite: 10,    preco: 49 },
    profissional: { nome: 'Profissional', limite: 50,    preco: 129 },
    empresa:      { nome: 'Empresa',      limite: 99999, preco: 299 }
  },
  /* PIX para os clientes pagarem o plano: coloque aqui a SUA chave PIX (CPF, CNPJ, e-mail, telefone ou chave aleatória) */
  pix: { chave: '', nome: 'NEXUM RH', cidade: 'FOZ DO IGUACU' }
};

/* Tabelas 2026 — editáveis em Configurações > Tabelas legais */
const TAB_PADRAO = {
  ano: 2026,
  salMin: 1621.00,
  inss: [[1621.00, 0.075], [2902.84, 0.09], [4354.27, 0.12], [8475.55, 0.14]],
  irrf: [[2428.80, 0, 0], [2826.65, 0.075, 182.16], [3751.05, 0.15, 394.16], [4664.68, 0.225, 675.49], [1e12, 0.275, 908.73]],
  dep: 189.59, simplificado: 607.20,
  redutorIsencaoAte: 5000.00, redutorLimite: 7350.00, redutorA: 978.62, redutorB: 0.133145,
  fgts: 0.08
};

const ROLES = { admin: 'Administrador', rh: 'RH', gestor: 'Gestor', leitura: 'Somente leitura' };
const COLS = ['colab', 'ponto', 'ferias', 'folhas', 'ocorr', 'users', 'config', 'audit', 'avisos', 'solic', 'docs', 'metas', 'pesq', 'chat', 'bh', 'assin', 'holerites', 'acessos', 'faces', 'bioFalhas', 'adiant', 'vagas', 'cands', 'admis', 'agenda', 'templates', 'dispositivos', 'externos', 'logins', 'diretorio', 'convites', 'comissoes', 'avaliacoes', 'denuncias', 'pensoes', 'propostas', 'admdocs', 'reunioes'];

/* =====================================================================
   FIREBASE — cole a configuração do seu projeto abaixo para ativar
   logins reais (Firebase Authentication) e banco na nuvem (Firestore).
   Com apiKey vazio o sistema roda em modo local (dados salvos só neste navegador).
   Use EXATAMENTE a mesma configuração no RH e no Portal.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDdcLJdO2qnmiGsR1EsKFu-uJfs4FRNvA4',
  authDomain: 'nexum-30044.firebaseapp.com',
  projectId: 'nexum-30044',
  storageBucket: 'nexum-30044.firebasestorage.app',
  messagingSenderId: '988792881104',
  appId: '1:988792881104:web:c0517c2b62b6e9f14603d5'
};
const FB_ON = !!FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined' && location.protocol !== 'file:';
const FB = {
  tid: null, cache: {}, unsubs: [], criando: false, aux: null, escopo: null,
  PROPRIOS: ['ponto', 'ferias', 'solic', 'docs', 'metas', 'chat', 'bh', 'assin', 'holerites', 'acessos', 'faces', 'bioFalhas', 'dispositivos', 'externos', 'logins', 'ocorr', 'comissoes', 'reunioes'],
  LIVRES: ['avisos', 'pesq', 'diretorio'],
  init() { if (!FB_ON) return; /* app com nome próprio: o login do RH não se mistura com o do Painel do Dono nem com o do Portal (mesmo endereço) */ FB.app = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-rh'); FB.auth = FB.app.auth(); FB.db = FB.app.firestore(); FB.auth.languageCode = 'pt-BR'; },
  col(c) { return FB.db.collection('tenants').doc(FB.tid).collection(c); },
  /* Firestore não aceita lista dentro de lista: esses campos viajam como texto */
  _aa(v) { return Array.isArray(v) ? v.some(x => Array.isArray(x) || FB._aa(x)) : (v && typeof v === 'object') ? Object.values(v).some(FB._aa) : false; },
  _ts(v) { if (v && typeof v.toDate === 'function') return v.toDate().toISOString(); if (Array.isArray(v)) return v.map(FB._ts); if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = FB._ts(v[k]); return o; } return v; },
  _srv(v) { if (v === '__SRV__') return firebase.firestore.FieldValue.serverTimestamp(); if (Array.isArray(v)) return v; if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = FB._srv(v[k]); return o; } return v; },
  enc(x) { const o = {}; for (const k in x) { const v = x[k]; if (v === undefined) continue; o[k] = FB._aa(v) ? '\u0001J' + JSON.stringify(v) : v; } return FB._srv(JSON.parse(JSON.stringify(o))); },
  dec(x) { const o = {}; for (const k in x) { const v = x[k]; o[k] = typeof v === 'string' && v.startsWith('\u0001J') ? JSON.parse(v.slice(2)) : FB._ts(v); } return o; },
  _st(x) { return JSON.stringify(x, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, kk) => (a[kk] = v[kk], a), {}) : v); },
  /* abre a empresa: escuta as coleções em tempo real e guarda em cache */
  abrir(tid, cols, escopo) {
    FB.fechar(); FB.tid = tid; FB.cache = {}; FB.escopo = escopo || null;
    return Promise.all(cols.map(c => new Promise(res => {
      let primeiro = true;
      const trata = (dados, pend) => { FB.cache[c] = dados; if (primeiro) { primeiro = false; return res(); } if (!pend) FB.notificar(c); };
      const falha = e => { console.warn('[NEXUM]', c, e.code || e); if (primeiro) { FB.cache[c] = c === 'config' ? {} : []; primeiro = false; res(); } };
      let un;
      if (c === 'config') un = FB.db.doc(`tenants/${tid}/meta/config`).onSnapshot(s => trata(s.exists ? FB.dec(s.data()) : {}, s.metadata.hasPendingWrites), falha);
      else if (escopo && c === 'colab') un = FB.col('colab').doc(escopo.colabId).onSnapshot(s => trata(s.exists ? [FB.dec(s.data())] : [], s.metadata.hasPendingWrites), falha);
      else { let q = FB.col(c); if (escopo && c === 'convites') q = q.where('partes', 'array-contains', escopo.colabId); else if (escopo && FB.PROPRIOS.includes(c)) q = q.where('colabId', '==', escopo.colabId); un = q.onSnapshot(s => trata(s.docs.map(d => FB.dec(d.data())), s.metadata.hasPendingWrites), falha); }
      FB.unsubs.push(un);
    })));
  },
  fechar() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; FB.tid = null; FB.cache = {}; },
  notificar(c) { window.dispatchEvent(new StorageEvent('storage', { key: `nexum:${FB.tid}:${c}` })); },
  get(c, def) { const v = FB.cache[c]; return v === undefined ? def : JSON.parse(JSON.stringify(v)); },
  /* grava só o que mudou (compara com o cache) */
  set(c, v) {
    const ant = FB.cache[c]; FB.cache[c] = JSON.parse(JSON.stringify(v));
    const desfaz = e => { FB.cache[c] = ant; FB.notificar(c); FB.falhou(e); };
    if (c === 'config') { FB.db.doc(`tenants/${FB.tid}/meta/config`).set(FB.enc(v)).catch(desfaz); return; }
    const antes = new Map((ant || []).map(x => [String(x.id), FB._st(x)])), ops = [];
    v.forEach(x => { if (!x || !x.id) return; const id = String(x.id); if (antes.get(id) !== FB._st(x)) ops.push(b => b.set(FB.col(c).doc(id), FB.enc(x))); antes.delete(id); });
    antes.forEach((_, id) => ops.push(b => b.delete(FB.col(c).doc(id))));
    (async () => { for (let i = 0; i < ops.length; i += 400) { const b = FB.db.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); } })().catch(desfaz);
  },
  /* cria login de outra pessoa sem derrubar a sessão de quem está logado */
  async criarLogin(email, senha) {
    if (!FB.aux) { FB.aux = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-aux').auth(); await FB.aux.setPersistence(firebase.auth.Auth.Persistence.NONE); }
    const cr = await FB.aux.createUserWithEmailAndPassword(email, senha); const id = cr.user.uid; await FB.aux.signOut(); return id;
  },
  tenant(s) { const x = s.data(); return { id: s.id, nome: x.nome, cnpj: x.cnpj || '', plano: x.plano, trial: !!x.trial, suspenso: !!x.suspenso, criadoEm: x.criadoEm, expira: iso(addD(x.expiraTs.toDate(), -1)) }; },
  emailColab: (tid, cpf, v) => `c${cpf}.v${v}.${tid}@colab.nexum.app`,
  falhou(e) { console.error('[NEXUM]', e); toast(FB.erro(e), true); },
  erro(e) {
    const c = (e && e.code) || '';
    return ({
      'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/invalid-login-credentials': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'Senha incorreta.', 'auth/user-not-found': 'Usuário não encontrado.',
      'auth/email-already-in-use': 'Este e-mail já tem uma conta. Use outro ou recupere a senha.', 'auth/weak-password': 'Senha fraca: use ao menos 6 caracteres.', 'auth/invalid-email': 'E-mail inválido.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.', 'auth/network-request-failed': 'Sem conexão com a internet.', 'auth/requires-recent-login': 'Por segurança, saia e entre de novo antes de trocar a senha.',
      'auth/operation-not-allowed': 'Ative o login por e-mail/senha no Firebase (Authentication > Sign-in method).', 'auth/unauthorized-domain': 'Adicione este domínio em Authentication > Settings > Authorized domains.',
      'permission-denied': 'Sem permissão para esta ação. A licença pode estar expirada ou seu perfil não tem acesso.', 'unavailable': 'Sem conexão com o servidor. Tente de novo.'
    })[c] || ('Erro: ' + ((e && e.message) || c));
  }
};
FB.init();

/* ---------- Store ---------- */
const Store = {
  k: (t, c) => `nexum:${t}:${c}`,
  get(t, c, def) { if (FB_ON && FB.tid === t) return FB.get(c, def); try { const v = localStorage.getItem(this.k(t, c)); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(t, c, v) { if (FB_ON && FB.tid === t) { FB.set(c, v); return true; } try { localStorage.setItem(this.k(t, c), JSON.stringify(v)); return true; } catch (e) { toast('Não foi possível salvar: armazenamento cheio ou bloqueado.', true); return false; } },
  tenants() { try { return JSON.parse(localStorage.getItem('nexum:tenants')) || []; } catch (e) { return []; } },
  saveTenants(l) { localStorage.setItem('nexum:tenants', JSON.stringify(l)); },
  wipe(t) { COLS.forEach(c => localStorage.removeItem(this.k(t, c))); }
};

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => { if (typeof v === 'number') return v; const s = String(v || '').trim().replace(/\s|R\$/g, ''); if (!s) return 0; return parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s) || 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pd = s => { if (!s) return null; const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fd = s => s ? pd(s).toLocaleDateString('pt-BR') : '—';
const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
const diffD = (a, b) => Math.round((b - a) / 864e5);
const anosEntre = (a, b) => { let y = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--; return Math.max(0, y); };
const iniciais = n => String(n || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
const mesNome = c => { const [a, m] = c.split('-'); return new Date(+a, +m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); };
const cpfFmt = v => v.replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
const cnpjFmt = v => v.replace(/\D/g, '').slice(0, 14).replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
const telFmt = v => { const d = v.replace(/\D/g, '').slice(0, 11); return d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3') : d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3').replace(/-$/, ''); };
const cepFmt = v => v.replace(/\D/g, '').slice(0, 8).replace(/(\d{5})(\d)/, '$1-$2');
function cpfValido(c) {
  c = String(c).replace(/\D/g, '');
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  let s = 0; for (let i = 0; i < 9; i++) s += +c[i] * (10 - i);
  let d = (s * 10) % 11 % 10; if (d !== +c[9]) return false;
  s = 0; for (let i = 0; i < 10; i++) s += +c[i] * (11 - i);
  d = (s * 10) % 11 % 10; return d === +c[10];
}
async function sha(txt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

/* ---------- Cálculos trabalhistas ---------- */
const T = () => (S.data.config && S.data.config.tabelas) || TAB_PADRAO;
function calcINSS(base) {
  let tot = 0, ant = 0;
  for (const [lim, al] of T().inss) { if (base > ant) tot += (Math.min(base, lim) - ant) * al; ant = lim; }
  return r2(tot);
}
function calcIRRF(bruto, inss, dep) {
  const t = T();
  const ded = Math.max(inss + (dep || 0) * t.dep, t.simplificado);
  const base = Math.max(0, bruto - ded);
  let imp = 0;
  for (const [lim, al, pdz] of t.irrf) { if (base <= lim) { imp = base * al - pdz; break; } }
  imp = Math.max(0, imp);
  if (bruto <= t.redutorIsencaoAte) imp = 0;
  else if (bruto <= t.redutorLimite) imp = Math.max(0, imp - (t.redutorA - t.redutorB * bruto));
  return r2(imp);
}
function meses13(adm, fim) {
  let n = 0; const y = fim.getFullYear();
  for (let m = 0; m <= fim.getMonth(); m++) {
    const ini = new Date(Math.max(new Date(y, m, 1), adm));
    const fimM = new Date(Math.min(new Date(y, m + 1, 0), fim));
    if (fimM >= ini && diffD(ini, fimM) + 1 >= 15) n++;
  }
  return Math.min(12, n);
}
function periodoAtual(adm, ref) {
  const anos = anosEntre(adm, ref);
  return { ini: addM(adm, anos * 12), anos };
}
function mesesFeriasProp(adm, fim) {
  const { ini } = periodoAtual(adm, fim);
  let n = 0;
  for (let k = 0; k < 12; k++) {
    const ps = addM(ini, k); if (ps > fim) break;
    const pe = addD(addM(ini, k + 1), -1);
    const end = pe < fim ? pe : fim;
    if (diffD(ps, end) + 1 >= 15) n++;
  }
  return Math.min(12, n);
}
function rubricasPonto(i) {
  const p = i.ponto || {}, mn = p.min || {}, h = x => { const v = Math.round(x || 0); return `${Math.floor(v / 60)}h${String(v % 60).padStart(2, '0')}`; }, r = [];
  if (num(p.he50)) r.push([`Horas extras 50% (${h(mn.he50)})`, num(p.he50), 'p']);
  if (num(p.he100)) r.push([`Horas extras 100% (${h(mn.he100)})`, num(p.he100), 'p']);
  if (num(p.not)) r.push([`Adicional noturno 20% (${h(mn.not)})`, num(p.not), 'p']);
  if (num(p.dsr)) r.push(['DSR sobre extras e noturno', num(p.dsr), 'p']);
  if (num(p.faltas)) r.push([`Faltas (${mn.faltas} dia${mn.faltas === 1 ? '' : 's'})`, num(p.faltas), 'd']);
  if (num(p.dsrFalta)) r.push([`DSR perdido (${mn.semanasFalta} semana${mn.semanasFalta === 1 ? '' : 's'})`, num(p.dsrFalta), 'd']);
  if (num(p.atraso)) r.push([`Atrasos (${h(mn.atraso)})`, num(p.atraso), 'd']);
  return r;
}
function folhaItem(i) {
  const p = i.ponto || {}, prov = r2(num(i.sal) + num(i.adic) + num(i.adicFix) + num(p.he50) + num(p.he100) + num(p.not) + num(p.dsr)), dBase = r2(num(p.faltas) + num(p.dsrFalta) + num(p.atraso) + num(i.afastV));
  const base = Math.max(0, r2(prov - dBase)), inss = calcINSS(base), irrf = calcIRRF(Math.max(0, base - num(i.pensao)), inss, i.dep), desc = r2(inss + irrf + num(i.desc) + dBase + num(i.pensao) + num(i.benDesc) + num(i.contrib));
  return { bruto: prov, base, dBase, inss, irrf, desc, liq: r2(prov - desc + num(i.salFam)), pensao: num(i.pensao), salFam: num(i.salFam), fgts: r2(base * T().fgts) };
}

/* ---------- Estado ---------- */
const S = { tenant: null, user: null, view: 'dash', data: {} };
function load() { COLS.forEach(c => S.data[c] = Store.get(S.tenant.id, c, c === 'config' ? {} : [])); }
function save(c) { Store.set(S.tenant.id, c, S.data[c]); if (c === 'colab') sincDiretorio(); }
function audit(acao) {
  S.data.audit.unshift({ id: uid(), em: new Date().toISOString(), por: S.user.nome, acao });
  S.data.audit = S.data.audit.slice(0, 500); save('audit');
}
const colabById = id => S.data.colab.find(c => c.id === id);
const ativos = () => S.data.colab.filter(c => c.status !== 'desligado' && c.status !== 'admissao' && noEscopoLoja(c));
function licenca() {
  const t = S.tenant; const exp = pd(t.expira); const d = diffD(hoje(), exp);
  return { ativa: d >= 0 && !t.suspenso, suspenso: !!t.suspenso, dias: d, plano: NEXUM.planos[t.plano] || NEXUM.planos.essencial, trial: !!t.trial };
}
const can = (...roles) => roles.includes(S.user.role);
const podeEditar = () => S.user.role !== 'leitura' && licenca().ativa;

/* ---------- UI helpers ---------- */
function toast(msg, bad) {
  $$('.toast').forEach(t => t.remove()); const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg;
  el.setAttribute('role', 'status'); document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
let _onClose = null;
function modal(title, body, { foot = '', size = '', onMount, onClose } = {}) {
  closeModal(true);
  const root = $('#modal-root');
  root.innerHTML = `<div class="ov" data-close><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div></div>`;
  const ov = $('.ov', root);
  ov.addEventListener('click', e => { if (e.target.hasAttribute('data-close')) closeModal(); });
  document.addEventListener('keydown', escClose);
  const f = $('input,select,textarea', root); if (f) setTimeout(() => f.focus(), 30);
  _onClose = onClose || null;
  if (onMount) onMount($('.modal', root));
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal(silencioso) { const f = _onClose; _onClose = null; $('#modal-root').innerHTML = ''; document.removeEventListener('keydown', escClose); if (f && !silencioso) f(); }

  modal('Confirmar ação', `<p style="margin:0">${msg}</p>`, {
    size: 'sm', foot: `<button class="btn sec" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : ''}" id="cf-ok">${esc(label)}</button>`,
    onMount: m => $('#cf-ok', m).onclick = () => { closeModal(); ok(); }
  });
}
function formData(el) { const o = {}; $$('[name]', el).forEach(i => o[i.name] = i.type === 'checkbox' ? i.checked : i.value.trim()); return o; }
function opts(list, sel) { return list.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join(''); }
function colabOpts(sel, soAtivos = true) { return opts((soAtivos ? ativos() : S.data.colab).slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(c => [c.id, c.nome]), sel); }
function masks(root) {
  $$('[data-mask]', root).forEach(i => i.addEventListener('input', () => {
    const f = { cpf: cpfFmt, cnpj: cnpjFmt, tel: telFmt, cep: cepFmt }[i.dataset.mask]; if (f) i.value = f(i.value);
  }));
}
function printDoc(titulo, html) {
  const e = S.data.config.empresa || {};
  const w = window.open('', '_blank');
  if (!w) { toast('Permita pop-ups para imprimir.', true); return; }
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>
    body{font-family:Georgia,'Times New Roman',serif;color:#111;margin:32px;font-size:13.5px;line-height:1.6}
    header{display:flex;justify-content:space-between;border-bottom:2px solid #0A1733;padding-bottom:10px;margin-bottom:22px;font-family:Arial,sans-serif}
    header b{font-size:16px}h2{text-align:center;font-family:Arial,sans-serif;font-size:16px;margin:0 0 18px}
    table{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px;margin:10px 0}
    th,td{border:1px solid #bbb;padding:5px 7px;text-align:left}td.n,th.n{text-align:right}
    .ass{margin-top:60px;display:flex;gap:40px}.ass div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px;font-family:Arial,sans-serif;font-size:12px}
    h3{font-family:Arial,sans-serif;font-size:14px;margin:18px 0 8px}.ass small{color:#555;font-size:10.5px}p{text-align:justify}.pb{page-break-after:always}footer{margin-top:30px;font-size:10px;color:#777;font-family:Arial,sans-serif}
    @media print{body{margin:14mm}}</style></head><body>
    <header><div style="display:flex;gap:14px;align-items:center">${e.logo ? `<img src="${e.logo}" alt="" style="max-height:52px;max-width:170px">` : ''}<div><b>${esc(e.nome || S.tenant.nome)}</b><br>CNPJ ${esc(e.cnpj || S.tenant.cnpj || '—')}</div></div><div style="text-align:right">${esc(e.cidade || '')}<br>${new Date().toLocaleDateString('pt-BR')}</div></header>
    ${html}<footer>Gerado pelo NEXUM RH em ${new Date().toLocaleString('pt-BR')}</footer>
    <script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);
  if (html.includes('class="rp"')) w.document.querySelectorAll('body > header, body > footer').forEach(x => x.remove()); w.document.close();
}
function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function novoTenant(d, idFixo) {
  const base = (idFixo || d.empresa.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12)) || 'empresa';
  let id = idFixo || base + Math.floor(100 + Math.random() * 900);
  const lista = Store.tenants();
  while (!idFixo && lista.some(x => x.id === id)) id = base + Math.floor(100 + Math.random() * 900);
  const t = { id, nome: d.empresa, cnpj: d.cnpj || '', telefone: d.telefone || '', email: d.email || '', aceiteTermos: { versao: '1.0', em: new Date().toISOString() }, plano: d.plano || 'profissional', trial: true, criadoEm: iso(hoje()), expira: iso(addD(hoje(), NEXUM.trialDias)) };
  Store.saveTenants([...lista.filter(x => x.id !== id), t]);
  Store.set(id, 'users', [{ id: uid(), nome: d.nome, email: d.email, role: 'admin', hash: await sha(id + ':' + d.senha), ativo: true }]);
  Store.set(id, 'config', { empresa: { nome: d.empresa, cnpj: d.cnpj || '', cidade: '', endereco: '', responsavel: d.nome }, tabelas: JSON.parse(JSON.stringify(TAB_PADRAO)), jornada: 44 });
  ['colab', 'ponto', 'ferias', 'folhas', 'ocorr', 'audit'].forEach(c => Store.set(id, c, []));
  return t;
}


function entrar(t, u) {
  S.tenant = t; S.user = u; localStorage.setItem('nexum:ultimo', t.id);
  sessionStorage.setItem('nexum:sess', JSON.stringify({ t: t.id, u: u.id }));
  load(); stopNet(); renderApp();
}
function sair() { sessionStorage.removeItem('nexum:sess'); S.tenant = S.user = null; if (FB_ON) { FB.fechar(); FB.auth.signOut(); } renderAuth(); }

/* ---------- Firebase: criação de empresa e entrada ---------- */
async function fbCriarEmpresa(d, form) {
  const b = form.querySelector('button[type=submit]'); b.disabled = true; FB.criando = true;
  try {
    const cr = await FB.auth.createUserWithEmailAndPassword(d.email, d.senha), u = cr.user.uid;
    const base = d.empresa.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 10) || 'empresa';
    const tid = base + Math.random().toString(36).slice(2, 6);
    const b1 = FB.db.batch();
    b1.set(FB.db.doc(`tenants/${tid}`), { nome: d.empresa, cnpj: d.cnpj || '', telefone: d.telefone || '', email: d.email, aceiteTermos: { versao: '1.0', em: new Date().toISOString() }, plano: d.plano || 'profissional', trial: true, criadoEm: iso(hoje()), ownerUid: u, expiraTs: firebase.firestore.Timestamp.fromDate(addD(hoje(), NEXUM.trialDias)) });
    b1.set(FB.db.doc(`users/${u}`), { tenantId: tid, tipo: 'rh', role: 'admin', nome: d.nome, email: d.email, ativo: true });
    await b1.commit();
    const b2 = FB.db.batch();
    b2.set(FB.db.doc(`tenants/${tid}/meta/config`), FB.enc({ empresa: { nome: d.empresa, cnpj: d.cnpj || '', cidade: '', endereco: '', responsavel: d.nome }, tabelas: JSON.parse(JSON.stringify(TAB_PADRAO)), jornada: 44 }));
    b2.set(FB.db.doc(`tenants/${tid}/users/${u}`), { id: u, nome: d.nome, email: d.email, role: 'admin', ativo: true });
    await b2.commit();
    FB.criando = false; await fbEntrarRH(cr.user);
    toast(`Empresa criada. Código para o portal dos colaboradores: ${tid}`);
  } catch (err) { FB.criando = false; toast(FB.erro(err), true); b.disabled = false; }
}
async function fbEntrarRH(user) {
  try {
    const m = await FB.db.doc(`users/${user.uid}`).get();
    if (!m.exists || m.data().tipo !== 'rh') { await FB.auth.signOut(); return toast('Este login não é de um usuário do RH. Colaboradores entram pelo Portal.', true); }
    const u = m.data(); if (u.ativo === false) { await FB.auth.signOut(); return toast('Seu acesso foi bloqueado pelo administrador.', true); }
    const t = FB.tenant(await FB.db.doc(`tenants/${u.tenantId}`).get());
    await FB.abrir(t.id, COLS);
    entrar(t, { id: user.uid, nome: u.nome, email: u.email, role: u.role, ativo: true });
    if (FB.unTenant) FB.unTenant();
    FB.unTenant = FB.db.doc(`tenants/${t.id}`).onSnapshot(s => { if (!s.exists || !S.tenant || S.tenant.id !== t.id) return; const n = FB.tenant(s), mudou = ['plano', 'trial', 'suspenso', 'expira'].some(k => n[k] !== S.tenant[k]); Object.assign(S.tenant, n); if (mudou) { renderApp(); toast(licenca().ativa ? 'Sua licença foi atualizada.' : 'A licença desta empresa mudou.'); } }, () => { });
  } catch (err) { FB.falhou(err); await FB.auth.signOut(); }
}

/* Animação da rede (tela de login) */
let netRAF = null;
function startNet() {
  const cv = $('#net'); if (!cv) return;
  const ctx = cv.getContext('2d'); const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, pts;
  const size = () => {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 11000);
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: Math.random() < .12 ? 3 : 1.6 }));
  };
  const frame = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) { if (!reduz) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; } }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 120) { ctx.strokeStyle = `rgba(77,141,255,${(1 - d / 120) * .35})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of pts) { ctx.fillStyle = p.r > 2 ? '#4D8DFF' : 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    if (!reduz) netRAF = requestAnimationFrame(frame);
  };
  size(); frame(); window.onresize = () => { size(); if (reduz) frame(); };
}
function stopNet() { if (netRAF) cancelAnimationFrame(netRAF); netRAF = null; window.onresize = null; }

        d.salario = num(d.salario); d.dependentes = parseInt(d.dependentes) || 0; const xx = lerX(); if (!xx) return; Object.assign(d, xx);
        if (id) { const nomeEsc = x => (listaEscalas(S.data.config).find(e => e.id === x) || {}).nome; registrarHist(c, 'salario', num(c.salario), d.salario); registrarHist(c, 'cargo', c.cargo, d.cargo); registrarHist(c, 'escala', nomeEsc(escalaDe(c, S.data.config).id), nomeEsc(d.escalaId)); registrarHist(c, 'status', c.status, d.status); Object.assign(c, d); audit(`Editou o cadastro de ${d.nome}`); }

}

  return min;
}

/* ---------- Férias ---------- */
function statusFerias(c) {
  const adm = pd(c.admissao), h = hoje();
  if (!adm || c.tipo === 'pj') return { cls: 'mut', txt: 'Não se aplica' };
  const anos = anosEntre(adm, h);
  const gozados = S.data.ferias.filter(f => f.colabId === c.id).reduce((s, f) => s + num(f.dias) + (f.abono ? 10 : 0), 0);
  const direito = anos * 30; const saldo = direito - gozados;
  if (anos === 0) return { cls: 'ok', txt: 'Em aquisição', aquis: adm, limite: addM(adm, 24), saldo: 0 };
  const periodoVenc = Math.floor(gozados / 30); // primeiro período com saldo
  const iniAq = addM(adm, periodoVenc * 12); const limite = addD(addM(iniAq, 24), -1);
  if (saldo <= 0) return { cls: 'ok', txt: 'Em dia', aquis: addM(adm, anos * 12), limite: addM(adm, anos * 12 + 24), saldo: 0 };
  const d = diffD(h, limite);
  return { cls: d < 0 ? 'bad' : d <= 90 ? 'warn' : 'ok', txt: d < 0 ? 'Vencidas' : `${saldo} dias disponíveis`, aquis: iniAq, limite, saldo };
}
function calcFerias(c, dias, abono, adiant13) {
  const sal = num(c.salario), v = r2(sal / 30 * dias), terco = r2(v / 3);
  const ab = abono ? r2(sal / 30 * 10) : 0, abT = abono ? r2(ab / 3) : 0;
  const d13 = adiant13 ? r2(sal / 2) : 0;
  const trib = v + terco; const inss = calcINSS(trib); const irrf = calcIRRF(trib, inss, c.dependentes);
  return { v, terco, ab, abT, d13, inss, irrf, liq: r2(v + terco + ab + abT + d13 - inss - irrf) };
}

/* ---------- Rescisão ---------- */
const MOTIVOS = {
  sjc: 'Dispensa sem justa causa', pd: 'Pedido de demissão', jc: 'Dispensa por justa causa', acordo: 'Acordo entre as partes (art. 484-A)',
  fimexp: 'Término do contrato de experiência', antexp_emp: 'Rescisão antecipada da experiência pelo empregador (art. 479)', antexp_col: 'Rescisão antecipada da experiência pelo colaborador (art. 480)'
};
function calcResc(p) {
  const sal = num(p.sal), adm = pd(p.adm), dem = pd(p.dem), mot = p.motivo;
  const prov = [], desc = [], info = [];
  const dia = Math.min(30, dem.getDate()); const saldo = r2(sal / 30 * dia);
  prov.push([`Saldo de salário (${dia} dias)`, saldo]);
  const anos = anosEntre(adm, dem); const avisoDias = Math.min(90, 30 + 3 * anos);
  let proj = dem;
  if (mot === 'sjc' && p.aviso === 'indenizado') { prov.push([`Aviso prévio indenizado (${avisoDias} dias)`, r2(sal / 30 * avisoDias)]); proj = addD(dem, avisoDias); }
  if (mot === 'sjc' && p.aviso === 'trabalhado' && avisoDias > 30) { prov.push([`Aviso prévio proporcional indenizado (${avisoDias - 30} dias)`, r2(sal / 30 * (avisoDias - 30))]); proj = addD(dem, avisoDias - 30); }
  if (mot === 'acordo' && p.aviso === 'indenizado') { prov.push([`Aviso prévio indenizado 50% (${avisoDias} dias)`, r2(sal / 30 * avisoDias / 2)]); proj = addD(dem, avisoDias); }
  if (mot === 'pd' && p.aviso === 'naocumprido') desc.push(['Aviso prévio não cumprido (art. 487, §2º)', sal]);
  if (mot === 'antexp_emp' || mot === 'antexp_col') {
    const fimPrev = pd(p.fimPrev); const rest = Math.max(0, diffD(dem, fimPrev));
    const ind = r2(sal / 30 * rest / 2);
    if (mot === 'antexp_emp') prov.push([`Indenização art. 479 (50% de ${rest} dias restantes)`, ind]);
    else desc.push([`Indenização art. 480 (até 50% de ${rest} dias restantes)`, ind]);
  }
  if (mot !== 'jc') {
    const m13 = meses13(adm, proj); if (m13) prov.push([`13º salário proporcional (${m13}/12)`, r2(sal / 12 * m13)]);
    const mf = mesesFeriasProp(adm, proj); if (mf) { const v = r2(sal / 12 * mf); prov.push([`Férias proporcionais (${mf}/12)`, v], ['1/3 sobre férias proporcionais', r2(v / 3)]); }
  }
  const nv = parseInt(p.vencidas) || 0;
  if (nv) prov.push([`Férias vencidas (${nv} período${nv > 1 ? 's' : ''})`, r2(sal * nv)], ['1/3 sobre férias vencidas', r2(sal * nv / 3)]);
  const inssS = calcINSS(saldo); if (inssS) desc.push(['INSS sobre saldo de salário', inssS]);
  const v13 = (prov.find(x => x[0].startsWith('13º')) || [0, 0])[1];
  const inss13 = calcINSS(v13); if (inss13) desc.push(['INSS sobre 13º', inss13]);
  if (num(p.outrosDesc)) desc.push(['Outros descontos', num(p.outrosDesc)]);
  const tp = r2(prov.reduce((s, x) => s + x[1], 0)), td = r2(desc.reduce((s, x) => s + x[1], 0));
  const fg = num(p.fgts);
  const multa = ['sjc', 'antexp_emp'].includes(mot) ? 0.4 : mot === 'acordo' ? 0.2 : 0;
  if (multa) info.push([`Multa rescisória do FGTS (${multa * 100}%) — recolher em guia`, r2(fg * multa)]);
  info.push(['Saque do FGTS', ['sjc', 'antexp_emp', 'fimexp'].includes(mot) ? 'Liberado (100%)' : mot === 'acordo' ? 'Liberado até 80%' : 'Não liberado']);
  info.push(['Seguro-desemprego', ['sjc', 'antexp_emp'].includes(mot) ? 'Pode ter direito (verificar carência)' : 'Sem direito']);
  info.push(['Data projetada do aviso', proj.toLocaleDateString('pt-BR')]);
  info.push(['Prazo de pagamento', `até ${addD(dem, 10).toLocaleDateString('pt-BR')} (10 dias, art. 477 §6º)`]);
  return { prov, desc, info, tp, td, liq: r2(tp - td), avisoDias };
}

function diasTrabalhoPrevistos(c, comp) { const [a, m] = comp.split('-').map(Number), nd = new Date(a, m, 0).getDate(); let n = 0; for (let d = 1; d <= nd; d++) { const dt = new Date(a, m - 1, d), ds = iso(dt); if (c.admissao && ds < c.admissao) continue; if (turnoDia(c, dt, S.data.config) && !emFolga(c, ds)) n++; } return n; }

function diasAfastINSS(c, comp) { const [a, m] = comp.split('-').map(Number), nd = new Date(a, m, 0).getDate(); let n = 0; for (let d = 1; d <= nd; d++) { const ds = iso(new Date(a, m - 1, d)); if (S.data.ocorr.some(o => o.colabId === c.id && o.tipo === 'afast_inss' && (o.inicio || o.data) <= ds && fimOc(o) >= ds)) n++; } return Math.min(30, n === nd ? 30 : n); }

      $('#af-aej', m).onclick = () => { const p = ler(); if (!p) return; const r = gerarAEJ(...p); baixar(`AEJ_${cnpj()}_${p[0]}_${p[1]}.txt`, r.txt, 'text/plain'); audit(`Gerou AEJ de ${fd(p[0])} a ${fd(p[1])}`); toast(`AEJ gerado com ${r.n} marcações.`); };

}

/* ---------- Comissões ---------- */
function diasComissao(comp) { const [a, m] = comp.split('-').map(Number), nd = new Date(a, m, 0).getDate(); let uteis = 0, desc = 0; for (let d = 1; d <= nd; d++) { const dt = new Date(a, m - 1, d); if (dt.getDay() === 0 || feriado(iso(dt), S.data.config)) desc++; else uteis++; } return { uteis, desc }; }
const calcComissao = (vendas, perc, comp) => { const cm = r2(num(vendas) * num(perc) / 100), { uteis, desc } = diasComissao(comp); return { comissao: cm, dsr: uteis ? r2(cm / uteis * desc) : 0 }; };
function vComis(el, comp = S.comisComp || iso(hoje()).slice(0, 7)) {
  S.comisComp = comp; const ed = podeEditar(), { uteis, desc } = diasComissao(comp), padrao = num(S.data.config.comissaoPadrao);
  const pess = ativos().filter(c => c.tipo !== 'pj' && (num(c.comissaoPerc) > 0 || /vend|consult|atend/i.test(c.cargo || '') || S.data.comissoes.some(x => x.colabId === c.id && x.comp === comp))).sort((a, b) => a.nome.localeCompare(b.nome));
  const reg = id => S.data.comissoes.find(x => x.colabId === id && x.comp === comp);
  const folha = S.data.folhas.find(x => !x.tipo && x.comp === comp);
  el.innerHTML = `<div class="row" style="margin-bottom:14px"><input class="inp" type="month" id="cm-c" value="${comp}" style="width:auto" aria-label="Mês"><span class="hint">${uteis} dias úteis · ${desc} domingos e feriados</span><span class="sp"></span>${ed ? '<button class="btn sec" id="cm-csv">Importar vendas (CSV)</button><button class="btn sec" id="cm-pd">% padrão</button><button class="btn" id="cm-f">Lançar na folha</button>' : ''}</div>
    ${pess.length ? `<div class="tbl-wrap"><table><thead><tr><th>Vendedor</th><th class="n">% comissão</th><th class="n">Vendas no mês</th><th class="n">Comissão</th><th class="n">DSR sobre comissão</th><th class="n">Total</th><th></th></tr></thead><tbody>
    ${pess.map(c => { const r = reg(c.id) || {}, perc = r.perc != null ? r.perc : (num(c.comissaoPerc) || padrao), k = calcComissao(r.vendas || 0, perc, comp);
      return `<tr><td><b>${esc(c.nome)}</b><div class="hint">${esc(c.cargo || '')}</div></td><td class="n"><input class="inp" style="width:80px;text-align:right" type="number" step="0.1" min="0" data-cp="${c.id}" value="${perc}" ${ed && !r.lancado ? '' : 'disabled'}></td>
        <td class="n"><input class="inp" style="width:130px;text-align:right" type="number" step="0.01" min="0" data-cv="${c.id}" value="${r.vendas || ''}" placeholder="0,00" ${ed && !r.lancado ? '' : 'disabled'}></td><td class="n">${brl(k.comissao)}</td><td class="n">${brl(k.dsr)}</td><td class="n"><b>${brl(k.comissao + k.dsr)}</b></td><td>${r.lancado ? '<span class="pill ok">Na folha</span>' : ''}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="panel empty"><b>Nenhum vendedor encontrado</b>Aparecem aqui os cargos de venda e quem tiver % de comissão definido.</div>'}
    <p class="note">DSR sobre comissões = comissão ÷ dias úteis × domingos e feriados do mês (Lei 605/1949, art. 7º; Súmula 27 do TST). O vendedor acompanha os valores no portal, em Metas. "Lançar na folha" soma comissão e DSR aos adicionais da folha do mês, que entram na base de INSS, IRRF e FGTS. ${folha ? '' : `Gere a folha de ${mesNome(comp)} antes de lançar.`}</p>`;
  $('#cm-c', el).onchange = e => vComis(el, e.target.value);
  const grava = (id, campo, v) => { let r = reg(id); if (!r) { r = { id: uid(), colabId: id, comp, vendas: 0, perc: num(colabById(id).comissaoPerc) || padrao }; S.data.comissoes.push(r); } r[campo] = num(v); Object.assign(r, calcComissao(r.vendas, r.perc, comp)); r.em = new Date().toISOString(); save('comissoes'); vComis(el, comp); };
  $$('[data-cv]', el).forEach(i => i.onchange = () => grava(i.dataset.cv, 'vendas', i.value));
  $$('[data-cp]', el).forEach(i => i.onchange = () => grava(i.dataset.cp, 'perc', i.value));
  if (!ed) return;
  $('#cm-pd', el).onclick = () => { const v = prompt('Comissão padrão (%) para quem não tem percentual próprio:', padrao || ''); if (v == null) return; S.data.config.comissaoPadrao = num(v); save('config'); vComis(el, comp); };
  $('#cm-csv', el).onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain'; inp.onchange = async () => { const t = await inp.files[0].text(); let ok = 0, falha = [];
    t.split(/\r?\n/).forEach(l => { const p = l.split(/[;\t,](?=[^;\t,]*$)/); if (p.length < 2) return; const chave = p[0].trim(), v = num(p[1].replace(/[R$\s.]/g, '').replace(',', '.')); if (!v && v !== 0) return; const so = chave.replace(/\D/g, '');
      const c = ativos().find(x => so.length === 11 ? (x.cpf || '').replace(/\D/g, '') === so : x.nome.toLowerCase() === chave.toLowerCase()); if (!c) { if (chave && !/vendedor|nome|cpf/i.test(chave)) falha.push(chave); return; }
      let r = reg(c.id); if (r && r.lancado) return; if (!r) { r = { id: uid(), colabId: c.id, comp, perc: num(c.comissaoPerc) || padrao }; S.data.comissoes.push(r); } r.vendas = v; Object.assign(r, calcComissao(v, r.perc, comp)); r.em = new Date().toISOString(); ok++; });
    save('comissoes'); vComis(el, comp); toast(`${ok} vendedor(es) importado(s).${falha.length ? ' Não encontrados: ' + falha.slice(0, 4).join(', ') : ''}`, !!falha.length); }; inp.click(); };
  $('#cm-f', el).onclick = () => { if (!folha) return toast(`Gere a folha de ${mesNome(comp)} em Holerite primeiro.`, true); if (folha.fechada) return toast('Esta folha já está fechada.', true);
    const l = S.data.comissoes.filter(x => x.comp === comp && !x.lancado && (x.comissao || 0) > 0); if (!l.length) return toast('Nada novo para lançar.', true);
    let tot = 0; l.forEach(x => { const it = folha.itens.find(i => i.colabId === x.colabId); if (!it) return; const v = r2(x.comissao + x.dsr); it.adic = r2(num(it.adic) + v); x.lancado = true; tot += v; });
    save('folhas'); save('comissoes'); audit(`Lançou comissões de ${mesNome(comp)} na folha`); toast(`${brl(tot)} em comissões e DSR lançados na folha.`); vComis(el, comp); };
}

/* ---------- Treinamentos ---------- */

const treinoFeito = (cid, tid) => S.data.assin.find(a => a.colabId === cid && a.tipo === 'treinamento' && a.ref === tid);

      <div class="fld full"><label for="tn-d">Descrição</label><textarea class="inp" id="tn-d"></textarea></div><div class="fld"><label for="tn-c">Só para os cargos (opcional)</label><input class="inp" id="tn-c" placeholder="Ex.: vendedor, caixa"></div><div class="fld"><label for="tn-p">Prazo (dias)</label><input class="inp" type="number" min="0" id="tn-p" value="15"></div>

/* ---------- Avaliação da experiência ---------- */
const CRIT_AV = ['Assiduidade e pontualidade', 'Qualidade do trabalho', 'Atendimento ao cliente', 'Trabalho em equipe', 'Cumprimento das normas', 'Iniciativa e aprendizado'];
function avaliarExperiencia(c, fase, depois) {
  const adm = pd(c.admissao), f45 = iso(addD(adm, 44)), f90 = iso(addD(adm, 89));
  modal(`Avaliação da experiência · ${c.nome}`, `<p class="hint" style="margin-top:0">${c.cargo || ''} · admissão ${fd(c.admissao)} · 1º período até ${fd(f45)} · fim da experiência ${fd(f90)}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Critério</th>${[1, 2, 3, 4, 5].map(n => `<th class="n">${n}</th>`).join('')}</tr></thead><tbody>${CRIT_AV.map((k, i) => `<tr><td>${k}</td>${[1, 2, 3, 4, 5].map(n => `<td class="n"><input type="radio" name="av${i}" value="${n}" aria-label="${k}: ${n}" ${n === 3 ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="hint">1 = muito abaixo · 3 = esperado · 5 = acima do esperado</p><div class="fld"><label for="av-o">Pontos fortes e o que melhorar</label><textarea class="inp" id="av-o"></textarea></div><div id="av-r" class="note"></div>`,
    { size: 'lg', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="av-ok">Salvar avaliação</button>', onMount: m => {
      const notas = () => CRIT_AV.map((_, i) => +($(`[name=av${i}]:checked`, m) || {}).value || 3), rec = md => md >= 4 ? 'efetivar' : md >= 3 ? (fase === '45' ? 'prorrogar' : 'efetivar com acompanhamento') : 'encerrar';
      const txt = { efetivar: 'Recomendação: efetivar. O contrato passa a prazo indeterminado ao fim da experiência.', prorrogar: `Recomendação: prorrogar a experiência até ${fd(f90)} e acompanhar de perto. Use o "Termo de prorrogação" em Documentos.`, 'efetivar com acompanhamento': 'Recomendação: efetivar com plano de acompanhamento.', encerrar: `Recomendação: encerrar no término do contrato (${fd(fase === '45' ? f45 : f90)}). Encerrando no prazo, não há aviso prévio nem a indenização do art. 479 da CLT.` };
      const up = () => { const n = notas(), md = n.reduce((a, b) => a + b, 0) / n.length; $('#av-r', m).innerHTML = `Média <b>${md.toFixed(1)}</b>. ${txt[rec(md)]}`; }; $$('input[type=radio]', m).forEach(r => r.onchange = up); up();
      $('#av-ok', m).onclick = () => { const n = notas(), md = r2(n.reduce((a, b) => a + b, 0) / n.length); S.data.avaliacoes.push({ id: uid(), colabId: c.id, fase, notas: n, media: md, recomendacao: rec(md), obs: $('#av-o', m).value.trim(), em: new Date().toISOString(), por: S.user.nome });
        save('avaliacoes'); audit(`Avaliou a experiência de ${c.nome} (${fase} dias)`); closeModal(); toast(`Avaliação salva: ${rec(md)}.`); if (depois) depois(); };
    } });
}

/* ---------- Painel de vencimentos ---------- */
function itensVencimento() {
  const H = iso(hoje()), out = [], add = (c, tipo, data, txt, acao) => out.push({ c, tipo, data, txt, acao, d: diffD(hoje(), pd(data)) });
  ativos().forEach(c => {
    if (c.tipo === 'experiencia' && c.admissao) { const f45 = iso(addD(pd(c.admissao), 44)), f90 = iso(addD(pd(c.admissao), 89)), av = S.data.avaliacoes.filter(a => a.colabId === c.id);
      if (f45 >= iso(addD(hoje(), -3)) && diffD(hoje(), pd(f45)) <= 20) add(c, 'Experiência (45 dias)', f45, av.some(a => a.fase === '45') ? `Avaliado: ${av.find(a => a.fase === '45').recomendacao}` : 'Decida: prorrogar, efetivar ou encerrar', av.some(a => a.fase === '45') ? null : ['aval', '45']);
      else if (f90 >= iso(addD(hoje(), -3)) && diffD(hoje(), pd(f90)) <= 20) add(c, 'Fim da experiência (90 dias)', f90, av.some(a => a.fase === '90') ? `Avaliado: ${av.find(a => a.fase === '90').recomendacao}` : 'Após esta data, o contrato vira prazo indeterminado', av.some(a => a.fase === '90') ? null : ['aval', '90']); }
    const st = statusFerias(c); if (st.limite && st.saldo > 0 && diffD(hoje(), st.limite) <= 90) add(c, 'Férias', iso(st.limite), `${st.saldo} dias a conceder; depois do limite, o pagamento é em dobro (art. 137)`, ['ferias']);
    const meses = +S.data.config.asoMeses || 12; if (c.tipo !== 'pj') { if (c.asoData) { const v = iso(addM(pd(c.asoData), meses)); if (diffD(hoje(), pd(v)) <= 30) add(c, 'Exame periódico (ASO)', v, `Último exame em ${fd(c.asoData)}`, ['aso']); } else if (c.admissao && diffD(pd(c.admissao), hoje()) > 30) add(c, 'Exame periódico (ASO)', iso(addM(pd(c.admissao), meses)), 'Data do último exame não informada', ['aso']); }
    if (/moto|entreg|motorista/i.test(c.cargo || '')) { if (c.cnhValidade) { if (diffD(hoje(), pd(c.cnhValidade)) <= 45) add(c, 'CNH', c.cnhValidade, 'Validade da habilitação', ['cnh']); } else add(c, 'CNH', H, 'Validade da CNH não informada', ['cnh']); }
  });
  S.data.docs.filter(d => d.status === 'pendente' && d.requer !== false && diffD(new Date(d.enviadoEm), hoje()) >= 7).forEach(d => { const c = colabById(d.colabId); if (c && c.status !== 'desligado') add(c, 'Documento sem assinatura', iso(new Date(d.enviadoEm)), d.titulo, ['lembrar', `O documento "${d.titulo}" aguarda a sua assinatura no portal.`]); });
  return out.sort((a, b) => a.d - b.d);
}
function vVenc(el) {
  const l = itensVencimento(), ed = podeEditar();
  const pill = x => x.d < 0 ? `<span class="pill bad">${x.tipo === 'Documento sem assinatura' ? `há ${-x.d} dias` : `venceu há ${-x.d} dia${x.d === -1 ? '' : 's'}`}</span>` : x.d === 0 ? '<span class="pill bad">hoje</span>' : `<span class="pill ${x.d <= 7 ? 'warn' : 'mut'}">em ${x.d} dia${x.d === 1 ? '' : 's'}</span>`;
  const bt = x => !ed || !x.acao ? '' : { aval: `<button class="btn sm" data-va="${x.c.id}|${x.acao[1]}">Avaliar</button>`, ferias: '<button class="btn sec sm" data-vf>Programar</button>', aso: `<button class="btn sec sm" data-vd="${x.c.id}|asoData|Data do último exame (ASO)">Informar</button>`, cnh: `<button class="btn sec sm" data-vd="${x.c.id}|cnhValidade|Validade da CNH">Informar</button>`, lembrar: x.c.portal ? `<button class="btn sec sm" data-vl="${x.c.id}" data-msg="${esc(x.acao[1])}">Lembrar</button>` : '' }[x.acao[0]] || '';
  el.innerHTML = `<div class="kpis" style="margin-bottom:16px"><div class="kpi"><b>${l.filter(x => x.d < 0).length}</b><span>vencidos</span></div><div class="kpi"><b>${l.filter(x => x.d >= 0 && x.d <= 7).length}</b><span>nos próximos 7 dias</span></div><div class="kpi"><b>${l.filter(x => x.d > 7).length}</b><span>mais adiante</span></div></div>
    ${l.length ? `<div class="tbl-wrap"><table><thead><tr><th>Quando</th><th>Funcionário</th><th>O quê</th><th>Detalhe</th><th></th></tr></thead><tbody>${l.map(x => `<tr><td>${fd(x.data)}<div>${pill(x)}</div></td><td><b>${esc(x.c.nome)}</b><div class="hint">${esc(x.c.cargo || '')}</div></td><td>${x.tipo}</td><td>${esc(x.txt)}</td><td class="n">${bt(x)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="panel empty"><b>Nada vencendo</b>Experiência, férias, exames, CNH, treinamentos e documentos estão em dia.</div>'}
    <p class="note">Exame periódico a cada ${+S.data.config.asoMeses || 12} meses (ajuste conforme o PCMSO da empresa, NR-7) <button class="btn ghost sm" id="vc-aso">alterar</button>. Avaliações da experiência ficam no histórico do funcionário.</p>`;
  $$('[data-va]', el).forEach(b => b.onclick = () => { const [id, f] = b.dataset.va.split('|'); avaliarExperiencia(colabById(id), f, () => vVenc(el)); });

/* ---------- Indicadores por loja ---------- */
function indicadoresLoja() {
  const cfg = S.data.config, lojas = [...(cfg.lojas || []), { id: '', nome: 'Sem loja definida' }], a = addM(hoje(), -1), comp = iso(a).slice(0, 7), h12 = iso(addM(hoje(), -12));
  const normal = (cfg.regime || cfg.regimeTrib || 'simples') === 'normal', fator = 1 + 0.08 + 0.1944 * 1.08 + (normal ? 0.278 * 1.1944 : 0);
  return lojas.map(l => { const at = ativos().filter(c => (c.loja || '') === l.id && c.tipo !== 'pj'), desl = S.data.colab.filter(c => (c.loja || '') === l.id && c.status === 'desligado' && (c.desligamento || '') >= h12);
    let he = 0, faltas = 0, atraso = 0; at.forEach(c => { try { const r = pontoDoMes(c, comp); he += (r.he50 || 0) + (r.he100 || 0); faltas += r.faltas || 0; atraso += r.atraso || 0; } catch (e) { } });
    const sal = at.reduce((s, c) => s + num(c.salario), 0), medio = (at.length + (at.length + desl.length)) / 2;
    return { l, n: at.length, sal, custo: r2(sal * fator), he, faltas, atraso, turnover: medio ? Math.round(desl.length / medio * 100) : 0, desl: desl.length, comp };
  }).filter(x => x.n || x.desl);
}

/* ---------- Informe de rendimentos (comprovante anual para o IR) ---------- */
function dadosInforme(c, ano) {
  const r = { trib: 0, inss: 0, irrf: 0, isento: 0, d13: 0, inss13: 0, irrf13: 0, meses: 0 };
  S.data.folhas.filter(f => !f.tipo && (f.comp || '').startsWith(ano + '-') && f.fechada).forEach(f => { const i = f.itens.find(x => x.colabId === c.id); if (!i) return; const k = folhaItem(i); r.trib += k.base; r.inss += k.inss; r.irrf += k.irrf; r.meses++; });
  S.data.ferias.filter(f => f.colabId === c.id && (f.inicio || '').startsWith(ano + '-') && f.calc).forEach(f => { const k = f.calc; r.trib += num(k.v) + num(k.terco); r.inss += num(k.inss); r.irrf += num(k.irrf); r.isento += num(k.ab) + num(k.abT); });
  const reg13 = S.data.folhas.find(f => f.tipo === '13' && f.ano === +ano); if (reg13 && reg13.p2) { const k = calc13(c, +ano); if (k) { r.d13 = k.total; r.inss13 = k.inss; r.irrf13 = k.irrf; } }
  Object.keys(r).forEach(k => r[k] = r2(r[k])); return r;
}

/* ---------- Regimento interno ---------- */
const REGIMENTO_PADRAO = `CAPÍTULO I — DISPOSIÇÕES GERAIS
1. Este regimento estabelece as normas de conduta, disciplina e funcionamento da empresa e se aplica a todos os empregados, estagiários e aprendizes, complementando o contrato de trabalho, a CLT e a convenção coletiva da categoria.
2. O desconhecimento destas normas não justifica o seu descumprimento. Dúvidas devem ser esclarecidas com o RH ou com a gerência.

CAPÍTULO II — JORNADA E REGISTRO DE PONTO
3. O horário de trabalho é o definido na escala de cada empregado, disponível no Portal do Colaborador.
4. É obrigatório registrar o ponto na entrada, na saída e no retorno do intervalo e na saída final, pessoalmente, pelo sistema da empresa. É proibido registrar o ponto por outra pessoa ou pedir que alguém o faça.
5. Horas extras só podem ser realizadas com autorização prévia da gerência.
6. Atrasos, saídas antecipadas e faltas devem ser comunicados à gerência com antecedência sempre que possível, e justificados pelo Portal do Colaborador.
7. O intervalo para repouso e alimentação deve ser integralmente usufruído.

CAPÍTULO III — FALTAS E ATESTADOS
8. Atestados médicos devem ser enviados pelo Portal do Colaborador em até 48 horas após o início do afastamento, com a apresentação do original quando solicitado.
9. As faltas legais são as previstas no art. 473 da CLT e na convenção coletiva.

CAPÍTULO IV — APRESENTAÇÃO E UNIFORME
10. O uso do uniforme e do crachá fornecidos pela empresa é obrigatório durante todo o expediente, mantendo-os limpos e em bom estado.
11. Os empregados devem zelar pela higiene pessoal e pela boa apresentação.

CAPÍTULO V — ATENDIMENTO AO CLIENTE
12. O cliente deve ser tratado com cordialidade, respeito e atenção, recebendo informações claras e verdadeiras sobre preços, condições, garantias e trocas.
13. É proibido discutir com clientes; situações de conflito devem ser levadas à gerência.

CAPÍTULO VI — USO DO CELULAR E DAS REDES SOCIAIS
14. O uso do celular pessoal durante o atendimento é proibido, salvo para as atividades do trabalho ou em caso de urgência.
15. É proibido publicar fotos, vídeos ou informações de clientes, colegas, preços internos ou áreas restritas da empresa sem autorização.

CAPÍTULO VII — CAIXA, VALORES E PATRIMÔNIO
16. Os valores recebidos devem ser registrados no sistema no momento da venda, com a emissão dos comprovantes devidos.
17. Os bens, aparelhos, mercadorias e equipamentos da empresa e de clientes devem ser tratados com zelo, e qualquer dano, perda ou divergência deve ser comunicado imediatamente.

CAPÍTULO VIII — SIGILO E PROTEÇÃO DE DADOS
18. Dados de clientes, colegas e da empresa são confidenciais e só podem ser usados para as atividades do trabalho, conforme a Lei Geral de Proteção de Dados (Lei 13.709/2018).
19. Senhas e acessos aos sistemas são pessoais e intransferíveis.

CAPÍTULO IX — SAÚDE E SEGURANÇA
20. É obrigatório cumprir as normas de segurança e usar os equipamentos de proteção fornecidos.
21. Acidentes de trabalho, por menores que sejam, devem ser comunicados imediatamente à gerência.
22. É proibido trabalhar sob efeito de bebida alcoólica ou substâncias entorpecentes, bem como portá-las nas dependências da empresa.

CAPÍTULO X — CONDUTA E CONVIVÊNCIA
23. Não são tolerados assédio moral ou sexual, discriminação de qualquer natureza, agressões ou ofensas. Situações desse tipo podem ser relatadas ao RH, com garantia de sigilo.
24. É proibido realizar comércio particular nas dependências da empresa sem autorização.

CAPÍTULO XI — MEDIDAS DISCIPLINARES
25. O descumprimento destas normas poderá resultar, conforme a gravidade e a reincidência, em orientação verbal, advertência escrita, suspensão de até 30 dias (CLT, art. 474) ou dispensa por justa causa (CLT, art. 482).
26. Toda medida será aplicada de forma proporcional e imediata ao conhecimento do fato, com registro escrito e ciência do empregado.

CAPÍTULO XII — DISPOSIÇÕES FINAIS
27. Este regimento pode ser atualizado pela empresa, com comunicação prévia aos empregados.
28. Os casos omissos serão resolvidos pela direção, observada a legislação trabalhista.`;
const textoRegimento = () => (S.data.config.regimento || '').trim() || REGIMENTO_PADRAO;

/* =====================================================================
   BIOMETRIA FACIAL — face-api.js (roda no aparelho, sem enviar vídeo)
   Reconhecimento: código numérico do rosto (128 valores) comparado ao cadastro aprovado.
   Prova de vida: movimentos SORTEADOS (virar o rosto, abrir a boca, piscar) e rosto único durante toda a sessão.
   ===================================================================== */
const BIO = {
  URL: 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/',
  /* distância máxima entre dois rostos para serem a mesma pessoa. Medido com o modelo real:
     pessoas diferentes ficam acima de 0,51; o mesmo rosto em condições diferentes, abaixo de 0,35 */
  RIGOR: { rigoroso: 0.40, padrao: 0.45, flexivel: 0.50 },
  LIM_OK: 0.45, LIM_DUV: 0.53,
  MARGEM: 0.06,       // no totem (1:N), o 2º colocado precisa ficar pelo menos isto mais longe
  SEMELHANTE: 0.50,   // dois cadastros abaixo disto são considerados a mesma pessoa
  TEXTO: { rosto: 'Olhe para a câmera', piscar: 'Pisque os olhos devagar', esq: 'Vire o rosto para a sua ESQUERDA', dir: 'Vire o rosto para a sua DIREITA', boca: 'Abra bem a boca' },
  pronto: null, det: null,
  setRigor(n) { BIO.LIM_OK = BIO.RIGOR[n] || BIO.RIGOR.padrao; BIO.LIM_DUV = +(BIO.LIM_OK + 0.08).toFixed(2); },
  carregar() {
    if (BIO.pronto) return BIO.pronto;
    BIO.pronto = new Promise((res, rej) => {
      const go = async () => { try { const tf = faceapi.tf; let okGl = false; try { okGl = await tf.setBackend('webgl'); } catch (e) { } if (!okGl || tf.getBackend() !== 'webgl') await tf.setBackend('cpu'); await tf.ready(); const M = BIO.URL + 'model/'; await faceapi.nets.tinyFaceDetector.loadFromUri(M); await faceapi.nets.faceLandmark68Net.loadFromUri(M); await faceapi.nets.faceRecognitionNet.loadFromUri(M); res(); } catch (e) { BIO.pronto = null; rej(e); } };
      if (window.faceapi) return go();
      const s = document.createElement('script'); s.src = BIO.URL + 'dist/face-api.js'; s.onload = go;
      s.onerror = () => { BIO.pronto = null; rej(new Error('download')); }; document.head.appendChild(s);
    });
    return BIO.pronto;
  },
  carregarDetector() {
    if (BIO.det) return BIO.det;
    BIO.det = (async () => {
      if (!window.faceapi) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = BIO.URL + 'dist/face-api.js'; s.onload = res; s.onerror = () => rej(new Error('download')); document.head.appendChild(s); });
      if (!faceapi.nets.tinyFaceDetector.isLoaded) { const tf = faceapi.tf; let okGl = false; try { okGl = await tf.setBackend('webgl'); } catch (e) { } if (!okGl || tf.getBackend() !== 'webgl') await tf.setBackend('cpu'); await tf.ready(); await faceapi.nets.tinyFaceDetector.loadFromUri(BIO.URL + 'model/'); }
    })().catch(e => { BIO.det = null; throw e; });
    return BIO.det;
  },
  detectar: v => faceapi.detectSingleFace(v, BIO.opts(224)),
  /* posição do rosto em relação ao oval (área visível 3:4 da câmera) */
  posicao(box, v) {
    const vw = v.videoWidth || 640, vh = v.videoHeight || 480; let sw = vw, sh = vh; if (vw / vh > 0.75) sw = vh * 0.75; else sh = vw / 0.75;
    const ox = (vw - sw) / 2, oy = (vh - sh) / 2, nx = (box.x + box.width / 2 - ox) / sw, ny = (box.y + box.height / 2 - oy) / sh, nw = box.width / sw;
    if (nw < 0.3) return 'longe'; if (nw > 0.9) return 'perto';
    if (Math.abs(nx - 0.5) > 0.14 || Math.abs(ny - 0.44) > 0.16) return 'centro';
    return 'ok';
  },
  opts: (size = 320) => new faceapi.TinyFaceDetectorOptions({ inputSize: size, scoreThreshold: 0.5 }),
  ear(p) { const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y); return (d(p[1], p[5]) + d(p[2], p[4])) / (2 * d(p[0], p[3]) || 1); },
  olhos(lm) { return (BIO.ear(lm.getLeftEye()) + BIO.ear(lm.getRightEye())) / 2; },
  /* giro do rosto: ~0,5 de frente; sobe quando vira para a esquerda da pessoa e desce para a direita */
  yaw(lm) { const j = lm.getJawOutline(), n = lm.getNose(), w = j[16].x - j[0].x; return w > 0 ? (n[3].x - j[0].x) / w : 0.5; },
  /* abertura da boca: distância interna dos lábios sobre a largura da boca */
  boca(lm) { const m = lm.getMouth(), d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), w = d(m[12], m[16]); return w > 0 ? d(m[14], m[18]) / w : 0; },
  dist(a, b) { let s = 0; for (let i = 0; i < 128; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); },

      const tr = m.length % 2 ? 0 : horasTrab(m);

      if (m.length >= 4 && tr > 360) { const iv = minutos(m[2]) - minutos(m[1]); if (iv < 60) add('warn', 'Intervalo menor que 1h', `${dt}: ${hm(iv)} de intervalo (art. 71)`); }

      if (r.ajustes && r.ajustes.length > 2) add('mut', 'Muitos ajustes manuais', `${dt}: ${r.ajustes.length} ajustes no mesmo dia`);

  });

      ${ed ? '<div class="row end"><button class="btn" id="bc-ok">Salvar configurações</button></div>' : ''}`;
    const s = $('#bc-ok', bi); if (s) s.onclick = () => { cfg.bio = { modo: $('input[name=bm]:checked', bi).value, rigor: $('#bm-r', bi).value, falha: $('#bm-f', bi).value }; cfg.dispositivo = { exigir: $('#dv-e', bi).checked, primeiroAuto: $('#dv-a', bi).checked }; cfg.expediente = { tol: Math.min(60, Math.max(0, parseInt($('#ex-t', bi).value) || 0)) }; cfg.portal = { ...p, horario: { ativo: $('#pc-h', bi).checked, ini: $('#pc-i', bi).value || '06:00', fim: $('#pc-f', bi).value || '23:00' } }; save('config'); audit('Alterou configurações do ponto biométrico'); toast('Configurações salvas.'); };
  }
}

/* ---------- Absenteísmo ---------- */
function vAbs(el, comp = S.absComp || iso(hoje()).slice(0, 7)) {
  S.absComp = comp;
  const [a, mm] = comp.split('-').map(Number), nd = new Date(a, mm, 0).getDate();
  const ini0 = inicioControle();
  const lin = ativos().filter(c => c.tipo !== 'pj').map(c => {
    let uteis = 0, faltas = 0, atest = 0, ferias = 0, atras = 0;
    for (let d = 1; d <= nd; d++) { const dt = new Date(a, mm - 1, d), ds = iso(dt); if (dt >= hoje() || pd(c.admissao) > dt || ds < ini0 || !ESC_DIA(dt, c)) continue; uteis++;
      const f = emFolga(c, ds), r = regDia(c.id, ds);
      if (f === 'Férias') ferias++; else if (f) atest++; else if (!r || !r.marc.length) faltas++; else if (atrasoMin(c, ds, r.marc.slice().sort()) > 0) atras++; }
    const base = uteis - ferias; return { c, uteis: base, faltas, atest, atras, taxa: base ? (faltas + atest) / base : 0 };
  }).sort((x, y) => y.taxa - x.taxa);
  const tot = lin.reduce((s, x) => ({ u: s.u + x.uteis, f: s.f + x.faltas, a: s.a + x.atest }), { u: 0, f: 0, a: 0 }), taxa = tot.u ? (tot.f + tot.a) / tot.u : 0;
  const pct = x => (x * 100).toFixed(1).replace('.', ',') + '%';
  el.innerHTML = `<div class="row" style="margin-bottom:16px"><input class="inp" type="month" id="ab-c" value="${comp}" style="width:auto" aria-label="Mês"><span class="sp"></span><span class="hint">Dias previstos na escala desde ${fd(ini0)} (início do controle) até ontem · feriados não entram</span></div>
    <div class="kpis"><div class="kpi"><b style="color:${taxa > 0.03 ? 'var(--bad)' : 'var(--ok)'}">${pct(taxa)}</b><span>taxa de absenteísmo</span></div><div class="kpi"><b>${tot.f}</b><span>faltas sem justificativa</span></div><div class="kpi"><b>${tot.a}</b><span>dias de atestado ou suspensão</span></div><div class="kpi"><b>${lin.reduce((s, x) => s + x.atras, 0)}</b><span>entradas com atraso</span></div></div>
    ${lin.length ? `<div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th class="n">Dias previstos</th><th class="n">Faltas</th><th class="n">Atestados</th><th class="n">Atrasos</th><th>Absenteísmo</th></tr></thead><tbody>${lin.map(x => `<tr><td><b>${esc(x.c.nome)}</b></td><td class="n">${x.uteis}</td><td class="n">${x.faltas || ''}</td><td class="n">${x.atest || ''}</td><td class="n">${x.atras || ''}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="width:120px"><i style="width:${Math.min(100, x.taxa * 500)}%;background:${x.taxa > 0.05 ? 'var(--bad)' : x.taxa > 0.02 ? 'var(--warn)' : 'var(--ok)'}"></i></div><b>${pct(x.taxa)}</b></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="panel empty">Sem colaboradores ativos.</div>'}
    <p class="note">Referência de mercado: até 3% é considerado saudável. Faltas sem justificativa podem ser descontadas com o DSR da semana (Lei 605/49, art. 6º).</p>`;
  $('#ab-c', el).onchange = e => vAbs(el, e.target.value);
}

/* ---------- Financeiro ---------- */
const descAdiant = (cid, comp) => r2(S.data.adiant.filter(x => x.colabId === cid).reduce((s, x) => { const k = (+comp.slice(0, 4) - +x.comp.slice(0, 4)) * 12 + (+comp.slice(5) - +x.comp.slice(5)); return s + (k >= 0 && k < x.parcelas ? x.valor / x.parcelas : 0); }, 0));
function vFin(el, comp = S.finComp || iso(hoje()).slice(0, 7)) {
  S.finComp = comp;
  const cfg = S.data.config, regime = cfg.regime || 'simples', folha = S.data.folhas.find(f => !f.tipo && f.comp === comp);
  const enc = regime === 'simples' ? 0 : 0.278;
  const lin = ativos().filter(c => c.tipo !== 'pj').map(c => {
    const it = folha && folha.itens.find(i => i.colabId === c.id), bruto = it ? folhaItem(it).base : num(c.salario);
    const fgts = r2(bruto * 0.08), patr = r2(bruto * enc), prov = r2(bruto / 12 + bruto / 12 * 4 / 3), provF = r2(prov * (0.08 + enc));
    return { c, bruto, fgts, patr, prov: r2(prov + provF), custo: r2(bruto + fgts + patr + prov + provF), adi: descAdiant(c.id, comp) };
  }).sort((a, b) => b.custo - a.custo);
  const pj = ativos().filter(c => c.tipo === 'pj').reduce((s, c) => s + num(c.salario), 0);
  const T2 = k => r2(lin.reduce((s, x) => s + x[k], 0)), custo = T2('custo') + pj;
  const deps = {}; lin.forEach(x => { const d = x.c.depto || 'Sem setor'; deps[d] = (deps[d] || 0) + x.custo; });
  const mx = Math.max(1, ...Object.values(deps));
  el.innerHTML = `<div class="row" style="margin-bottom:16px"><input class="inp" type="month" id="fi-c" value="${comp}" style="width:auto" aria-label="Mês">
      <select class="inp" id="fi-r" style="width:auto" aria-label="Regime tributário" ${podeEditar() && can('admin') ? '' : 'disabled'}>${opts([['simples', 'Simples Nacional (anexos I a III)'], ['normal', 'Lucro Presumido ou Real']], regime)}</select><span class="sp"></span>
      <span class="hint">${folha ? `Valores da folha de ${mesNome(comp)}` : 'Sem folha gerada: usando salários base'}</span></div>
    <div class="kpis"><div class="kpi"><b style="font-size:22px">${brl(T2('bruto'))}</b><span>folha bruta CLT</span></div><div class="kpi"><b style="font-size:22px">${brl(T2('fgts') + T2('patr'))}</b><span>encargos do mês</span></div><div class="kpi"><b style="font-size:22px">${brl(T2('prov'))}</b><span>provisão férias e 13º</span></div><div class="kpi"><b style="font-size:22px">${brl(custo)}</b><span>custo total com pessoal</span></div></div>
    <div class="cols"><section class="panel"><h2>Custo por colaborador</h2><div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th class="n">Bruto</th><th class="n">Encargos</th><th class="n">Provisões</th><th class="n">Custo</th></tr></thead><tbody>${lin.map(x => `<tr><td>${esc(x.c.nome)}</td><td class="n">${brl(x.bruto)}</td><td class="n">${brl(x.fgts + x.patr)}</td><td class="n">${brl(x.prov)}</td><td class="n"><b>${brl(x.custo)}</b></td></tr>`).join('')}${pj ? `<tr><td>Prestadores PJ</td><td class="n">${brl(pj)}</td><td></td><td></td><td class="n"><b>${brl(pj)}</b></td></tr>` : ''}</tbody></table></div></section>
      <div><section class="panel"><h2>Por setor</h2>${Object.entries(deps).sort((a, b) => b[1] - a[1]).map(([d, v]) => `<div style="margin-bottom:10px"><div class="row"><span>${esc(d)}</span><span class="sp"></span><b>${brl(v)}</b></div><div class="bar"><i style="width:${v / mx * 100}%"></i></div></div>`).join('') || '<p class="hint">Sem dados.</p>'}</section>
      <section class="panel"><h2>Adiantamentos a descontar</h2><b style="font-size:22px">${brl(T2('adi'))}</b><p class="hint" style="margin:4px 0 0">Parcelas de adiantamentos e vales que caem em ${mesNome(comp)}.</p></section></div></div>
    <p class="note">${regime === 'simples' ? 'No Simples Nacional (anexos I a III) a contribuição patronal ao INSS está dentro do DAS; entram FGTS 8% e provisões.' : 'Encargos estimados: INSS patronal 20% + RAT 2% + terceiros 5,8% sobre a folha, além do FGTS 8%.'} Provisões: 1/12 de 13º e 1/12 de férias + 1/3 por mês, com encargos.</p>`;
  $('#fi-c', el).onchange = e => vFin(el, e.target.value);
  $('#fi-r', el).onchange = e => { S.data.config.regime = e.target.value; save('config'); vFin(el, comp); };
}

/* ---------- Adiantamentos & Vales ---------- */

      : '<div class="panel empty"><b>Nenhum lançamento</b>Registre adiantamentos, vales e empréstimos. Pedidos de adiantamento aprovados no portal entram aqui sozinhos.</div>'}`;
  const n = $('#ad-n', el); if (n) n.onclick = () => { if (!ativos().length) return toast('Cadastre colaboradores primeiro.', true);

      <div class="fld"><label for="an-t">Tipo</label><select class="inp" id="an-t">${opts(Object.entries(TIPOS_ADI), 'adiantamento')}</select></div><div class="fld"><label for="an-v">Valor total (R$)</label><input class="inp" id="an-v" inputmode="decimal"></div>
      <div class="fld"><label for="an-d">Data</label><input class="inp" type="date" id="an-d" value="${iso(hoje())}"></div><div class="fld"><label for="an-p">Parcelas</label><input class="inp" type="number" id="an-p" min="1" max="24" value="1"></div>
      <div class="fld"><label for="an-m">Descontar a partir de</label><input class="inp" type="month" id="an-m" value="${comp}"></div><div class="fld full"><label for="an-x">Descrição</label><input class="inp" id="an-x" placeholder="Opcional"></div></div><div id="an-w"></div>`, {
      foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="an-ok">Lançar</button>', onMount: m => {
        const chk = () => { const c = colabById($('#an-c', m).value), v = num($('#an-v', m).value), p = parseInt($('#an-p', m).value) || 1, lim = num(c.salario) * 0.3; $('#an-w', m).innerHTML = v / p > lim ? `<p class="pill warn" style="white-space:normal">A parcela passa de 30% do salário (${brl(lim)}). Para consignado, a Lei 10.820/03 limita a 35% da remuneração disponível.</p>` : ''; };
        $$('input,select', m).forEach(i => i.addEventListener('input', chk));
        $('#an-ok', m).onclick = () => { const v = num($('#an-v', m).value), p = Math.min(24, Math.max(1, parseInt($('#an-p', m).value) || 1)), c = colabById($('#an-c', m).value); if (!v) return toast('Informe o valor.', true);
          S.data.adiant.push({ id: uid(), colabId: c.id, tipo: $('#an-t', m).value, valor: v, parcelas: p, data: $('#an-d', m).value, comp: $('#an-m', m).value || comp, desc: $('#an-x', m).value.trim() });
          save('adiant'); audit(`Lançou ${TIPOS_ADI[$('#an-t', m).value]} de ${brl(v)} para ${c.nome}`); closeModal(); toast('Lançamento salvo.'); vAdiant(el); };
      } }); };
  $$('[data-x]', el).forEach(b => b.onclick = () => confirmar('Excluir este lançamento?', () => { S.data.adiant = S.data.adiant.filter(x => x.id !== b.dataset.x); save('adiant'); audit('Excluiu adiantamento'); vAdiant(el); }, 'Excluir', true));
  $('#ad-ex', el).onclick = () => modal('Extrato de adiantamentos', `<div class="fld"><label for="ex-c">Colaborador</label><select class="inp" id="ex-c">${colabOpts('', false)}</select></div>`, { size: 'sm', foot: '<button class="btn" id="ex-ok">Gerar PDF</button>', onMount: m => $('#ex-ok', m).onclick = () => {

/* ---------- Recrutamento ---------- */

      <div class="kanban">${ETAPAS.map(([k, l]) => { const cs = S.data.cands.filter(c => c.vagaId === sel.id && c.etapa === k); return `<div class="kcol"><div class="kh">${l} <span class="pill mut">${cs.length}</span></div>${cs.map(c => `<div class="kcard"><b>${esc(c.nome)}</b>

        ${ed ? `<div class="row" style="margin-top:8px;gap:4px">${k !== 'triagem' ? `<button class="btn ghost sm" data-mv="${c.id}|-1" aria-label="Voltar etapa">‹</button>` : ''}<button class="btn ghost sm" data-ec="${c.id}">Editar</button>${k === 'aprovado' ? `<button class="btn sm" data-ad="${c.id}">Admitir</button>` : ''}<span class="sp"></span>${k !== 'reprovado' ? `<button class="btn ghost sm" data-mv="${c.id}|1" aria-label="Avançar etapa">›</button>` : ''}</div>` : ''}</div>`).join('')}</div>`; }).join('')}</div>`
      : '<div class="panel empty"><b>Nenhuma vaga aberta</b>Crie uma vaga e acompanhe os candidatos da triagem até a admissão.</div>'}`;
  const re = () => vRecr(el);

  const fv = $('#rc-fv', el); if (fv) fv.onclick = () => { sel.status = sel.status === 'aberta' ? 'fechada' : 'aberta'; save('vagas'); re(); };
  const formCand = c => modal(c ? 'Editar candidato' : 'Adicionar candidato', `<div class="grid"><div class="fld full"><label for="cd-n">Nome</label><input class="inp" id="cd-n" value="${esc(c ? c.nome : '')}"></div><div class="fld"><label for="cd-t">Telefone</label><input class="inp" id="cd-t" data-mask="tel" value="${esc(c ? c.telefone : '')}"></div><div class="fld"><label for="cd-e">E-mail</label><input class="inp" id="cd-e" value="${esc(c ? c.email : '')}"></div>

      <div class="fld full"><label for="cd-x">Anotações da entrevista</label><textarea class="inp" id="cd-x">${esc(c ? c.notas : '')}</textarea></div></div>`, { foot: `${c ? '<button class="btn sec" id="cd-del" style="color:var(--bad)">Excluir</button><span class="sp"></span>' : ''}<button class="btn sec" data-close>Cancelar</button><button class="btn" id="cd-ok">Salvar</button>`, onMount: m => { masks(m);

/* ---------- 12. Triagem com IA ---------- */
let _pdfjs = null;
async function textoPdf(dataUrl) {
  if (!_pdfjs) await new Promise((ok, err) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload = ok; s.onerror = err; document.head.appendChild(s); });
  _pdfjs = window.pdfjsLib; _pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const bin = atob(dataUrl.split(',')[1]), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const doc = await _pdfjs.getDocument({ data: u }).promise; let t = ''; for (let p = 1; p <= Math.min(doc.numPages, 4); p++) { const c = await (await doc.getPage(p)).getTextContent(); t += c.items.map(x => x.str).join(' ') + '\n'; } return t.slice(0, 7000);
}
async function analisarCandIA(c, v) {
