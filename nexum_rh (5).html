<style>
:root{
  --ink:#0A1733;--ink2:#13244D;--ink3:#26406F;
  --bg:#F4F4F8;--card:#FFFFFF;--line:#E2E1EC;--line2:#EEEDF4;
  --txt:#1B1A2E;--mut:#696784;
  --pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;
  --soft:#FAFAFC;--hover:#F7F6FB;
  --r:10px;--rs:6px;
  --f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
#root{height:100%;min-height:100vh;min-height:100dvh}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- Login ---------- */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;min-height:100dvh}
.auth-art{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px)}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%}
.auth-art>*:not(canvas){position:relative}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.02em}
.brand .marca{height:30px;width:auto;display:block}
.brand-sub{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:500;font-size:.9em;letter-spacing:.06em;color:rgba(255,255,255,.72);line-height:1.1}
.brand small{font-weight:500;opacity:.6;letter-spacing:0}
.auth-claim{font-size:clamp(34px,4.6vw,60px);font-weight:700;line-height:1.02;letter-spacing:-.035em;max-width:11ch}
.auth-sub{opacity:.72;max-width:40ch;margin-top:16px}
.auth-foot{font-size:13px;opacity:.5}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--card)}
.auth-box{width:100%;max-width:400px}
.seg{display:flex;background:var(--bg);border-radius:var(--r);padding:4px;margin-bottom:28px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(10,23,51,.12)}

/* ---------- Form ---------- */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}
.inp.err{border-color:var(--bad)}
textarea.inp{min-height:90px;resize:vertical}
.grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:9px 16px;min-height:40px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--pri);padding:6px 10px;min-height:32px}
.btn.ghost:hover{background:var(--pri-s)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;height:100dvh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.side .brand{padding:4px 8px 22px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.66);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side-foot .who{font-weight:600}
.side-foot .role{opacity:.55}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:20px}
.menu-btn{display:none;border:0;background:none;padding:6px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px)}
.wrap{max-width:1240px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.pill.mut{background:var(--line2);color:var(--mut)}
.banner{padding:10px 16px;background:var(--warn-s);color:var(--warn);font-size:14px;font-weight:500;border-bottom:1px solid #F1DDB8}
.banner.bad{background:var(--bad-s);color:var(--bad);border-color:#F2C9C9}

/* ---------- Blocks ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.panel h2{font-size:16px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--card);padding:18px 20px}
.kpi b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:13.5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}

const cpfFmt = v => v.replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
const cnpjFmt = v => v.replace(/\D/g, '').slice(0, 14).replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');

const cepFmt = v => v.replace(/\D/g, '').slice(0, 8).replace(/(\d{5})(\d)/, '$1-$2');
function cpfValido(c) {
  c = String(c).replace(/\D/g, '');
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  let s = 0; for (let i = 0; i < 9; i++) s += +c[i] * (10 - i);
  let d = (s * 10) % 11 % 10; if (d !== +c[9]) return false;
  s = 0; for (let i = 0; i < 10; i++) s += +c[i] * (11 - i);
  d = (s * 10) % 11 % 10; return d === +c[10];
}
async function sha(txt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));

}

/* ---------- Cálculos trabalhistas ---------- */
const T = () => (S.data.config && S.data.config.tabelas) || TAB_PADRAO;
function calcINSS(base) {
  let tot = 0, ant = 0;
  for (const [lim, al] of T().inss) { if (base > ant) tot += (Math.min(base, lim) - ant) * al; ant = lim; }
  return r2(tot);
}
function calcIRRF(bruto, inss, dep) {
  const t = T();
  const ded = Math.max(inss + (dep || 0) * t.dep, t.simplificado);
  const base = Math.max(0, bruto - ded);
  let imp = 0;
  for (const [lim, al, pdz] of t.irrf) { if (base <= lim) { imp = base * al - pdz; break; } }
  imp = Math.max(0, imp);
  if (bruto <= t.redutorIsencaoAte) imp = 0;
  else if (bruto <= t.redutorLimite) imp = Math.max(0, imp - (t.redutorA - t.redutorB * bruto));
  return r2(imp);
}
function meses13(adm, fim) {
  let n = 0; const y = fim.getFullYear();
  for (let m = 0; m <= fim.getMonth(); m++) {
    const ini = new Date(Math.max(new Date(y, m, 1), adm));
    const fimM = new Date(Math.min(new Date(y, m + 1, 0), fim));
    if (fimM >= ini && diffD(ini, fimM) + 1 >= 15) n++;
  }
  return Math.min(12, n);
}
function periodoAtual(adm, ref) {
  const anos = anosEntre(adm, ref);
  return { ini: addM(adm, anos * 12), anos };
}
function mesesFeriasProp(adm, fim) {
  const { ini } = periodoAtual(adm, fim);
  let n = 0;
  for (let k = 0; k < 12; k++) {
    const ps = addM(ini, k); if (ps > fim) break;
    const pe = addD(addM(ini, k + 1), -1);
    const end = pe < fim ? pe : fim;
    if (diffD(ps, end) + 1 >= 15) n++;
  }
  return Math.min(12, n);
}
function rubricasPonto(i) {
  const p = i.ponto || {}, mn = p.min || {}, h = x => { const v = Math.round(x || 0); return `${Math.floor(v / 60)}h${String(v % 60).padStart(2, '0')}`; }, r = [];
  if (num(p.he50)) r.push([`Horas extras 50% (${h(mn.he50)})`, num(p.he50), 'p']);
  if (num(p.he100)) r.push([`Horas extras 100% (${h(mn.he100)})`, num(p.he100), 'p']);
  if (num(p.not)) r.push([`Adicional noturno 20% (${h(mn.not)})`, num(p.not), 'p']);
  if (num(p.dsr)) r.push(['DSR sobre extras e noturno', num(p.dsr), 'p']);
  if (num(p.faltas)) r.push([`Faltas (${mn.faltas} dia${mn.faltas === 1 ? '' : 's'})`, num(p.faltas), 'd']);
  if (num(p.dsrFalta)) r.push([`DSR perdido (${mn.semanasFalta} semana${mn.semanasFalta === 1 ? '' : 's'})`, num(p.dsrFalta), 'd']);
  if (num(p.atraso)) r.push([`Atrasos (${h(mn.atraso)})`, num(p.atraso), 'd']);
  return r;
}
function folhaItem(i) {
  const p = i.ponto || {}, prov = r2(num(i.sal) + num(i.adic) + num(p.he50) + num(p.he100) + num(p.not) + num(p.dsr)), dBase = r2(num(p.faltas) + num(p.dsrFalta) + num(p.atraso));
  const base = Math.max(0, r2(prov - dBase)), inss = calcINSS(base), irrf = calcIRRF(base, inss, i.dep), desc = r2(inss + irrf + num(i.desc) + dBase);
  return { bruto: prov, base, dBase, inss, irrf, desc, liq: r2(prov - desc), fgts: r2(base * T().fgts) };
}

async function novoTenant(d, idFixo) {
  const base = (idFixo || d.empresa.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12)) || 'empresa';
  let id = idFixo || base + Math.floor(100 + Math.random() * 900);
  const lista = Store.tenants();
  while (!idFixo && lista.some(x => x.id === id)) id = base + Math.floor(100 + Math.random() * 900);
  const t = { id, nome: d.empresa, cnpj: d.cnpj || '', telefone: d.telefone || '', email: d.email || '', plano: d.plano || 'profissional', trial: true, criadoEm: iso(hoje()), expira: iso(addD(hoje(), NEXUM.trialDias)) };
  Store.saveTenants([...lista.filter(x => x.id !== id), t]);
  Store.set(id, 'users', [{ id: uid(), nome: d.nome, email: d.email, role: 'admin', hash: await sha(id + ':' + d.senha), ativo: true }]);
  Store.set(id, 'config', { empresa: { nome: d.empresa, cnpj: d.cnpj || '', cidade: '', endereco: '', responsavel: d.nome }, tabelas: JSON.parse(JSON.stringify(TAB_PADRAO)), jornada: 44 });
  ['colab', 'ponto', 'ferias', 'folhas', 'ocorr', 'audit'].forEach(c => Store.set(id, c, []));
  return t;
}


function entrar(t, u) {
  S.tenant = t; S.user = u; localStorage.setItem('nexum:ultimo', t.id);
  sessionStorage.setItem('nexum:sess', JSON.stringify({ t: t.id, u: u.id }));

}
function sair() { sessionStorage.removeItem('nexum:sess'); S.tenant = S.user = null; if (FB_ON) { FB.fechar(); FB.auth.signOut(); } renderAuth(); }

/* ---------- Firebase: criação de empresa e entrada ---------- */
async function fbCriarEmpresa(d, form) {
  const b = form.querySelector('button[type=submit]'); b.disabled = true; FB.criando = true;
  try {
    const cr = await FB.auth.createUserWithEmailAndPassword(d.email, d.senha), u = cr.user.uid;
    const base = d.empresa.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 10) || 'empresa';
    const tid = base + Math.random().toString(36).slice(2, 6);
    const b1 = FB.db.batch();
    b1.set(FB.db.doc(`tenants/${tid}`), { nome: d.empresa, cnpj: d.cnpj || '', telefone: d.telefone || '', email: d.email, plano: d.plano || 'profissional', trial: true, criadoEm: iso(hoje()), ownerUid: u, expiraTs: firebase.firestore.Timestamp.fromDate(addD(hoje(), NEXUM.trialDias)) });
    b1.set(FB.db.doc(`users/${u}`), { tenantId: tid, tipo: 'rh', role: 'admin', nome: d.nome, email: d.email, ativo: true });
    await b1.commit();
    const b2 = FB.db.batch();
    b2.set(FB.db.doc(`tenants/${tid}/meta/config`), FB.enc({ empresa: { nome: d.empresa, cnpj: d.cnpj || '', cidade: '', endereco: '', responsavel: d.nome }, tabelas: JSON.parse(JSON.stringify(TAB_PADRAO)), jornada: 44 }));
    b2.set(FB.db.doc(`tenants/${tid}/users/${u}`), { id: u, nome: d.nome, email: d.email, role: 'admin', ativo: true });
    await b2.commit();
    FB.criando = false; await fbEntrarRH(cr.user);
    toast(`Empresa criada. Código para o portal dos colaboradores: ${tid}`);
  } catch (err) { FB.criando = false; toast(FB.erro(err), true); b.disabled = false; }
}
async function fbEntrarRH(user) {
  try {
    const m = await FB.db.doc(`users/${user.uid}`).get();
    if (!m.exists || m.data().tipo !== 'rh') { await FB.auth.signOut(); return toast('Este login não é de um usuário do RH. Colaboradores entram pelo Portal.', true); }
    const u = m.data(); if (u.ativo === false) { await FB.auth.signOut(); return toast('Seu acesso foi bloqueado pelo administrador.', true); }
    const t = FB.tenant(await FB.db.doc(`tenants/${u.tenantId}`).get());
    await FB.abrir(t.id, COLS);
    entrar(t, { id: user.uid, nome: u.nome, email: u.email, role: u.role, ativo: true });
    if (FB.unTenant) FB.unTenant();
    FB.unTenant = FB.db.doc(`tenants/${t.id}`).onSnapshot(s => { if (!s.exists || !S.tenant || S.tenant.id !== t.id) return; const n = FB.tenant(s), mudou = ['plano', 'trial', 'suspenso', 'expira'].some(k => n[k] !== S.tenant[k]); Object.assign(S.tenant, n); if (mudou) { renderApp(); toast(licenca().ativa ? 'Sua licença foi atualizada.' : 'A licença desta empresa mudou.'); } }, () => { });
  } catch (err) { FB.falhou(err); await FB.auth.signOut(); }
}

/* Animação da rede (tela de login) */
let netRAF = null;
function startNet() {
  const cv = $('#net'); if (!cv) return;
  const ctx = cv.getContext('2d'); const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, pts;
  const size = () => {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 11000);
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: Math.random() < .12 ? 3 : 1.6 }));
  };
  const frame = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) { if (!reduz) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; } }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 120) { ctx.strokeStyle = `rgba(77,141,255,${(1 - d / 120) * .35})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of pts) { ctx.fillStyle = p.r > 2 ? '#4D8DFF' : 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    if (!reduz) netRAF = requestAnimationFrame(frame);
  };
  size(); frame(); window.onresize = () => { size(); if (reduz) frame(); };
}
function stopNet() { if (netRAF) cancelAnimationFrame(netRAF); netRAF = null; window.onresize = null; }

      ${f('banco', 'Banco / Chave PIX', '', 'full')}
      <label class="full row hint" style="margin-bottom:6px"><input type="checkbox" name="lgpd" ${c.lgpd ? 'checked' : ''}> Colaborador ciente do tratamento dos seus dados pessoais (LGPD)</label>
    </form>`, {

        d.salario = num(d.salario); d.dependentes = parseInt(d.dependentes) || 0;

/* ---------- Ponto ---------- */
function horasTrab(m) {
  let min = 0; const s = (m || []).slice().sort();
  for (let i = 0; i + 1 < s.length; i += 2) { const [h1, m1] = s[i].split(':').map(Number), [h2, m2] = s[i + 1].split(':').map(Number); min += (h2 * 60 + m2) - (h1 * 60 + m1); }
  return min;
}
const hm = min => { const a = Math.abs(Math.round(min)); return (min < 0 ? '−' : '') + Math.floor(a / 60) + 'h' + String(a % 60).padStart(2, '0'); };
function vPonto(el, dia = iso(hoje()), aba = 'dia') {
  el.innerHTML = `<div class="tabs"><button class="${aba === 'dia' ? 'on' : ''}" data-a="dia">Registros do dia</button><button class="${aba === 'esp' ? 'on' : ''}" data-a="esp">Espelho mensal</button></div><div id="p-body"></div>`;
  $$('.tabs button', el).forEach(b => b.onclick = () => vPonto(el, dia, b.dataset.a));
  const body = $('#p-body', el);
  if (aba === 'dia') {
    const reg = id => (S.data.ponto.find(p => p.colabId === id && p.data === dia) || { marc: [] }).marc;
    const ehHoje = dia === iso(hoje());
    body.innerHTML = `

      ${ativos().length ? `<div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th>Marcações</th><th class="n">Trabalhado</th><th></th></tr></thead><tbody>
      ${ativos().sort((a, b) => a.nome.localeCompare(b.nome)).map(c => { const m = reg(c.id).slice().sort(); return `<tr>
        <td><div class="name-cell"><div class="av">${iniciais(c.nome)}</div><div><b>${esc(c.nome)}</b><small>${esc(c.cargo)}</small></div></div></td>
        <td>${m.length ? m.map(x => { const ev = (S.data.ponto.find(p => p.colabId === c.id && p.data === dia) || {}).ev || {}; const e = ev[x]; return e && e.origem === 'portal' ? `<button class="pill ${e.semFoto ? 'warn' : 'ok'}" style="margin:2px;border:0;cursor:pointer" data-ev="${c.id}|${x}" title="Registrado pelo portal">${x} · ${e.semFoto ? 'sem foto' : 'foto'}</button>` : `<span class="pill mut" style="margin:2px">${x}</span>`; }).join('') : '<span class="hint">Sem marcações</span>'}${m.length % 2 ? ' <span class="pill warn">Ímpar</span>' : ''}</td>
        <td class="n">${hm(horasTrab(m))}</td>
        <td class="n">${podeEditar() ? `<div class="row end">${ehHoje ? `<button class="btn sm" data-agora="${c.id}">Marcar agora</button>` : ''}<button class="btn sec sm" data-man="${c.id}">Ajustar</button></div>` : ''}</td></tr>`; }).join('')}
      </tbody></table></div>` : `<div class="panel empty"><b>Sem colaboradores ativos</b>Cadastre colaboradores para registrar o ponto.</div>`}
      <p class="note">Registros feitos aqui servem como controle interno. Para sistema de ponto eletrônico com validade fiscal, observe os requisitos da Portaria MTP 671/2021 (REP-P).</p>`;
    $('#p-dia', body).onchange = e => vPonto(el, e.target.value, 'dia');
    $$('[data-ev]', body).forEach(b => b.onclick = () => { const [cid, h] = b.dataset.ev.split('|'), r = S.data.ponto.find(p => p.colabId === cid && p.data === dia), e = r.ev[h], c = colabById(cid);
      modal(`Registro de ${h} — ${c.nome}`, `${e.foto ? `<img src="${e.foto}" alt="Foto do registro" style="width:100%;max-width:260px;border-radius:10px;display:block;margin:0 auto 14px">` : '<p class="pill warn">Registrado sem foto: a câmera não estava disponível.</p>'}<div class="res"><div><span class="hint">Data e hora</span><span>${new Date(e.em).toLocaleString('pt-BR')}</span></div><div><span class="hint">Localização</span><span>${e.geo ? `<a href="https://www.google.com/maps?q=${e.geo.lat},${e.geo.lng}" target="_blank" rel="noopener">${e.geo.lat.toFixed(5)}, ${e.geo.lng.toFixed(5)}</a> (±${e.geo.acc} m)` : 'Não informada'}</span></div>${e.srv && e.srv !== '__SRV__' ? `<div><span class="hint">Hora do servidor</span><span>${new Date(e.srv).toLocaleString('pt-BR')}${Math.abs(new Date(e.srv) - new Date(e.em)) > 180000 ? ' <b style="color:var(--bad)">· relógio do aparelho divergente</b>' : ''}</span></div>` : ''}<div><span class="hint">Origem</span><span>Portal do colaborador</span></div></div>`, { size: 'sm' }); });
    const salvar = (cid, marc, desc) => {

/* ---------- Férias ---------- */
function statusFerias(c) {
  const adm = pd(c.admissao), h = hoje();
  if (!adm || c.tipo === 'pj') return { cls: 'mut', txt: 'Não se aplica' };
  const anos = anosEntre(adm, h);
  const gozados = S.data.ferias.filter(f => f.colabId === c.id).reduce((s, f) => s + num(f.dias) + (f.abono ? 10 : 0), 0);
  const direito = anos * 30; const saldo = direito - gozados;
  if (anos === 0) return { cls: 'ok', txt: 'Em aquisição', aquis: adm, limite: addM(adm, 24), saldo: 0 };
  const periodoVenc = Math.floor(gozados / 30); // primeiro período com saldo
  const iniAq = addM(adm, periodoVenc * 12); const limite = addD(addM(iniAq, 24), -1);
  if (saldo <= 0) return { cls: 'ok', txt: 'Em dia', aquis: addM(adm, anos * 12), limite: addM(adm, anos * 12 + 24), saldo: 0 };
  const d = diffD(h, limite);
  return { cls: d < 0 ? 'bad' : d <= 90 ? 'warn' : 'ok', txt: d < 0 ? 'Vencidas' : `${saldo} dias disponíveis`, aquis: iniAq, limite, saldo };
}
function calcFerias(c, dias, abono, adiant13) {
  const sal = num(c.salario), v = r2(sal / 30 * dias), terco = r2(v / 3);
  const ab = abono ? r2(sal / 30 * 10) : 0, abT = abono ? r2(ab / 3) : 0;
  const d13 = adiant13 ? r2(sal / 2) : 0;
  const trib = v + terco; const inss = calcINSS(trib); const irrf = calcIRRF(trib, inss, c.dependentes);
  return { v, terco, ab, abT, d13, inss, irrf, liq: r2(v + terco + ab + abT + d13 - inss - irrf) };
}
function vFerias(el) {
  const at = ativos().filter(c => c.tipo !== 'pj').sort((a, b) => a.nome.localeCompare(b.nome));

  el.innerHTML = `
    <section class="panel"><div class="panel-head"><h2>Controle de períodos</h2><span class="sp"></span>${podeEditar() && can('admin', 'rh') ? '<button class="btn" id="f-prog">Programar férias</button>' : ''}</div>
      ${at.length ? `<div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th>Admissão</th><th>Período em aberto desde</th><th>Conceder até</th><th>Situação</th></tr></thead><tbody>
      ${at.map(c => { const s = statusFerias(c); return `<tr><td><b>${esc(c.nome)}</b></td><td>${fd(c.admissao)}</td><td>${s.aquis ? fd(iso(s.aquis)) : '—'}</td><td>${s.limite ? fd(iso(s.limite)) : '—'}</td><td><span class="pill ${s.cls}">${s.txt}</span></td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="empty">Sem colaboradores CLT ativos.</div>'}
    </section>
    <section class="panel"><h2>Férias programadas e concedidas</h2>
      ${prog.length ? `<div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th>Início</th><th>Retorno</th><th class="n">Dias</th><th class="n">Líquido</th><th></th></tr></thead><tbody>
      ${prog.map(f => { const c = colabById(f.colabId) || { nome: '—' }; return `<tr><td>${esc(c.nome)}</td><td>${fd(f.inicio)}</td><td>${fd(iso(addD(pd(f.inicio), f.dias)))}</td><td class="n">${f.dias}${f.abono ? ' + 10 abono' : ''}</td><td class="n">${brl(f.calc.liq)}</td>
        <td class="n"><button class="btn ghost sm" data-rec="${f.id}">Aviso e recibo</button>${podeEditar() && can('admin', 'rh') ? `<button class="btn ghost sm" data-del="${f.id}" style="color:var(--bad)">Excluir</button>` : ''}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="empty"><b>Nenhuma férias programada</b>Programe férias para gerar o aviso e o recibo automaticamente.</div>'}
      <p class="note">O pagamento das férias deve ocorrer até 2 dias antes do início (CLT, art. 145) e o aviso com 30 dias de antecedência (art. 135).</p>
    </section>`;
  const pb = $('#f-prog', el); if (pb) pb.onclick = () => formFerias(el);
  $$('[data-del]', el).forEach(b => b.onclick = () => confirmar('Excluir este registro de férias?', () => { S.data.ferias = S.data.ferias.filter(f => f.id !== b.dataset.del); save('ferias'); audit('Excluiu registro de férias'); vFerias(el); }, 'Excluir', true));

    const fim = iso(addD(pd(f.inicio), f.dias - 1));
    printDoc('Aviso e recibo de férias', `<h2>Aviso de férias</h2><p>Comunicamos a <b>${esc(c.nome)}</b>, ${esc(c.cargo)}, CPF ${esc(c.cpf || '—')}, que suas férias serão concedidas de <b>${fd(f.inicio)}</b> a <b>${fd(fim)}</b> (${f.dias} dias), retornando ao trabalho em ${fd(iso(addD(pd(f.inicio), f.dias)))}, referentes ao período aquisitivo iniciado em ${fd(f.aquis)}.</p>
      <div class="ass"><div>Empregador</div><div>Ciente do colaborador</div></div><div class="pb"></div>
      <h2>Recibo de férias</h2><table><tr><th>Descrição</th><th class="n">Proventos</th><th class="n">Descontos</th></tr>
      <tr><td>Férias (${f.dias} dias)</td><td class="n">${brl(k.v)}</td><td></td></tr><tr><td>1/3 constitucional</td><td class="n">${brl(k.terco)}</td><td></td></tr>
      ${f.abono ? `<tr><td>Abono pecuniário (10 dias)</td><td class="n">${brl(k.ab)}</td><td></td></tr><tr><td>1/3 sobre abono</td><td class="n">${brl(k.abT)}</td><td></td></tr>` : ''}
      ${k.d13 ? `<tr><td>Adiantamento 1ª parcela 13º</td><td class="n">${brl(k.d13)}</td><td></td></tr>` : ''}
      <tr><td>INSS</td><td></td><td class="n">${brl(k.inss)}</td></tr><tr><td>IRRF</td><td></td><td class="n">${brl(k.irrf)}</td></tr>
      <tr><th>Líquido a receber</th><th class="n" colspan="2">${brl(k.liq)}</th></tr></table>
      <p>Recebi a importância líquida acima referente às minhas férias.</p><div class="ass"><div>${esc(c.nome)}</div></div>`);
  });
}
function formFerias(el) {

/* ---------- Rescisão ---------- */
const MOTIVOS = {
  sjc: 'Dispensa sem justa causa', pd: 'Pedido de demissão', jc: 'Dispensa por justa causa', acordo: 'Acordo entre as partes (art. 484-A)',
  fimexp: 'Término do contrato de experiência', antexp_emp: 'Rescisão antecipada da experiência pelo empregador (art. 479)', antexp_col: 'Rescisão antecipada da experiência pelo colaborador (art. 480)'
};
function calcResc(p) {
  const sal = num(p.sal), adm = pd(p.adm), dem = pd(p.dem), mot = p.motivo;
  const prov = [], desc = [], info = [];
  const dia = Math.min(30, dem.getDate()); const saldo = r2(sal / 30 * dia);
  prov.push([`Saldo de salário (${dia} dias)`, saldo]);
  const anos = anosEntre(adm, dem); const avisoDias = Math.min(90, 30 + 3 * anos);
  let proj = dem;
  if (mot === 'sjc' && p.aviso === 'indenizado') { prov.push([`Aviso prévio indenizado (${avisoDias} dias)`, r2(sal / 30 * avisoDias)]); proj = addD(dem, avisoDias); }
  if (mot === 'sjc' && p.aviso === 'trabalhado' && avisoDias > 30) { prov.push([`Aviso prévio proporcional indenizado (${avisoDias - 30} dias)`, r2(sal / 30 * (avisoDias - 30))]); proj = addD(dem, avisoDias - 30); }
  if (mot === 'acordo' && p.aviso === 'indenizado') { prov.push([`Aviso prévio indenizado 50% (${avisoDias} dias)`, r2(sal / 30 * avisoDias / 2)]); proj = addD(dem, avisoDias); }
  if (mot === 'pd' && p.aviso === 'naocumprido') desc.push(['Aviso prévio não cumprido (art. 487, §2º)', sal]);
  if (mot === 'antexp_emp' || mot === 'antexp_col') {
    const fimPrev = pd(p.fimPrev); const rest = Math.max(0, diffD(dem, fimPrev));
    const ind = r2(sal / 30 * rest / 2);
    if (mot === 'antexp_emp') prov.push([`Indenização art. 479 (50% de ${rest} dias restantes)`, ind]);
    else desc.push([`Indenização art. 480 (até 50% de ${rest} dias restantes)`, ind]);
  }
  if (mot !== 'jc') {
    const m13 = meses13(adm, proj); if (m13) prov.push([`13º salário proporcional (${m13}/12)`, r2(sal / 12 * m13)]);
    const mf = mesesFeriasProp(adm, proj); if (mf) { const v = r2(sal / 12 * mf); prov.push([`Férias proporcionais (${mf}/12)`, v], ['1/3 sobre férias proporcionais', r2(v / 3)]); }
  }
  const nv = parseInt(p.vencidas) || 0;
  if (nv) prov.push([`Férias vencidas (${nv} período${nv > 1 ? 's' : ''})`, r2(sal * nv)], ['1/3 sobre férias vencidas', r2(sal * nv / 3)]);
  const inssS = calcINSS(saldo); if (inssS) desc.push(['INSS sobre saldo de salário', inssS]);
  const v13 = (prov.find(x => x[0].startsWith('13º')) || [0, 0])[1];
  const inss13 = calcINSS(v13); if (inss13) desc.push(['INSS sobre 13º', inss13]);
  if (num(p.outrosDesc)) desc.push(['Outros descontos', num(p.outrosDesc)]);
  const tp = r2(prov.reduce((s, x) => s + x[1], 0)), td = r2(desc.reduce((s, x) => s + x[1], 0));
  const fg = num(p.fgts);
  const multa = ['sjc', 'antexp_emp'].includes(mot) ? 0.4 : mot === 'acordo' ? 0.2 : 0;
  if (multa) info.push([`Multa rescisória do FGTS (${multa * 100}%) — recolher em guia`, r2(fg * multa)]);
  info.push(['Saque do FGTS', ['sjc', 'antexp_emp', 'fimexp'].includes(mot) ? 'Liberado (100%)' : mot === 'acordo' ? 'Liberado até 80%' : 'Não liberado']);
  info.push(['Seguro-desemprego', ['sjc', 'antexp_emp'].includes(mot) ? 'Pode ter direito (verificar carência)' : 'Sem direito']);
  info.push(['Data projetada do aviso', proj.toLocaleDateString('pt-BR')]);
  info.push(['Prazo de pagamento', `até ${addD(dem, 10).toLocaleDateString('pt-BR')} (10 dias, art. 477 §6º)`]);
  return { prov, desc, info, tp, td, liq: r2(tp - td), avisoDias };
}

    if (!r.marc.includes(h)) { r.marc.push(h); r.marc.sort(); r.ev = r.ev || {}; r.ev[h] = { origem: 'totem', foto, semFoto: false, em: agora.toISOString(), srv: FB_ON ? '__SRV__' : null, bio: { status: id.dist < BIO.LIM_OK ? 'ok' : 'duvidoso', dist: +id.dist.toFixed(3), vivo: true }, revisao: id.dist < BIO.LIM_OK ? null : 'Reconhecimento com baixa confiança no totem' }; save('ponto'); }
    recentes[c.id] = Date.now();

    msg(`Olá, ${c.nome.split(' ')[0]}! ${rot} registrada às ${h}.`, 'ok');
    await new Promise(r2 => setTimeout(r2, 4000));
  }
}

/* ---------- Anomalias do ponto (IA Monitor) ---------- */
function anomalias(dias = 30) {
  const out = [], hs = iso(hoje()), ini = iso(addD(hoje(), -dias)), ini0 = inicioControle();
  ativos().filter(c => c.tipo !== 'pj').forEach(c => {
    const regs = S.data.ponto.filter(p => p.colabId === c.id && p.data >= ini).sort((a, b) => a.data.localeCompare(b.data));
    let ant = null;
    regs.forEach(r => {
      const m = r.marc.slice().sort(), dt = fd(r.data), add = (g, t, s) => out.push({ g, c, data: r.data, t, s });
      if (m.length % 2 && r.data < hs) add('bad', 'Marcação ímpar', `${dt}: ${m.join(', ')} — falta uma entrada ou saída`);
      const tr = m.length % 2 ? 0 : horasTrab(m);
      if (tr > 600) add('bad', 'Jornada acima de 10h', `${dt}: ${hm(tr)} trabalhadas (art. 59 limita a 2h extras por dia)`);
      if (m.length >= 4 && tr > 360) { const iv = minutos(m[2]) - minutos(m[1]); if (iv < 60) add('warn', 'Intervalo menor que 1h', `${dt}: ${hm(iv)} de intervalo (art. 71)`); }
      if (m.length === 2 && tr > 360) add('warn', 'Jornada sem intervalo', `${dt}: ${hm(tr)} seguidas sem intervalo registrado (art. 71)`);
      if (ant && ant.marc.length >= 2 && m.length) { const u = ant.marc.slice().sort().pop(), desc = diffD(pd(ant.data), pd(r.data)) * 1440 + minutos(m[0]) - minutos(u); if (desc < 660) add('warn', 'Interjornada menor que 11h', `${fd(ant.data)} → ${dt}: ${hm(desc)} de descanso (art. 66)`); }
      Object.entries(r.ev || {}).forEach(([h, e]) => { if (e.revisao && !e.revisado && m.includes(h)) add('warn', 'Marcação para revisar', `${dt} ${h}: ${e.revisao}`); });
      if (r.ajustes && r.ajustes.length > 2) add('mut', 'Muitos ajustes manuais', `${dt}: ${r.ajustes.length} ajustes no mesmo dia`);
      ant = r;
    });
    for (let k = 1; k <= Math.min(dias, 7); k++) { const d = addD(hoje(), -k), ds = iso(d); if (pd(c.admissao) > d || ds < ini0) continue; if (ESC_DIA(d, c) && !regDia(c.id, ds) && !emFolga(c, ds)) out.push({ g: 'bad', c, data: ds, t: 'Dia sem registro', s: `${fd(ds)} (${d.toLocaleDateString('pt-BR', { weekday: 'long' })}) sem nenhuma marcação` }); }
  });
  const peso = { bad: 0, warn: 1, mut: 2 };
  return out.sort((a, b) => peso[a.g] - peso[b.g] || b.data.localeCompare(a.data));
}
const revisoesPend = () => { const l = []; S.data.ponto.forEach(r => Object.entries(r.ev || {}).forEach(([h, e]) => { if (e.revisao && !e.revisado && r.marc.includes(h)) l.push({ r, h, e }); })); return l.sort((a, b) => b.r.data.localeCompare(a.r.data)); };

          const av = () => { const c = cSel(), f = fOf(c); $('#cb-av', m).innerHTML = f ? `<p class="pill ${f.status === 'aprovado' ? 'ok' : 'warn'}" style="white-space:normal;margin:4px 0 0">${f.status === 'aprovado' ? 'Este funcionário já tem biometria. Cadastrar de novo substitui a atual.' : 'Este funcionário enviou o rosto pelo portal. Cadastrar aqui substitui o envio e já aprova.'}</p>` : ''; };
          $('#cb-c', m).onchange = av; av();
          $('#cb-cam', m).onclick = () => { const c = cSel(); closeModal(); pelaCamera(c); };
          $('#cb-f', m).onchange = e => { const c = cSel(), fs = e.target.files; closeModal(); porFotos(c, fs); };
          $('#cb-link', m).onclick = () => { const c = cSel(); closeModal(true); enviarLinkBio(c); };
        } });
    };
    const nv = $('#fc-novo', bi); if (nv) nv.onclick = () => abrirCadastro();
    const cf = $('#fc-cf', bi); if (cf) cf.onclick = () => vBio(el, 'conf');
    const cc = $('#fc-colab', bi); if (cc) cc.onclick = () => { go('colab'); formColab(); };
    $$('[data-fn]', bi).forEach(b => b.onclick = () => abrirCadastro(b.dataset.fn));
    $$('[data-fl]', bi).forEach(b => b.onclick = () => enviarLinkBio(colabById(b.dataset.fl)));
    $$('[data-fa]', bi).forEach(b => b.onclick = () => { const f = S.data.faces.find(x => x.colabId === b.dataset.fa), c = colabById(b.dataset.fa);
      modal(`Aprovar biometria — ${c.nome}`, `<div style="text-align:center"><img src="${f.foto}" alt="Rosto enviado pelo funcionário" style="width:200px;border-radius:12px"><p class="hint">Confirme que a foto é de ${esc(c.nome)}. Depois de aprovada, o ponto só é aceito com esse rosto.</p></div>`, { size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="fa-ok">Aprovar</button>', onMount: m => $('#fa-ok', m).onclick = () => { f.status = 'aprovado'; f.aprovadoPor = S.user.nome; f.aprovadoEm = new Date().toISOString(); save('faces'); audit(`Aprovou biometria de ${c.nome}`); closeModal(); toast('Biometria aprovada.'); re(); } }); });
    $$('[data-fr],[data-fx]', bi).forEach(b => b.onclick = () => { const id = b.dataset.fr || b.dataset.fx, c = colabById(id); confirmar(`Remover a biometria de <b>${esc(c.nome)}</b>? Ele precisará cadastrar de novo.`, () => { S.data.faces = S.data.faces.filter(x => x.colabId !== id); save('faces'); audit(`Removeu biometria de ${c.nome}`); re(); }, 'Remover', true); });
  }

  if (aba === 'mensal') {
    const comp = S.bioComp || iso(hoje()).slice(0, 7), [a, mm] = comp.split('-').map(Number), nd = new Date(a, mm, 0).getDate(), fech = (cfg.fechamentos || {})[comp];
    const ini0 = inicioControle();
    const lin = ativos().filter(c => c.tipo !== 'pj').sort((x, y) => x.nome.localeCompare(y.nome)).map(c => {
      let trab = 0, prev = 0, dias = 0, falt = 0, imp = 0;
      for (let d = 1; d <= nd; d++) { const dt = new Date(a, mm - 1, d), ds = iso(dt); if (dt >= hoje() || pd(c.admissao) > dt || ds < ini0) continue; const r = regDia(c.id, ds), m = r ? r.marc : [], folga = emFolga(c, ds);
        if (m.length) { dias++; if (m.length % 2) imp++; else trab += horasTrab(m); prev += ESC_DIA(dt, c); } else if (ESC_DIA(dt, c) && !folga) falt++; }
      const rev = revisoesPend().filter(x => x.r.colabId === c.id && x.r.data.startsWith(comp)).length;
      return { c, trab, prev, dias, falt, imp, rev, saldo: trab - prev };
    });
    const pend = lin.reduce((s, x) => s + x.imp + x.rev, 0);
    bi.innerHTML = `<div class="row" style="margin-bottom:14px"><input class="inp" type="month" id="bm-c" value="${comp}" style="width:auto" aria-label="Mês"><span class="sp"></span>
        ${fech ? `<span class="pill ok">Fechado por ${esc(fech.por)} em ${new Date(fech.em).toLocaleDateString('pt-BR')}</span>` : '<span class="pill warn">Aberto</span>'}
        <button class="btn sec sm" id="bm-pr">Imprimir espelhos</button>${ed ? (fech ? '<button class="btn sec sm" id="bm-ra">Reabrir mês</button>' : '<button class="btn sm" id="bm-fe">Fechar mês</button>') : ''}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th class="n">Dias</th><th class="n">Trabalhadas</th><th class="n">Previstas</th><th class="n">Saldo</th><th class="n">Faltas</th><th class="n">Pendências</th></tr></thead><tbody>
      ${lin.map(x => `<tr><td><b>${esc(x.c.nome)}</b></td><td class="n">${x.dias}</td><td class="n">${hm(x.trab)}</td><td class="n">${hm(x.prev)}</td><td class="n" style="color:${x.saldo > 0 ? 'var(--ok)' : x.saldo < 0 ? 'var(--bad)' : 'inherit'}">${x.saldo > 0 ? '+' : ''}${hm(x.saldo)}</td><td class="n">${x.falt || ''}</td><td class="n">${x.imp + x.rev ? `<span class="pill warn">${x.imp + x.rev}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">Fechar o mês trava os ajustes de ponto do período. Resolva as pendências (marcações ímpares e revisões) antes de fechar.</p>`;
    $('#bm-c', bi).onchange = e => { S.bioComp = e.target.value; re(); };
    $('#bm-pr', bi).onclick = () => printDoc(`Espelhos ${comp}`, lin.map(x => { const rows = []; for (let d = 1; d <= nd; d++) { const dt = new Date(a, mm - 1, d), r = regDia(x.c.id, iso(dt)), m = r ? r.marc.slice().sort() : []; rows.push(`<tr><td>${dt.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit' })}</td><td>${m.join(' · ') || emFolga(x.c, iso(dt)) || ''}</td><td class="n">${m.length && !(m.length % 2) ? hm(horasTrab(m)) : ''}</td></tr>`); }
      return `<h2>Espelho de ponto — ${mesNome(comp)}</h2><p><b>${esc(x.c.nome)}</b> · ${esc(x.c.cargo || '')} · CPF ${esc(x.c.cpf || '—')}</p><table><tr><th>Dia</th><th>Marcações</th><th class="n">Horas</th></tr>${rows.join('')}<tr><th colspan="2">Total · saldo ${hm(x.saldo)}</th><th class="n">${hm(x.trab)}</th></tr></table><div class="ass"><div>Colaborador</div><div>Empregador</div></div><div class="pb"></div>`; }).join(''));
    const fe = $('#bm-fe', bi); if (fe) fe.onclick = () => confirmar(`${pend ? `<b>Há ${pend} pendência(s) no mês.</b> ` : ''}Fechar o ponto de ${mesNome(comp)}? Os ajustes ficam travados.`, () => { cfg.fechamentos = { ...(cfg.fechamentos || {}), [comp]: { em: new Date().toISOString(), por: S.user.nome } }; save('config'); audit(`Fechou o ponto de ${mesNome(comp)}`); re(); }, 'Fechar mês');
    const ra = $('#bm-ra', bi); if (ra) ra.onclick = () => { const f = { ...(cfg.fechamentos || {}) }; delete f[comp]; cfg.fechamentos = f; save('config'); audit(`Reabriu o ponto de ${mesNome(comp)}`); re(); };
  }

  if (aba === 'justif') {
    const l = S.data.solic.filter(s => s.status === 'pendente' && ['ajuste_ponto', 'atestado'].includes(s.tipo)).sort((a, b) => a.criadoEm.localeCompare(b.criadoEm));
    bi.innerHTML = l.length ? `<div class="tbl-wrap"><table><thead><tr><th>Pedido em</th><th>Colaborador</th><th>Tipo</th><th>Detalhes</th><th></th></tr></thead><tbody>${l.map(s => `<tr><td>${new Date(s.criadoEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td><b>${esc((colabById(s.colabId) || {}).nome || '—')}</b></td><td>${TIPOS_SOLIC[s.tipo]}</td><td>${esc(resumoSolic(s))}</td><td class="n">${ed ? `<button class="btn sm" data-dec="${s.id}">Decidir</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="panel empty"><b>Nenhuma justificativa pendente</b>Pedidos de ajuste de ponto e atestados enviados pelo portal aparecem aqui.</div>';
    $$('[data-dec]', bi).forEach(b => b.onclick = () => decidirSolic(S.data.solic.find(x => x.id === b.dataset.dec), re));
  }

  if (aba === 'geo') {
    const lojas = cfg.lojas || [], cerca = cfg.cerca || { modo: 'alertar' };
    const hojeRegs = []; S.data.ponto.filter(r => r.data === iso(hoje())).forEach(r => Object.entries(r.ev || {}).forEach(([h, e]) => { if (r.marc.includes(h) && e.origem === 'portal') hojeRegs.push({ r, h, e }); }));
    bi.innerHTML = `<div class="cols"><section class="panel"><h2>Lojas e cerca virtual</h2>
        ${lojas.length ? `<ul class="list">${lojas.map(l => `<li><div class="t"><div>${esc(l.nome)}</div><div>${l.lat.toFixed(5)}, ${l.lng.toFixed(5)} · raio ${l.raio} m</div></div><a class="btn ghost sm" href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">Mapa</a>${ed ? `<button class="btn ghost sm" data-lx="${l.id}" style="color:var(--bad)">Excluir</button>` : ''}</li>`).join('')}</ul>` : '<p class="hint">Sem lojas cadastradas: a localização é registrada, mas não é conferida.</p>'}
        ${ed ? `<div class="grid" style="margin-top:14px"><div class="fld full"><label for="lj-n">Nome da loja</label><input class="inp" id="lj-n" placeholder="Ex.: Loja Centro"></div>
          <div class="fld"><label for="lj-a">Latitude</label><input class="inp" id="lj-a" inputmode="decimal"></div><div class="fld"><label for="lj-o">Longitude</label><input class="inp" id="lj-o" inputmode="decimal"></div>
          <div class="fld"><label for="lj-r">Raio (metros)</label><input class="inp" id="lj-r" type="number" min="30" value="150"></div></div>
          <div class="row"><button class="btn sec sm" id="lj-aqui">Usar minha localização</button><span class="sp"></span><button class="btn sm" id="lj-ok">Adicionar loja</button></div>
          <div class="fld" style="margin-top:16px"><label for="lj-m">Fora da cerca</label><select class="inp" id="lj-m">${opts([['alertar', 'Registrar e mandar para revisão'], ['bloquear', 'Não permitir o registro']], cerca.modo)}</select></div>` : ''}
      </section>
      <section class="panel"><h2>Registros de hoje pelo portal</h2>${hojeRegs.length ? `<ul class="list">${hojeRegs.map(({ r, h, e }) => `<li><div class="t"><div>${esc((colabById(r.colabId) || {}).nome || '—')} · ${h}</div><div>${e.cerca ? `${e.cerca.dist} m de ${esc(e.cerca.loja)}` : e.geo ? 'Sem loja para comparar' : 'Localização não informada'}</div></div>${e.cerca ? (e.cerca.dentro ? '<span class="pill ok">Dentro</span>' : '<span class="pill bad">Fora</span>') : '<span class="pill mut">—</span>'}${e.geo ? `<a class="btn ghost sm" href="https://www.google.com/maps?q=${e.geo.lat},${e.geo.lng}" target="_blank" rel="noopener">Mapa</a>` : ''}</li>`).join('')}</ul>` : '<div class="empty">Nenhum registro pelo portal hoje.</div>'}</section></div>`;
    const aq = $('#lj-aqui', bi); if (aq) aq.onclick = () => { if (!navigator.geolocation) return toast('Este navegador não informa a localização.', true); navigator.geolocation.getCurrentPosition(p => { $('#lj-a', bi).value = p.coords.latitude.toFixed(6); $('#lj-o', bi).value = p.coords.longitude.toFixed(6); toast(`Localização capturada (±${Math.round(p.coords.accuracy)} m).`); }, () => toast('Permita o acesso à localização no navegador.', true), { enableHighAccuracy: true, timeout: 10000 }); };
    const ok = $('#lj-ok', bi); if (ok) ok.onclick = () => { const n = $('#lj-n', bi).value.trim(), la = num($('#lj-a', bi).value), lo = num($('#lj-o', bi).value), r = parseInt($('#lj-r', bi).value) || 150;
      if (!n || !la || !lo || Math.abs(la) > 90 || Math.abs(lo) > 180) return toast('Informe nome, latitude e longitude válidas.', true);
      cfg.lojas = [...lojas, { id: uid(), nome: n, lat: la, lng: lo, raio: Math.max(30, r) }]; save('config'); audit(`Cadastrou a loja ${n} na cerca virtual`); re(); };
    const md = $('#lj-m', bi); if (md) md.onchange = () => { cfg.cerca = { modo: md.value }; save('config'); toast('Regra da cerca salva.'); };
    $$('[data-lx]', bi).forEach(b => b.onclick = () => confirmar('Excluir esta loja da cerca virtual?', () => { cfg.lojas = lojas.filter(l => l.id !== b.dataset.lx); save('config'); re(); }, 'Excluir', true));
  }

  if (aba === 'falhas') {
    const l = S.data.bioFalhas.slice().sort((a, b) => b.em.localeCompare(a.em)).slice(0, 150);
    bi.innerHTML = l.length ? `<div class="row" style="margin-bottom:12px"><span class="hint">Tentativas recusadas pelo reconhecimento facial.</span><span class="sp"></span>${ed ? '<button class="btn sec sm" id="fl-lp">Apagar com mais de 30 dias</button>' : ''}</div>
      <section class="panel"><ul class="list">${l.map(f => `<li>${f.foto ? `<img src="${f.foto}" alt="" style="width:48px;height:60px;object-fit:cover;border-radius:6px">` : '<div class="av">?</div>'}<div class="t"><div>${esc(f.colabId ? (colabById(f.colabId) || {}).nome || '—' : 'Não identificado')}</div><div>${new Date(f.em).toLocaleString('pt-BR')} · ${esc(f.motivo)}${f.dist != null ? ` · confiança ${confianca(f.dist)}%` : ''}</div></div></li>`).join('')}</ul></section>`
      : '<div class="panel empty"><b>Nenhuma falha registrada</b>Quando o rosto não confere ou a piscada não é detectada, a tentativa fica registrada aqui com a foto.</div>';
    const lp = $('#fl-lp', bi); if (lp) lp.onclick = () => { S.data.bioFalhas = S.data.bioFalhas.filter(f => f.em >= iso(addD(hoje(), -30))); save('bioFalhas'); re(); };
  }

  if (aba === 'analise') {
    const l = anomalias(30);
    bi.innerHTML = `<section class="panel"><h2>Análise do ponto com IA</h2><p class="hint" style="margin-top:0">A IA lê o resumo dos últimos 30 dias (${l.length} ocorrências) e aponta padrões, riscos trabalhistas e sugestões. Nenhum dado pessoal além do primeiro nome é enviado.</p>
      <button class="btn" id="an-go" ${l.length ? '' : 'disabled'}>Gerar análise</button><div id="an-r" style="margin-top:16px"></div></section>`;
    $('#an-go', bi).onclick = async () => {
      if (!iaChave()) { $('#an-r', bi).innerHTML = semChaveIA(); return; }
      const b = $('#an-go', bi); b.disabled = true; $('#an-r', bi).innerHTML = '<p class="hint">Analisando…</p>';
      const resumo = l.slice(0, 120).map(a => `${a.c.nome.split(' ')[0]} | ${a.t} | ${a.s}`).join('\n');
      try { const t = await perguntarIA([{ role: 'user', content: `Ocorrências do ponto nos últimos 30 dias (${ativos().length} colaboradores, escala 44h):\n${resumo}\n\nFaça: 1) resumo em 3 linhas; 2) padrões por colaborador; 3) riscos trabalhistas com o artigo da CLT; 4) ações práticas para o RH nesta semana.` }], 'Você é um analista de RH especialista em controle de jornada e CLT brasileira (arts. 58, 59, 66, 71, 74 e Portaria MTP 671/2021). Responda em português do Brasil, direto e prático.');
        $('#an-r', bi).innerHTML = `<div class="ia-txt">${mdLeve(t)}</div>`; }
      catch (e) { $('#an-r', bi).innerHTML = e.message === 'SEM_CHAVE' ? semChaveIA() : `<p class="pill bad">${esc(e.message)}</p>`; }
      b.disabled = false;
    };
  }

  if (aba === 'conf') {
    const b = cfg.bio || { modo: 'foto' }, p = cfg.portal || {}, h = p.horario || { ativo: false, ini: '06:00', fim: '23:00' };
    bi.innerHTML = `<section class="panel"><h2>Como o colaborador bate o ponto no portal</h2>
        <label class="check-row"><input type="radio" name="bm" value="foto" ${b.modo !== 'facial' ? 'checked' : ''}> <span><b>Foto de comprovação</b><br><span class="hint">Tira uma foto a cada marcação. O RH confere quando quiser.</span></span></label>
        <label class="check-row"><input type="radio" name="bm" value="facial" ${b.modo === 'facial' ? 'checked' : ''}> <span><b>Reconhecimento facial com prova de vida</b><br><span class="hint">Compara o rosto com a biometria aprovada e exige uma piscada, o que impede usar foto de outra pessoa. Casos duvidosos vão para Revisão.</span></span></label></section>
      <section class="panel"><h2>Expediente</h2><p class="hint" style="margin-top:0">Usado para calcular atrasos no painel e no absenteísmo.</p>
        <p class="hint" style="margin-top:0">O horário de entrada de cada funcionário vem da escala dele (Configurações > Escalas e feriados).</p><div class="row"><label class="hint" for="ex-t">Tolerância de atraso</label><input class="inp" type="number" id="ex-t" min="0" max="60" value="${expediente().tol}" style="width:90px"><span class="hint">minutos</span></div>
        <p class="note">A CLT (art. 58, §1º) não considera atraso variações de até 5 minutos por marcação, limitadas a 10 minutos por dia.</p></section>
      <section class="panel"><h2>Acesso ao portal</h2>
        <label class="check-row"><input type="checkbox" id="pc-h" ${h.ativo ? 'checked' : ''}> <span><b>Liberar o portal só em um horário</b><br><span class="hint">Fora do horário, só o registro de ponto continua disponível.</span></span></label>
        <div class="row"><label class="hint" for="pc-i">Das</label><input class="inp" type="time" id="pc-i" value="${h.ini}" style="width:auto"><label class="hint" for="pc-f">às</label><input class="inp" type="time" id="pc-f" value="${h.fim}" style="width:auto"></div>
        <p class="note">Para bloquear tudo na hora, use o botão "Portal" no topo da tela.</p></section>
      ${ed ? '<div class="row end"><button class="btn" id="bc-ok">Salvar configurações</button></div>' : ''}`;
    const s = $('#bc-ok', bi); if (s) s.onclick = () => { cfg.bio = { modo: $('input[name=bm]:checked', bi).value }; cfg.expediente = { tol: Math.min(60, Math.max(0, parseInt($('#ex-t', bi).value) || 0)) }; cfg.portal = { ...p, horario: { ativo: $('#pc-h', bi).checked, ini: $('#pc-i', bi).value || '06:00', fim: $('#pc-f', bi).value || '23:00' } }; save('config'); audit('Alterou configurações do ponto biométrico'); toast('Configurações salvas.'); };
  }
}

/* ---------- Absenteísmo ---------- */
function vAbs(el, comp = S.absComp || iso(hoje()).slice(0, 7)) {
  S.absComp = comp;
  const [a, mm] = comp.split('-').map(Number), nd = new Date(a, mm, 0).getDate();
  const ini0 = inicioControle();
  const lin = ativos().filter(c => c.tipo !== 'pj').map(c => {
    let uteis = 0, faltas = 0, atest = 0, ferias = 0, atras = 0;
    for (let d = 1; d <= nd; d++) { const dt = new Date(a, mm - 1, d), ds = iso(dt); if (dt >= hoje() || pd(c.admissao) > dt || ds < ini0 || !ESC_DIA(dt, c)) continue; uteis++;
      const f = emFolga(c, ds), r = regDia(c.id, ds);
      if (f === 'Férias') ferias++; else if (f) atest++; else if (!r || !r.marc.length) faltas++; else if (atrasoMin(c, ds, r.marc.slice().sort()) > 0) atras++; }
    const base = uteis - ferias; return { c, uteis: base, faltas, atest, atras, taxa: base ? (faltas + atest) / base : 0 };
  }).sort((x, y) => y.taxa - x.taxa);
  const tot = lin.reduce((s, x) => ({ u: s.u + x.uteis, f: s.f + x.faltas, a: s.a + x.atest }), { u: 0, f: 0, a: 0 }), taxa = tot.u ? (tot.f + tot.a) / tot.u : 0;
  const pct = x => (x * 100).toFixed(1).replace('.', ',') + '%';
  el.innerHTML = `<div class="row" style="margin-bottom:16px"><input class="inp" type="month" id="ab-c" value="${comp}" style="width:auto" aria-label="Mês"><span class="sp"></span><span class="hint">Dias previstos na escala desde ${fd(ini0)} (início do controle) até ontem · feriados não entram</span></div>
    <div class="kpis"><div class="kpi"><b style="color:${taxa > 0.03 ? 'var(--bad)' : 'var(--ok)'}">${pct(taxa)}</b><span>taxa de absenteísmo</span></div><div class="kpi"><b>${tot.f}</b><span>faltas sem justificativa</span></div><div class="kpi"><b>${tot.a}</b><span>dias de atestado ou suspensão</span></div><div class="kpi"><b>${lin.reduce((s, x) => s + x.atras, 0)}</b><span>entradas com atraso</span></div></div>
    ${lin.length ? `<div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th class="n">Dias previstos</th><th class="n">Faltas</th><th class="n">Atestados</th><th class="n">Atrasos</th><th>Absenteísmo</th></tr></thead><tbody>${lin.map(x => `<tr><td><b>${esc(x.c.nome)}</b></td><td class="n">${x.uteis}</td><td class="n">${x.faltas || ''}</td><td class="n">${x.atest || ''}</td><td class="n">${x.atras || ''}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="width:120px"><i style="width:${Math.min(100, x.taxa * 500)}%;background:${x.taxa > 0.05 ? 'var(--bad)' : x.taxa > 0.02 ? 'var(--warn)' : 'var(--ok)'}"></i></div><b>${pct(x.taxa)}</b></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="panel empty">Sem colaboradores ativos.</div>'}
    <p class="note">Referência de mercado: até 3% é considerado saudável. Faltas sem justificativa podem ser descontadas com o DSR da semana (Lei 605/49, art. 6º).</p>`;
  $('#ab-c', el).onchange = e => vAbs(el, e.target.value);
}

/* ---------- Financeiro ---------- */
const descAdiant = (cid, comp) => r2(S.data.adiant.filter(x => x.colabId === cid).reduce((s, x) => { const k = (+comp.slice(0, 4) - +x.comp.slice(0, 4)) * 12 + (+comp.slice(5) - +x.comp.slice(5)); return s + (k >= 0 && k < x.parcelas ? x.valor / x.parcelas : 0); }, 0));
function vFin(el, comp = S.finComp || iso(hoje()).slice(0, 7)) {
  S.finComp = comp;
  const cfg = S.data.config, regime = cfg.regime || 'simples', folha = S.data.folhas.find(f => !f.tipo && f.comp === comp);
  const enc = regime === 'simples' ? 0 : 0.278;
  const lin = ativos().filter(c => c.tipo !== 'pj').map(c => {
    const it = folha && folha.itens.find(i => i.colabId === c.id), bruto = it ? folhaItem(it).base : num(c.salario);
    const fgts = r2(bruto * 0.08), patr = r2(bruto * enc), prov = r2(bruto / 12 + bruto / 12 * 4 / 3), provF = r2(prov * (0.08 + enc));
    return { c, bruto, fgts, patr, prov: r2(prov + provF), custo: r2(bruto + fgts + patr + prov + provF), adi: descAdiant(c.id, comp) };
  }).sort((a, b) => b.custo - a.custo);
  const pj = ativos().filter(c => c.tipo === 'pj').reduce((s, c) => s + num(c.salario), 0);
  const T2 = k => r2(lin.reduce((s, x) => s + x[k], 0)), custo = T2('custo') + pj;
  const deps = {}; lin.forEach(x => { const d = x.c.depto || 'Sem setor'; deps[d] = (deps[d] || 0) + x.custo; });
  const mx = Math.max(1, ...Object.values(deps));
  el.innerHTML = `<div class="row" style="margin-bottom:16px"><input class="inp" type="month" id="fi-c" value="${comp}" style="width:auto" aria-label="Mês">
      <select class="inp" id="fi-r" style="width:auto" aria-label="Regime tributário" ${podeEditar() && can('admin') ? '' : 'disabled'}>${opts([['simples', 'Simples Nacional (anexos I a III)'], ['normal', 'Lucro Presumido ou Real']], regime)}</select><span class="sp"></span>
      <span class="hint">${folha ? `Valores da folha de ${mesNome(comp)}` : 'Sem folha gerada: usando salários base'}</span></div>
    <div class="kpis"><div class="kpi"><b style="font-size:22px">${brl(T2('bruto'))}</b><span>folha bruta CLT</span></div><div class="kpi"><b style="font-size:22px">${brl(T2('fgts') + T2('patr'))}</b><span>encargos do mês</span></div><div class="kpi"><b style="font-size:22px">${brl(T2('prov'))}</b><span>provisão férias e 13º</span></div><div class="kpi"><b style="font-size:22px">${brl(custo)}</b><span>custo total com pessoal</span></div></div>
    <div class="cols"><section class="panel"><h2>Custo por colaborador</h2><div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th class="n">Bruto</th><th class="n">Encargos</th><th class="n">Provisões</th><th class="n">Custo</th></tr></thead><tbody>${lin.map(x => `<tr><td>${esc(x.c.nome)}</td><td class="n">${brl(x.bruto)}</td><td class="n">${brl(x.fgts + x.patr)}</td><td class="n">${brl(x.prov)}</td><td class="n"><b>${brl(x.custo)}</b></td></tr>`).join('')}${pj ? `<tr><td>Prestadores PJ</td><td class="n">${brl(pj)}</td><td></td><td></td><td class="n"><b>${brl(pj)}</b></td></tr>` : ''}</tbody></table></div></section>
      <div><section class="panel"><h2>Por setor</h2>${Object.entries(deps).sort((a, b) => b[1] - a[1]).map(([d, v]) => `<div style="margin-bottom:10px"><div class="row"><span>${esc(d)}</span><span class="sp"></span><b>${brl(v)}</b></div><div class="bar"><i style="width:${v / mx * 100}%"></i></div></div>`).join('') || '<p class="hint">Sem dados.</p>'}</section>
      <section class="panel"><h2>Adiantamentos a descontar</h2><b style="font-size:22px">${brl(T2('adi'))}</b><p class="hint" style="margin:4px 0 0">Parcelas de adiantamentos e vales que caem em ${mesNome(comp)}.</p></section></div></div>
    <p class="note">${regime === 'simples' ? 'No Simples Nacional (anexos I a III) a contribuição patronal ao INSS está dentro do DAS; entram FGTS 8% e provisões.' : 'Encargos estimados: INSS patronal 20% + RAT 2% + terceiros 5,8% sobre a folha, além do FGTS 8%.'} Provisões: 1/12 de 13º e 1/12 de férias + 1/3 por mês, com encargos.</p>`;
  $('#fi-c', el).onchange = e => vFin(el, e.target.value);
  $('#fi-r', el).onchange = e => { S.data.config.regime = e.target.value; save('config'); vFin(el, comp); };
}

function vAdm(el) {

function vIA(el) {

  if (!iaChave()) { el.innerHTML = semChaveIA(); return; }
  const sug = ['Como calculo o aviso prévio proporcional?', 'Posso descontar a falta junto com o DSR?', 'Quais os prazos do eSocial na admissão e na demissão?', 'Como funciona banco de horas por acordo individual?', 'Quando a advertência vira justa causa?'];

    <div class="row" style="padding:10px;flex-wrap:nowrap"><textarea class="inp" id="ia-t" style="min-height:48px;height:48px;resize:none" placeholder="Pergunte sobre CLT, eSocial, férias, rescisão, jornada…" aria-label="Pergunta"></textarea><button class="btn" id="ia-e">Perguntar</button></div></div>

  const box = $('#ia-m', el), pint = () => { box.innerHTML = S.iaHist.length ? S.iaHist.map(m => `<div class="msg ${m.role === 'user' ? 'eu' : ''}">${m.role === 'user' ? esc(m.content) : mdLeve(m.content)}</div>`).join('') : '<div class="empty" style="margin:auto"><b>Consultor CLT</b>Tire dúvidas de legislação trabalhista com respostas que citam a lei.</div>'; box.scrollTop = box.scrollHeight; };

  const enviar = async txt => { const t = (txt || $('#ia-t', el).value).trim(); if (!t) return; $('#ia-t', el).value = ''; $('#ia-s', el).innerHTML = ''; S.iaHist.push({ role: 'user', content: t }); pint();
    box.insertAdjacentHTML('beforeend', '<div class="msg" id="ia-w">Pensando…</div>'); box.scrollTop = box.scrollHeight; const b = $('#ia-e', el); b.disabled = true;
    try { const r = await perguntarIA(S.iaHist.slice(-12), `Você é o Consultor CLT do NEXUM RH, especialista em legislação trabalhista brasileira. Hoje é ${new Date().toLocaleDateString('pt-BR')}. A empresa tem ${ativos().length} colaboradores e regime ${(S.data.config.regime || 'simples') === 'simples' ? 'Simples Nacional' : 'Lucro Presumido/Real'}. Responda em português do Brasil, de forma objetiva e prática, citando artigos da CLT, súmulas e OJs do TST, a Portaria MTP 671/2021 e os eventos do eSocial quando se aplicarem. Mostre cálculos passo a passo quando houver números. Avise quando a resposta depender de convenção coletiva. Não invente números de lei; se não tiver certeza, diga.`);
      S.iaHist.push({ role: 'assistant', content: r }); }
    catch (e) { S.iaHist.push({ role: 'assistant', content: e.message === 'SEM_CHAVE' ? 'Configure a chave da IA em Configurações > Integrações.' : e.message }); }
    b.disabled = false; pint(); };
  $('#ia-e', el).onclick = () => enviar(); $('#ia-t', el).onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } };

/* ---------- Agenda de RH ---------- */
function quintoDiaUtil(a, m) { let n = 0; for (let d = 1; d <= 31; d++) { const dt = new Date(a, m, d); if (dt.getMonth() !== m) break; if (dt.getDay() !== 0 && ++n === 5) return dt; } }
function eventosAgenda(ini, fim) {
  const ev = [], add = (d, t, tipo, extra = {}) => { const ds = typeof d === 'string' ? d : iso(d); if (ds >= iso(ini) && ds <= iso(fim)) ev.push({ data: ds, t, tipo, ...extra }); };
  S.data.agenda.forEach(e => add(e.data, e.titulo, e.tipo || 'manual', { hora: e.hora, id: e.id, obs: e.obs }));
  ativos().forEach(c => { const adm = pd(c.admissao);
    if (c.tipo === 'experiencia' && adm) { add(addD(adm, 44), `Fim do 1º prazo de experiência: ${c.nome}`, 'prazo'); add(addD(adm, 89), `Fim da experiência: ${c.nome}`, 'prazo'); }
    if (c.nascimento) { const n = pd(c.nascimento); for (let y = ini.getFullYear(); y <= fim.getFullYear(); y++) add(new Date(y, n.getMonth(), n.getDate()), `Aniversário: ${c.nome}`, 'aniv'); }
    const st = statusFerias(c); if (st.limite && st.saldo) add(st.limite, `Limite para conceder férias: ${c.nome}`, 'prazo'); });
  S.data.ferias.forEach(f => { const c = colabById(f.colabId); if (c) add(f.inicio, `Início das férias: ${c.nome}`, 'ferias'); });
  S.data.admis.filter(p => p.status === 'andamento').forEach(p => add(p.inicio, `Início de ${p.nome} (${p.cargo})`, 'adm'));
  S.data.cands.filter(c => c.entrevista).forEach(c => add(c.entrevista.slice(0, 10), `Entrevista: ${c.nome}`, 'entrev', { hora: c.entrevista.slice(11, 16) }));
  S.data.colab.filter(c => c.status === 'desligado' && c.desligamento).forEach(c => add(addD(pd(c.desligamento), 10), `Prazo de pagamento da rescisão: ${c.nome}`, 'prazo'));
  for (let a = ini.getFullYear(); a <= fim.getFullYear(); a++) { add(new Date(a, 10, 30), 'Prazo da 1ª parcela do 13º salário', 'prazo'); add(new Date(a, 11, 20), 'Prazo da 2ª parcela do 13º salário', 'prazo'); }
  for (let a = ini.getFullYear(); a <= fim.getFullYear(); a++) Object.entries(feriadosAno(a, S.data.config)).forEach(([d, x]) => add(d, `Feriado: ${x.nome}`, 'feriado'));
  for (let a = ini.getFullYear(), m = ini.getMonth(); new Date(a, m, 1) <= fim; m++) { if (m > 11) { m = 0; a++; } add(quintoDiaUtil(a, m), 'Pagamento de salários (5º dia útil)', 'pag'); add(new Date(a, m, 20), 'Vencimento DAS / FGTS Digital (dia 20)', 'pag'); }
  return ev.sort((a, b) => a.data.localeCompare(b.data) || (a.hora || '').localeCompare(b.hora || ''));
}
function vAgenda(el) {
  const ref = S.agMes ? pd(S.agMes + '-01') : new Date(hoje().getFullYear(), hoje().getMonth(), 1), a = ref.getFullYear(), m = ref.getMonth();
  const ini = new Date(a, m, 1), fim = new Date(a, m + 1, 0), ev = eventosAgenda(ini, fim), prox = eventosAgenda(hoje(), addD(hoje(), 30));
  const cor = { prazo: 'bad', aniv: 'ok', ferias: 'pri', adm: 'pri', entrev: 'warn', pag: 'mut', manual: 'pri', feriado: 'warn' };
  const cells = []; for (let i = 0; i < ini.getDay(); i++) cells.push('<div class="cal-d vazio"></div>');
  for (let d = 1; d <= fim.getDate(); d++) { const ds = iso(new Date(a, m, d)), es = ev.filter(e => e.data === ds); cells.push(`<div class="cal-d ${ds === iso(hoje()) ? 'hoje' : ''}"><span class="cal-n">${d}</span>${es.slice(0, 3).map(e => `<span class="cal-e ${cor[e.tipo]}" title="${esc(e.t)}">${esc(e.t)}</span>`).join('')}${es.length > 3 ? `<span class="hint" style="font-size:11px">+${es.length - 3}</span>` : ''}</div>`); }
  el.innerHTML = `<div class="row" style="margin-bottom:14px"><button class="btn sec sm" id="ag-a" aria-label="Mês anterior">‹</button><b style="text-transform:capitalize;font-size:17px;min-width:170px;text-align:center">${ref.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</b><button class="btn sec sm" id="ag-p" aria-label="Próximo mês">›</button><button class="btn ghost sm" id="ag-h">Hoje</button><span class="sp"></span>${podeEditar() ? '<button class="btn" id="ag-n">Novo compromisso</button>' : ''}</div>
    <div class="cols"><div class="cal"><div class="cal-w">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(x => `<span>${x}</span>`).join('')}</div><div class="cal-g">${cells.join('')}</div></div>
    <section class="panel"><h2>Próximos 30 dias</h2>${prox.length ? `<ul class="list">${prox.slice(0, 25).map(e => `<li><span class="pill ${cor[e.tipo]}" style="min-width:74px;justify-content:center">${pd(e.data).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}</span><div class="t"><div>${esc(e.t)}</div>${e.hora || e.obs ? `<div>${esc([e.hora, e.obs].filter(Boolean).join(' · '))}</div>` : ''}</div>${e.id && podeEditar() ? `<button class="btn ghost sm" data-x="${e.id}" style="color:var(--bad)" aria-label="Excluir compromisso">×</button>` : ''}</li>`).join('')}</ul>` : '<div class="empty">Nada nos próximos 30 dias.</div>'}</section></div>`;
  const mv = k => { S.agMes = iso(new Date(a, m + k, 1)).slice(0, 7); vAgenda(el); };
  $('#ag-a', el).onclick = () => mv(-1); $('#ag-p', el).onclick = () => mv(1); $('#ag-h', el).onclick = () => { S.agMes = null; vAgenda(el); };
  const n = $('#ag-n', el); if (n) n.onclick = () => modal('Novo compromisso', `<div class="grid"><div class="fld full"><label for="ag-t">Título</label><input class="inp" id="ag-t" placeholder="Ex.: Exame periódico da equipe"></div><div class="fld"><label for="ag-d">Data</label><input class="inp" type="date" id="ag-d" value="${iso(hoje())}"></div><div class="fld"><label for="ag-hh">Hora</label><input class="inp" type="time" id="ag-hh"></div><div class="fld full"><label for="ag-o">Observação</label><input class="inp" id="ag-o"></div></div>`, { size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="ag-ok">Salvar</button>', onMount: md => $('#ag-ok', md).onclick = () => { const t = $('#ag-t', md).value.trim(), d = $('#ag-d', md).value; if (!t || !d) return toast('Informe título e data.', true); S.data.agenda.push({ id: uid(), titulo: t, data: d, hora: $('#ag-hh', md).value, obs: $('#ag-o', md).value.trim(), tipo: 'manual' }); save('agenda'); closeModal(); vAgenda(el); } });
  $$('[data-x]', el).forEach(b => b.onclick = () => { S.data.agenda = S.data.agenda.filter(e => e.id !== b.dataset.x); save('agenda'); vAgenda(el); });
}

/* ---------- 13º salário ---------- */
function calc13(c, ano) {
  const adm = pd(c.admissao), fim = new Date(ano, 11, 31); if (!adm || adm > fim) return null;
  const avos = meses13(adm, fim), sal = num(c.salario);
  const fs = S.data.folhas.filter(f => !f.tipo && f.comp.startsWith(ano + '-') && f.comp < `${ano}-12`).map(f => f.itens.find(i => i.colabId === c.id)).filter(Boolean);
  const media = fs.length ? r2(fs.reduce((s, i) => { const p = i.ponto || {}; return s + num(i.adic) + num(p.he50) + num(p.he100) + num(p.not) + num(p.dsr); }, 0) / fs.length) : 0;
  const total = r2((sal + media) * avos / 12);
  const adiant = S.data.ferias.filter(f => f.colabId === c.id && (f.inicio || '').startsWith(ano + '-')).reduce((s, f) => s + num(f.calc && f.calc.d13), 0);
  const p1 = Math.max(0, r2(total / 2 - adiant)), inss = calcINSS(total), irrf = calcIRRF(total, inss, c.dependentes);
  return { c, avos, sal, media, total, adiant, p1, inss, irrf, p2: r2(total - p1 - adiant - inss - irrf), fgts1: r2((p1 + adiant) * T().fgts), fgts2: r2((total - p1 - adiant) * T().fgts) };
}

/* ---------- Logo da empresa ---------- */
function lerLogo(file) {
  return new Promise((res, rej) => { if (!/^image\//.test(file.type)) return rej(new Error('tipo')); const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, 360 / img.width, 140 / img.height), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/png')); };
    img.onerror = () => rej(new Error('img')); img.src = u; });
}

/* ---------- Licenciamento ----------
   Formato: NXM-PPDD-TTTT-CCCC
   PP = plano (ES/PR/EM), DD = meses (base 36), TTTT = hash do tenant, CCCC = checksum.
   As chaves são geradas no Painel do Dono (nexum_admin.html). O SEGREDO precisa ser igual nos dois arquivos. */
const SEGREDO = 'nx-fed54b4be9eec3be635eaadb';
const PL_COD = { essencial: 'ES', profissional: 'PR', empresa: 'EM' };
function h4(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return (h % 1679616).toString(36).toUpperCase().padStart(4, '0'); }
function validarChave(k, tid) {
  const m = String(k).trim().toUpperCase().match(/^NXM-([A-Z]{2})([0-9A-Z]{2})-([0-9A-Z]{4})-([0-9A-Z]{4})$/); if (!m) return null;
  const plano = Object.keys(PL_COD).find(p => PL_COD[p] === m[1]); if (!plano) return null;
  if (m[3] !== h4(tid) || m[4] !== h4(m[1] + m[2] + m[3] + SEGREDO)) return null;
  return { plano, dias: parseInt(m[2], 36) * 30 };
}

/* ---------- Inicialização ---------- */
document.documentElement.dataset.theme = localStorage.getItem('nexum:tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

/* aviso quando o Firebase não pode funcionar */
(function avisoFirebase() {
  let msg = '';
  if (FIREBASE_CONFIG.apiKey && location.protocol === 'file:') msg = 'Você abriu o arquivo direto do computador. O Firebase só funciona com o sistema hospedado (ex.: GitHub Pages). Aqui ele roda em modo local, com dados só neste navegador.';
  else if (FIREBASE_CONFIG.apiKey && typeof firebase === 'undefined') msg = 'Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.';
  if (!msg) return;
  const el = document.createElement('div'); el.setAttribute('role', 'alert');
  el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:90;background:#B42318;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 44px 10px 16px;text-align:center';
  el.innerHTML = msg + '<button aria-label="Fechar aviso" style="position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer">×</button>';
  el.querySelector('button').onclick = () => el.remove(); document.body.appendChild(el);
})();
(function limparDemo() { try { if (Store.tenants().some(t => t.id === 'demo')) { Store.wipe('demo'); Store.saveTenants(Store.tenants().filter(t => t.id !== 'demo')); } } catch (e) { } })();
(function init() {
  if (FB_ON) { renderAuth(); FB.auth.onAuthStateChanged(u => { if (FB.criando) return; if (u && !S.user) fbEntrarRH(u); else if (!u && S.user) { S.tenant = S.user = null; FB.fechar(); renderAuth(); } }); return; }
  try {
    const s = JSON.parse(sessionStorage.getItem('nexum:sess') || 'null');
    if (s) { const t = Store.tenants().find(x => x.id === s.t); const u = t && Store.get(t.id, 'users', []).find(x => x.id === s.u && x.ativo !== false); if (u) return entrar(t, u); }
  } catch (e) { }
  renderAuth();
})();
