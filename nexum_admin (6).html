<style>
:root{
  --ink:#0A1733;--ink2:#13244D;--ink3:#26406F;
  --bg:#F4F4F8;--card:#FFFFFF;--line:#E2E1EC;--line2:#EEEDF4;
  --txt:#1B1A2E;--mut:#696784;
  --pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;
  --soft:#FAFAFC;--hover:#F7F6FB;
  --r:10px;--rs:6px;
  --f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
#root{height:100%;min-height:100vh;min-height:100dvh}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- Login ---------- */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;min-height:100dvh}
.auth-art{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px)}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%}
.auth-art>*:not(canvas){position:relative}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.02em}
.brand .marca{height:30px;width:auto;display:block}
.brand-sub{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:500;font-size:.9em;letter-spacing:.06em;color:rgba(255,255,255,.72);line-height:1.1}
.brand small{font-weight:500;opacity:.6;letter-spacing:0}
.auth-claim{font-size:clamp(34px,4.6vw,60px);font-weight:700;line-height:1.02;letter-spacing:-.035em;max-width:11ch}
.auth-sub{opacity:.72;max-width:40ch;margin-top:16px}
.auth-foot{font-size:13px;opacity:.5}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--card)}
.auth-box{width:100%;max-width:400px}
.seg{display:flex;background:var(--bg);border-radius:var(--r);padding:4px;margin-bottom:28px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(10,23,51,.12)}

/* ---------- Form ---------- */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}
.inp.err{border-color:var(--bad)}
textarea.inp{min-height:90px;resize:vertical}
.grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:9px 16px;min-height:40px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--pri);padding:6px 10px;min-height:32px}
.btn.ghost:hover{background:var(--pri-s)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;height:100dvh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.side .brand{padding:4px 8px 22px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.66);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side-foot .who{font-weight:600}
.side-foot .role{opacity:.55}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:20px}
.menu-btn{display:none;border:0;background:none;padding:6px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px)}
.wrap{max-width:1240px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.pill.mut{background:var(--line2);color:var(--mut)}
.banner{padding:10px 16px;background:var(--warn-s);color:var(--warn);font-size:14px;font-weight:500;border-bottom:1px solid #F1DDB8}
.banner.bad{background:var(--bad-s);color:var(--bad);border-color:#F2C9C9}

/* ---------- Blocks ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.panel h2{font-size:16px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--card);padding:18px 20px}
.kpi b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:13.5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}
.list .t div:first-child{font-weight:600}
.list .t div+div{font-size:13px;color:var(--mut)}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--txt);margin-bottom:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:var(--soft);border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri-s);color:var(--pri-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.name-cell{display:flex;align-items:center;gap:10px}
.name-cell small{display:block;color:var(--mut)}
td input.inp{min-height:32px;padding:5px 8px;width:110px;text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.res{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.res div:last-child{border-bottom:0}
.res .h{background:var(--soft);font-weight:700;font-size:13px;color:var(--mut)}
.res .tot{background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 10px}
.tl li::before{content:"";position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--pri);border:2px solid var(--card)}
.tl small{color:var(--mut)}

/* ---------- Modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(10,23,51,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:50}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(10,23,51,.3);animation:pop .16s ease-out}
.modal.sm{max-width:460px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px;flex:1}
.modal-b{padding:20px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mut);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--bg)}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#FF5C7A;color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;margin-left:auto}
.bdg:empty{display:none}
.chat-rh{display:grid;grid-template-columns:260px 1fr;min-height:460px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.chat-rh .cl{border-right:1px solid var(--line);overflow-y:auto;max-height:560px}
.chat-rh .cl button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line2);background:none;padding:12px 14px;text-align:left;cursor:pointer}
.chat-rh .cl button.on{background:var(--pri-s)}
.chat-rh .th{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--soft);max-height:480px}
.msg{max-width:78%;padding:9px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.msg.eu{align-self:flex-end;background:var(--pri);color:#fff;border-color:var(--pri)}
.msg small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.bar{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--pri)}
@media (max-width:820px){.chat-rh{grid-template-columns:1fr}.chat-rh .cl{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(10,23,51,.3);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad)}
.doc-prev{border:1px solid var(--line);border-radius:var(--rs);padding:28px;max-height:60vh;overflow:auto;font-family:Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.7}
.doc-prev h2{text-align:center;font-size:17px;margin-bottom:18px;font-family:var(--f)}

@media (max-width:960px){
  .cols{grid-template-columns:1fr}
}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .auth-art{min-height:260px}
  .auth-claim{font-size:34px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,23,51,.45)}
  .menu-btn{display:block}
  .top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
}
.bio-cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;width:min(100%,calc(58vh * .75));margin:0 auto}
.bio-cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.bio-oval{position:absolute;left:17%;right:17%;top:7%;bottom:21%;border-radius:50%;border:3px solid rgba(255,255,255,.92);box-shadow:0 0 0 999px rgba(8,17,31,.64);transition:border-color .25s}
.bio-oval::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:ovalPulso 1.8s ease-out infinite}
.bio-oval.ok{border-color:#3BD48C}.bio-oval.ok::after{border-color:rgba(59,212,140,.6)}
@keyframes ovalPulso{0%{transform:scale(.97);opacity:1}100%{transform:scale(1.07);opacity:0}}
.bio-topo,.bio-dica{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:600;padding:0 14px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.bio-topo{top:1.6%;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.bio-dica{bottom:3.5%;font-size:15px;line-height:1.3}
.bio-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.bio-flash.on{animation:bioFlash .4s ease-out}
@keyframes bioFlash{0%{opacity:.95}100%{opacity:0}}
.bio-msg{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bio-prog{margin-top:12px;height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.bio-prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}

html[data-theme="dark"]{--bg:#08111F;--card:#101C33;--line:#233457;--line2:#1A2946;--txt:#ECEBF7;--mut:#9FB0CC;--pri-s:#15294F;--pri-d:#8FB4FF;--ok-s:#123326;--warn-s:#3A2C10;--bad-s:#3D1717;--soft:#14213B;--hover:#172642;--ok:#3BD48C;--warn:#F2B34A;--bad:#FF7A7A}
html[data-theme="dark"] .banner{border-color:transparent}
html[data-theme="dark"] .inp{background:#0C1629}
html[data-theme="dark"] .doc-prev{background:#fff;color:#111}
.nav .nav-g{font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.45);padding:12px 12px 6px;margin-top:6px;gap:8px;border-radius:8px}
.nav .nav-g:hover{background:rgba(255,255,255,.05);color:#fff}
.nav .nav-g{width:100%}
.nav .nav-g .bdg-g{margin-left:auto}
.nav .nav-g .bdg-g:empty+.chev{margin-left:auto}
.nav .nav-g .chev{width:16px;height:16px;margin-left:6px;transition:transform .2s;opacity:.8}
.nav .nav-g[aria-expanded="true"] .chev{transform:rotate(180deg);margin-left:auto}
.nav .nav-g[aria-expanded="true"] .bdg-g{display:none}
.nav-itens{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.nav-itens>div{overflow:hidden;display:flex;flex-direction:column;gap:2px;min-height:0}
.nav-sec.aberto .nav-itens{grid-template-rows:1fr}
.nav .bdg{margin-left:auto}
.tb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{background:var(--bg)}
.tb .bdg{margin:0}
.tb-ok{border-color:var(--ok);color:var(--ok);background:var(--ok-s)}
.tb-bad{border-color:var(--bad);color:#fff;background:var(--bad)}
.busca{position:relative;width:220px}
.busca .inp{min-height:36px;padding:6px 10px}
.busca-res{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(10,23,51,.18);z-index:45;overflow:hidden;min-width:260px}
.busca-res button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;text-align:left;cursor:pointer}
.busca-res button:hover{background:var(--pri-s)}
.sync{font-size:12.5px;color:var(--ok);border:1px solid var(--ok);background:var(--ok-s);border-radius:99px;padding:3px 10px;white-space:nowrap}
.relogio{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi3 .k{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.kpi3 .k span{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kpi3 .k b{display:block;font-size:34px;font-weight:700;margin-top:4px}
.kpi3 .ok{border-top-color:var(--ok)}.kpi3 .ok b{color:var(--ok)}
.kpi3 .bad{border-top-color:var(--bad)}.kpi3 .bad b{color:var(--bad)}
.kpi3 .pri{border-top-color:var(--pri)}.kpi3 .pri b{color:var(--pri)}
.check-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;cursor:pointer}
.check-row input{margin-top:4px;width:18px;height:18px;flex:none}
.rev-grid,.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rev-fotos{display:flex;gap:8px;margin-bottom:10px}
.rev-fotos figure{margin:0;text-align:center}
.rev-fotos img,.rev-sem{width:110px;height:140px;object-fit:cover;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--mut);font-size:13px}
.rev-fotos figcaption{font-size:12px;color:var(--mut)}
.adm{cursor:pointer;transition:border-color .15s}.adm:hover{border-color:var(--pri)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.kh{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);background:var(--soft);border-bottom:1px solid var(--line)}
.cal-w span{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:8px 0}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-d{min-height:92px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-d.vazio{background:var(--soft)}
.cal-d.hoje .cal-n{background:var(--pri);color:#fff;border-radius:99px}
.cal-n{font-size:12px;font-weight:700;width:22px;height:22px;display:grid;place-items:center}
.cal-e{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-e.bad{background:var(--bad-s);color:var(--bad)}.cal-e.ok{background:var(--ok-s);color:var(--ok)}.cal-e.warn{background:var(--warn-s);color:var(--warn)}.cal-e.mut{background:var(--line2);color:var(--mut)}
.ia-chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ia-txt{line-height:1.65}
.totem{position:fixed;inset:0;z-index:48;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px))}
.totem-top{display:flex;align-items:center;gap:12px}
.totem-h{font-size:28px;font-weight:700}
.totem-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.totem-msg{font-size:clamp(20px,3.4vw,30px);font-weight:700;text-align:center;min-height:40px}
.totem-msg.ok{color:#3BD48C}.totem-msg.bad{color:#FF8A8A}
.bk-card{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#9A4A0B;color:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;z-index:55;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:300px;font-size:14px}
@media (max-width:1100px){.busca{display:none}.sync{display:none}}
@media (max-width:820px){.top .pill{display:none}.tb{padding:6px 8px;font-size:12.5px}.kanban{grid-template-columns:repeat(5,220px)}.cal-d{min-height:56px}.cal-e{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:18px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bcol i{display:block;width:100%;max-width:44px;background:linear-gradient(180deg,var(--pri),#0B47D6);border-radius:6px 6px 2px 2px}
.bv{font-size:11.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.bl{font-size:12px;color:var(--mut)}
.chave{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px dashed var(--pri);border-radius:10px;padding:14px;margin-top:16px}
.chave code{font-size:20px;font-weight:700;letter-spacing:.06em;flex:1;color:var(--pri-d)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
</style>
</head>

let netRaf = null;
function startNet() {
  const cv = $('#net'); if (!cv) return; const ctx = cv.getContext('2d'); let W, H, pts;
  const rs = () => { W = cv.width = cv.offsetWidth * devicePixelRatio; H = cv.height = cv.offsetHeight * devicePixelRatio; pts = Array.from({ length: 34 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3 * devicePixelRatio, vy: (Math.random() - .5) * .3 * devicePixelRatio })); };
  rs(); window.onresize = rs; cancelAnimationFrame(netRaf);
  const lim = 140 * devicePixelRatio, red = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = () => { ctx.clearRect(0, 0, W, H); pts.forEach(p => { if (!red) { p.x += p.vx; p.y += p.vy; } if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; });

    pts.forEach(p => { ctx.fillStyle = 'rgba(77,141,255,.8)'; ctx.beginPath(); ctx.arc(p.x, p.y, 2 * devicePixelRatio, 0, 7); ctx.fill(); });
    if (!red && $('#net')) netRaf = requestAnimationFrame(f); };

}

function pixCRC(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let k = 0; k < 8; k++) { c = c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1; c &= 0xFFFF; } } return c.toString(16).toUpperCase().padStart(4, '0'); }
function pixCodigo({ chave, nome, cidade, valor, txid, desc }) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const limpa = (s, n) => (String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim().slice(0, n)) || 'NEXUM';
  const conta = f('00', 'br.gov.bcb.pix') + f('01', String(chave).trim()) + (desc ? f('02', limpa(desc, 40)) : '');
  const ref = String(txid || '***').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***';
  const p = f('00', '01') + f('26', conta) + f('52', '0000') + f('53', '986') + (valor ? f('54', (+valor).toFixed(2)) : '') + f('58', 'BR') + f('59', limpa(nome, 25)) + f('60', limpa(cidade, 15)) + f('62', f('05', ref)) + '6304';
  return p + pixCRC(p);

    if (k.chave && k.chave.length > 77) return toast('A chave PIX é longa demais.', true);
    if (k.chave && !k.nome) return toast('Informe o nome do recebedor do PIX.', true);
    d.cnpj = fmtCnpj(d.cnpj); d.atualizadoEm = new Date().toISOString(); const b = $('#pl-ok', el); b.disabled = true;
    try { await FB.db.doc('plataforma/publico').set(d); await FB.db.doc('plataforma/pix').set(k); A.plat = { publico: d, pix: k }; toast('Dados salvos. Já valem nos documentos e no PIX dos clientes.'); }
    catch (e) { toast(e.code === 'permission-denied' ? 'Sem permissão. Publique o firestore.rules novo no Firebase.' : 'Não foi possível salvar. Verifique a internet.', true); } b.disabled = false; };
}
function vChave(el) {
  el.innerHTML = `<section class="panel" style="max-width:620px"><h2>Chave de ativação</h2><p class="hint" style="margin-top:0">Para clientes que usam o sistema no <b>modo local</b> (sem Firebase). O cliente cola a chave em Configurações > Plano. No modo online não precisa de chave: use Renovar na lista de empresas.</p>
    <div class="grid"><div class="fld full"><label for="k-t">Código da empresa do cliente</label><input class="inp" id="k-t" placeholder="Aparece em Configurações > Plano no sistema do cliente" autocomplete="off"></div>
    <div class="fld"><label for="k-p">Plano</label><select class="inp" id="k-p">${opts(Object.entries(PLANOS).map(([k, p]) => [k, `${p.nome} — ${brl(p.preco)}/mês`]), 'profissional')}</select></div>
    <div class="fld"><label for="k-m">Período</label><select class="inp" id="k-m">${opts([[1, '1 mês'], [3, '3 meses'], [6, '6 meses'], [12, '12 meses']], 1)}</select></div></div>
    <div class="row end"><button class="btn" id="k-g">Gerar chave</button></div><div id="k-r"></div></section>
    <p class="note">A chave vale só para o código informado. O SEGREDO no início deste arquivo precisa ser igual ao do nexum_rh.html.</p>`;
  $('#k-g', el).onclick = () => { const t = $('#k-t', el).value.trim().toLowerCase(); if (!/^[a-z0-9]{3,}$/.test(t)) return toast('Informe o código da empresa (só letras minúsculas e números).', true);
    const k = gerarChave(t, $('#k-p', el).value, +$('#k-m', el).value);
    $('#k-r', el).innerHTML = `<div class="chave"><code>${k}</code><button class="btn sec sm" id="k-c">Copiar</button></div><p class="hint">${PLANOS[$('#k-p', el).value].nome} por ${+$('#k-m', el).value * 30} dias para a empresa <b>${esc(t)}</b>.</p>`;
    $('#k-c', el).onclick = async () => { try { await navigator.clipboard.writeText(k); toast('Chave copiada.'); } catch (e) { toast('Selecione e copie a chave manualmente.', true); } }; };
}

/* ---------- início ---------- */
/* aviso quando o Firebase não pode funcionar */
(function avisoFirebase() {
  let msg = '';
  if (FIREBASE_CONFIG.apiKey && location.protocol === 'file:') msg = 'Você abriu o arquivo direto do computador. O Firebase só funciona com o sistema hospedado (ex.: GitHub Pages). Aqui ele roda em modo local, com dados só neste navegador.';
  else if (FIREBASE_CONFIG.apiKey && typeof firebase === 'undefined') msg = 'Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.';
  if (!msg) return;
  const el = document.createElement('div'); el.setAttribute('role', 'alert');
  el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:90;background:#B42318;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 44px 10px 16px;text-align:center';
  el.innerHTML = msg + '<button aria-label="Fechar aviso" style="position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer">×</button>';
  el.querySelector('button').onclick = () => el.remove(); document.body.appendChild(el);
})();
(function init() {
  if (!FB_ON) return renderLogin();
  /* app com nome próprio: o login do dono não se mistura com o do RH nem com o do Portal (mesmo endereço) */
  const app = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-admin');
  FB = { auth: app.auth(), db: app.firestore() };
  FB.auth.onAuthStateChanged(async u => {
    if (!u) { A.user = null; A.carregado = false; return renderLogin(); }
    if (!DONO_EMAILS.map(e => e.toLowerCase()).includes((u.email || '').toLowerCase())) { toast('Este e-mail não é de proprietário. Confira DONO_EMAILS e o firestore.rules.', true); await FB.auth.signOut(); return; }
    A.user = { email: u.email }; A.uid = u.uid; A.tokenEmail = ''; cancelAnimationFrame(netRaf);
    try { if (u.getIdTokenResult) { const r = await u.getIdTokenResult(true); A.tokenEmail = (r.claims && r.claims.email) || '(sem e-mail no token)'; } } catch (e) { A.tokenEmail = '(não foi possível ler)'; }
    renderApp(); ouvir();
  });
})();
