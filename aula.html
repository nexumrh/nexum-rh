<style>
:root{--navy:#0b1f3a;--azul:#1f5eff;--lar:#f26a1b;--bg:#f4f6fa;--card:#fff;--tx:#14213a;--mut:#64748b;--line:#e3e8f0;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1324;--card:#121c33;--tx:#e8eefc;--mut:#94a3c0;--line:#22304d}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Onest,system-ui,sans-serif;line-height:1.45}
header{background:var(--navy);color:#fff;padding:16px}header .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:28px}header .sub{opacity:.75;font-size:14px;border-left:1px solid rgba(255,255,255,.3);padding-left:14px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--azul),var(--lar));transition:width .4s}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.pl video{width:100%;aspect-ratio:16/9;background:#0b1f3a;border-radius:12px;display:block}
.pl:fullscreen{background:#000;padding:12px}.pl:fullscreen video{height:calc(100vh - 80px);border-radius:0}
.ct{display:flex;gap:8px;align-items:center;margin-top:10px}.pb{flex:1;height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.pb s{position:absolute;inset:0 auto 0 0;width:0;background:rgba(31,94,255,.25)}.pb i{position:absolute;inset:0 auto 0 0;width:0;background:var(--azul);z-index:1}
button{font:inherit}.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--azul);color:#fff;font-weight:600;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:6px 10px;min-height:36px}
.btn:focus-visible,.ls button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.tm{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.ls{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:70vh;overflow:auto}
.ls button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.ls button[disabled]{cursor:not-allowed;opacity:.5}.ls .on button{border-color:var(--lar);background:rgba(242,106,27,.08)}
.ls .i{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--bg)}
.ls .ok .i{background:var(--ok);color:#fff}.ls .on .i{background:var(--lar);color:#fff}.ls b{font-size:14px;font-weight:600;display:block}.ls small{font-size:12px;color:var(--mut)}
.msg{margin:10px 0 0;font-size:14px;color:var(--mut)}.fim{text-align:center;padding:30px 18px}.fim b{font-size:22px;display:block;margin-bottom:6px}
.erro{text-align:center;padding:40px 18px}
.cont{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(31,94,255,.1);margin-top:10px}.cont span{flex:1;font-weight:600;min-width:140px}[hidden]{display:none!important}
.dv textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:transparent;color:inherit;resize:vertical}
.dvl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}.dvl li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}.dvl p{margin:4px 0}.resp{color:var(--ok)}
.btn.gh{background:transparent;color:var(--azul);padding:6px 4px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px}.q legend{font-weight:600;padding:0 6px}.q label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}.q.ok{border-color:var(--ok)}.q.bad{border-color:#c62d46}
</style>

    document.querySelectorAll('.q').forEach((f, n) => { const ok = resp[n] === 0, x = f.querySelector('.qx'); f.classList.add(ok ? 'ok' : 'bad'); x.hidden = false; x.textContent = (ok ? 'Certo. ' : `Resposta certa: ${Q[n][1][0]}. `) + Q[n][2]; f.querySelectorAll('input').forEach(i => i.disabled = true); });
    if (certas === Q.length) { salvar(true); $('#qok').textContent = 'Ver meu certificado'; $('#qok').onclick = () => fimTela(true); }
    else { salvar(true); $('#qok').textContent = 'Tentar de novo'; $('#qok').onclick = quizTela; }
  };
}
function certificado() {
  const ult = Object.values(P.feitas).sort().pop() || new Date().toISOString(), min = Math.max(1, Math.round(lista.reduce((t, a) => t + (a.dur || 0), 0) / 60)), h = Math.floor(min / 60), m = min % 60;
  const carga = h ? `${h} hora${h > 1 ? 's' : ''}${m ? ` e ${m} minutos` : ''}` : `${m} minutos`;
  const w = window.open('', '_blank'); if (!w) { alert('Libere as janelas do navegador para ver o certificado.'); return; }
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Certificado NEXUM</title><style>@page{size:A4 landscape;margin:0}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#0b1f3a}
    .c{width:297mm;height:210mm;box-sizing:border-box;padding:22mm 26mm;position:relative;border:10mm solid #0b1f3a;outline:2mm solid #f26a1b;outline-offset:-14mm}.t{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#f26a1b;font-weight:700}
    h1{font-size:46px;margin:6mm 0 4mm}.n{font-size:34px;font-weight:700;border-bottom:1px solid #c9d3e3;padding-bottom:3mm;margin:6mm 0}p{font-size:17px;line-height:1.55;margin:0 0 3mm}.r{position:absolute;left:26mm;right:26mm;bottom:22mm;display:flex;justify-content:space-between;font-size:13px;color:#4a5a75}</style></head>
    <body><div class="c"><div class="t">Certificado de conclusão</div><h1>Treinamento NEXUM</h1><p>Certificamos que</p><div class="n">${esc(L.nome || '')}</div>
    <p>${L.empresa ? `da empresa <b>${esc(L.empresa)}</b>, ` : ''}concluiu o treinamento em vídeo <b>${esc(MODS[L.mod][0])}</b>, assistindo todas as aulas até o fim e acertando o questionário final, com carga de <b>${carga}</b>.</p>
    <div class="r"><div><b style="font-size:22px">NEXUM</b><br>Sistema de RH e Ponto</div><div style="text-align:right">Concluído em ${new Date(ult).toLocaleDateString('pt-BR')}<br>Código de verificação: ${esc(tok.slice(0, 10).toUpperCase())}</div></div></div>
    <script>setTimeout(()=>print(),400)<\/script></body></html>`); w.document.close();
}
function fimTela(passou) {
  if (!passou && QUIZ[L.mod] && !(P.quiz && P.quiz.acertos === P.quiz.total)) return quizTela(); const qz = P.quiz && P.quiz.acertos === P.quiz.total;
  $('#app').innerHTML = `<div class="card fim"><b>Treinamento concluído!</b><p class="mut">Você assistiu todas as ${lista.length} aulas de ${esc(MODS[L.mod][0])}. Pode voltar a este link quando quiser rever alguma.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${qz || !QUIZ[L.mod] ? '<button class="btn" id="ct">Baixar meu certificado</button>' : ''}<button class="btn sec" id="rv">Rever as aulas</button></div></div>`; $('#rv').onclick = () => desenhar(lista[0].id); const c = $('#ct'); if (c) c.onclick = certificado; }
document.addEventListener('visibilitychange', () => { const v = $('#v'); if (document.hidden && v && !v.paused) v.pause(); });
window.addEventListener('pagehide', () => { try { salvar(true); } catch (e) { } });
init();
</script>
