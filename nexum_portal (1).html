<style>
:root{
  --ink:#0A1733;--ink2:#13244D;--ink3:#26406F;
  --bg:#F4F4F8;--card:#FFFFFF;--line:#E2E1EC;--line2:#EEEDF4;
  --txt:#1B1A2E;--mut:#696784;
  --pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;
  --r:12px;--rs:8px;
  --f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.hidden{display:none!important}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;background:var(--ink);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 0}
.login-top{max-width:420px;width:100%;margin:0 auto 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.02em}
.brand .marca{height:30px;width:auto;display:block}
.brand-sub{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:500;font-size:.9em;letter-spacing:.06em;color:rgba(255,255,255,.72);line-height:1.1}
.brand small{font-weight:500;opacity:.6;letter-spacing:0}
.login h1{font-size:30px;margin-top:34px;letter-spacing:-.03em}
.login p{opacity:.7;margin:8px 0 0}
.login-card{background:var(--card);color:var(--txt);border-radius:22px 22px 0 0;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));flex:1}
.login-card form{max-width:420px;margin:0 auto}

/* form */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:10px 12px;min-height:44px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}
textarea.inp{min-height:96px;resize:vertical}
.grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid .full{grid-column:1/-1}
.hint{font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:10px 18px;min-height:44px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--pri);padding:6px 10px;min-height:34px}
.btn.ghost:hover{background:var(--pri-s)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.check input{margin-top:3px;width:18px;height:18px;flex:none}

/* shell */
.app{display:grid;grid-template-columns:250px 1fr;height:100%}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto}
.side .brand{padding:4px 10px 20px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.66);padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.nav .lbl{flex:1}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#FF5C7A;color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.bdg:empty{display:none}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;flex:1}
.content{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px)}
.wrap{max-width:860px;margin:0 auto}
.bnav{display:none}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:12px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h2{margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.mut{background:var(--line2);color:var(--mut)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}
.list .t>div:first-child{font-weight:600}
.list .t>div+div{font-size:13.5px;color:var(--mut)}
.list li.link{cursor:pointer}
.empty{padding:26px 12px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--txt);margin-bottom:4px}
.res{border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.res>div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.res>div:last-child{border-bottom:0}
.res .h{background:#FAFAFC;font-weight:700;font-size:13px;color:var(--mut)}
.res .tot{background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFAFC;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:#FAFAFC;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--mut);margin-top:10px}

/* início */
.hello{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hello h2{font-size:22px;letter-spacing:-.02em}
.hello p{margin:4px 0 16px;opacity:.7}
.hello .btn{background:#fff;color:var(--ink)}
.hello .btn:hover{background:var(--pri-s)}
.hello .deco{position:absolute;right:-18px;top:-14px;width:150px;opacity:.22;pointer-events:none}
.alert{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--rs);background:var(--warn-s);color:#6B4608;margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left;font-weight:500}

/* ponto */
.clock{text-align:center;padding:26px 16px 22px}
.clock .hora{font-size:clamp(52px,14vw,76px);font-weight:700;letter-spacing:-.04em;line-height:1}
.clock .data{color:var(--mut);margin:6px 0 20px;text-transform:capitalize}
.clock .prox{font-size:14px;color:var(--mut);margin-bottom:12px}
.clock .btn{font-size:17px;min-height:56px;padding:0 34px;border-radius:99px}
.marcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.marc{border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px}

.cam{width:100%;aspect-ratio:3/4;max-height:52vh;background:#000;border-radius:var(--rs);object-fit:cover;transform:scaleX(-1)}
.sig{width:100%;height:190px;border:1.5px dashed var(--line);border-radius:var(--rs);background:#fff;touch-action:none;display:block}

/* bh */
.saldo{font-size:40px;font-weight:700;letter-spacing:-.03em}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:10px;background:var(--line2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar i.done{background:var(--ok)}
.escala{display:flex;gap:6px;flex-wrap:wrap}
.escala label{flex:1;min-width:44px}
.escala input{position:absolute;opacity:0}
.escala span{display:block;text-align:center;border:1px solid var(--line);border-radius:var(--rs);padding:9px 0;font-weight:700;cursor:pointer}
.escala input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.escala input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.msg.eu{align-self:flex-end;background:var(--pri);color:#fff;border-color:var(--pri)}
.msg small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}

.modal.sm{max-width:440px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}

.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--mut);padding:4px 8px;border-radius:6px}

@media (max-width:820px){

}
.bio-cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;width:min(100%,calc(58vh * .75));margin:0 auto}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<script>
/* =====================================================================
   NEXUM RH — Portal do Colaborador
   Lê e grava na mesma base do sistema do RH (nexum_rh.html).
   Hospede os dois arquivos na mesma origem (mesmo domínio/pasta).
   ===================================================================== */

const TAB_PADRAO = {
  ano: 2026, salMin: 1621.00,
  inss: [[1621.00, 0.075], [2902.84, 0.09], [4354.27, 0.12], [8475.55, 0.14]],
  irrf: [[2428.80, 0, 0], [2826.65, 0.075, 182.16], [3751.05, 0.15, 394.16], [4664.68, 0.225, 675.49], [1e12, 0.275, 908.73]],
  dep: 189.59, simplificado: 607.20, redutorIsencaoAte: 5000.00, redutorLimite: 7350.00, redutorA: 978.62, redutorB: 0.133145, fgts: 0.08
};
const ESCALA_PADRAO = [0, 480, 480, 480, 480, 480, 240];

/* =====================================================================
   FIREBASE — cole a configuração do seu projeto abaixo para ativar
   logins reais (Firebase Authentication) e banco na nuvem (Firestore).
   Com apiKey vazio o sistema roda em modo local (dados salvos só neste navegador).
   Use EXATAMENTE a mesma configuração no RH e no Portal.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDdcLJdO2qnmiGsR1EsKFu-uJfs4FRNvA4',
  authDomain: 'nexum-30044.firebaseapp.com',
  projectId: 'nexum-30044',
  storageBucket: 'nexum-30044.firebasestorage.app',
  messagingSenderId: '988792881104',
  appId: '1:988792881104:web:c0517c2b62b6e9f14603d5'
};
const FB_ON = !!FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined' && location.protocol !== 'file:';
const FB = {
  tid: null, cache: {}, unsubs: [], criando: false, aux: null, escopo: null,
  PROPRIOS: ['ponto', 'ferias', 'solic', 'docs', 'metas', 'chat', 'bh', 'assin', 'holerites', 'acessos', 'faces', 'bioFalhas'],
  LIVRES: ['avisos', 'pesq'],
  init() { if (!FB_ON) return; firebase.initializeApp(FIREBASE_CONFIG); FB.auth = firebase.auth(); FB.db = firebase.firestore(); FB.auth.languageCode = 'pt-BR'; },
  col(c) { return FB.db.collection('tenants').doc(FB.tid).collection(c); },
  /* Firestore não aceita lista dentro de lista: esses campos viajam como texto */
  _aa(v) { return Array.isArray(v) ? v.some(x => Array.isArray(x) || FB._aa(x)) : (v && typeof v === 'object') ? Object.values(v).some(FB._aa) : false; },
  _ts(v) { if (v && typeof v.toDate === 'function') return v.toDate().toISOString(); if (Array.isArray(v)) return v.map(FB._ts); if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = FB._ts(v[k]); return o; } return v; },
  _srv(v) { if (v === '__SRV__') return firebase.firestore.FieldValue.serverTimestamp(); if (Array.isArray(v)) return v; if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = FB._srv(v[k]); return o; } return v; },
  enc(x) { const o = {}; for (const k in x) { const v = x[k]; if (v === undefined) continue; o[k] = FB._aa(v) ? '\u0001J' + JSON.stringify(v) : v; } return FB._srv(JSON.parse(JSON.stringify(o))); },
  dec(x) { const o = {}; for (const k in x) { const v = x[k]; o[k] = typeof v === 'string' && v.startsWith('\u0001J') ? JSON.parse(v.slice(2)) : FB._ts(v); } return o; },
  _st(x) { return JSON.stringify(x, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, kk) => (a[kk] = v[kk], a), {}) : v); },
  /* abre a empresa: escuta as coleções em tempo real e guarda em cache */
  abrir(tid, cols, escopo) {
    FB.fechar(); FB.tid = tid; FB.cache = {}; FB.escopo = escopo || null;
    return Promise.all(cols.map(c => new Promise(res => {
      let primeiro = true;
      const trata = (dados, pend) => { FB.cache[c] = dados; if (primeiro) { primeiro = false; return res(); } if (!pend) FB.notificar(c); };
      const falha = e => { console.warn('[NEXUM]', c, e.code || e); if (primeiro) { FB.cache[c] = c === 'config' ? {} : []; primeiro = false; res(); } };
      let un;
      if (c === 'config') un = FB.db.doc(`tenants/${tid}/meta/config`).onSnapshot(s => trata(s.exists ? FB.dec(s.data()) : {}, s.metadata.hasPendingWrites), falha);
      else if (escopo && c === 'colab') un = FB.col('colab').doc(escopo.colabId).onSnapshot(s => trata(s.exists ? [FB.dec(s.data())] : [], s.metadata.hasPendingWrites), falha);
      else { let q = FB.col(c); if (escopo && FB.PROPRIOS.includes(c)) q = q.where('colabId', '==', escopo.colabId); un = q.onSnapshot(s => trata(s.docs.map(d => FB.dec(d.data())), s.metadata.hasPendingWrites), falha); }
      FB.unsubs.push(un);
    })));
  },
  fechar() { FB.unsubs.forEach(u => { try { u(); } catch (e) { } }); FB.unsubs = []; FB.tid = null; FB.cache = {}; },
  notificar(c) { window.dispatchEvent(new StorageEvent('storage', { key: `nexum:${FB.tid}:${c}` })); },
  get(c, def) { const v = FB.cache[c]; return v === undefined ? def : JSON.parse(JSON.stringify(v)); },
  /* grava só o que mudou (compara com o cache) */
  set(c, v) {
    const ant = FB.cache[c]; FB.cache[c] = JSON.parse(JSON.stringify(v));
    const desfaz = e => { FB.cache[c] = ant; FB.notificar(c); FB.falhou(e); };
    if (c === 'config') { FB.db.doc(`tenants/${FB.tid}/meta/config`).set(FB.enc(v)).catch(desfaz); return; }
    const antes = new Map((ant || []).map(x => [String(x.id), FB._st(x)])), ops = [];
    v.forEach(x => { if (!x || !x.id) return; const id = String(x.id); if (antes.get(id) !== FB._st(x)) ops.push(b => b.set(FB.col(c).doc(id), FB.enc(x))); antes.delete(id); });
    antes.forEach((_, id) => ops.push(b => b.delete(FB.col(c).doc(id))));
    (async () => { for (let i = 0; i < ops.length; i += 400) { const b = FB.db.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); } })().catch(desfaz);
  },
  /* cria login de outra pessoa sem derrubar a sessão de quem está logado */
  async criarLogin(email, senha) {
    if (!FB.aux) { FB.aux = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-aux').auth(); await FB.aux.setPersistence(firebase.auth.Auth.Persistence.NONE); }
    const cr = await FB.aux.createUserWithEmailAndPassword(email, senha); const id = cr.user.uid; await FB.aux.signOut(); return id;
  },
  tenant(s) { const x = s.data(); return { id: s.id, nome: x.nome, cnpj: x.cnpj || '', plano: x.plano, trial: !!x.trial, criadoEm: x.criadoEm, expira: iso(x.expiraTs.toDate()) }; },
  emailColab: (tid, cpf, v) => `c${cpf}.v${v}.${tid}@colab.nexum.app`,
  falhou(e) { console.error('[NEXUM]', e); toast(FB.erro(e), true); },
  erro(e) {
    const c = (e && e.code) || '';
    return ({
      'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/invalid-login-credentials': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'Senha incorreta.', 'auth/user-not-found': 'Usuário não encontrado.',
      'auth/email-already-in-use': 'Este e-mail já tem uma conta. Use outro ou recupere a senha.', 'auth/weak-password': 'Senha fraca: use ao menos 6 caracteres.', 'auth/invalid-email': 'E-mail inválido.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.', 'auth/network-request-failed': 'Sem conexão com a internet.', 'auth/requires-recent-login': 'Por segurança, saia e entre de novo antes de trocar a senha.',
      'auth/operation-not-allowed': 'Ative o login por e-mail/senha no Firebase (Authentication > Sign-in method).', 'auth/unauthorized-domain': 'Adicione este domínio em Authentication > Settings > Authorized domains.',
      'permission-denied': 'Sem permissão para esta ação. A licença pode estar expirada ou seu perfil não tem acesso.', 'unavailable': 'Sem conexão com o servidor. Tente de novo.'
    })[c] || ('Erro: ' + ((e && e.message) || c));
  }
};
FB.init();

const Store = {
  k: (t, c) => `nexum:${t}:${c}`,
  get(t, c, def) { if (FB_ON && FB.tid === t) return FB.get(c, def); try { const v = localStorage.getItem(this.k(t, c)); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(t, c, v) { if (FB_ON && FB.tid === t) { FB.set(c, v); return true; } try { localStorage.setItem(this.k(t, c), JSON.stringify(v)); return true; } catch (e) { toast('Não foi possível salvar. O armazenamento do aparelho está cheio.', true); return false; } },
  tenants() { try { return JSON.parse(localStorage.getItem('nexum:tenants')) || []; } catch (e) { return []; } }
};

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => { if (typeof v === 'number') return v; const s = String(v || '').trim().replace(/\s|R\$/g, ''); if (!s) return 0; return parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s) || 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pd = s => { if (!s) return null; const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fd = s => s ? pd(s).toLocaleDateString('pt-BR') : '—';
const fdt = s => s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
const diffD = (a, b) => Math.round((b - a) / 864e5);
const anosEntre = (a, b) => { let y = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--; return Math.max(0, y); };
const mesNome = c => { const [a, m] = c.split('-'); return new Date(+a, +m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); };
const hhmm = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const minutos = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const hm = min => { const a = Math.abs(Math.round(min)); return (min < 0 ? '−' : '') + Math.floor(a / 60) + 'h' + String(a % 60).padStart(2, '0'); };
const cpfFmt = v => v.replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
async function sha(txt) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

/* ---------- estado e dados ---------- */
const P = { t: null, c: null, cfg: {}, view: 'inicio' };
const G = col => Store.get(P.t.id, col, col === 'config' ? {} : []);
function mut(col, fn) { const d = G(col); const r = fn(d); Store.set(P.t.id, col, d); return r; }
const T = () => P.cfg.tabelas || TAB_PADRAO;
const me = () => P.c.id;

/* ---------- cálculos (mesmos do RH) ---------- */
function calcINSS(base) { let tot = 0, ant = 0; for (const [lim, al] of T().inss) { if (base > ant) tot += (Math.min(base, lim) - ant) * al; ant = lim; } return r2(tot); }
function calcIRRF(bruto, inss, dep) {
  const t = T(); const base = Math.max(0, bruto - Math.max(inss + (dep || 0) * t.dep, t.simplificado)); let imp = 0;
  for (const [lim, al, pdz] of t.irrf) { if (base <= lim) { imp = base * al - pdz; break; } }
  imp = Math.max(0, imp);
  if (bruto <= t.redutorIsencaoAte) imp = 0; else if (bruto <= t.redutorLimite) imp = Math.max(0, imp - (t.redutorA - t.redutorB * bruto));
  return r2(imp);
}
function folhaItem(i) { const bruto = r2(num(i.sal) + num(i.adic)); const inss = calcINSS(bruto); const irrf = calcIRRF(bruto, inss, i.dep); const desc = r2(inss + irrf + num(i.desc)); return { bruto, inss, irrf, desc, liq: r2(bruto - desc), fgts: r2(bruto * T().fgts) }; }
function calcFerias(c, dias, abono, adiant13) {
  const sal = num(c.salario), v = r2(sal / 30 * dias), terco = r2(v / 3), ab = abono ? r2(sal / 30 * 10) : 0, abT = abono ? r2(ab / 3) : 0, d13 = adiant13 ? r2(sal / 2) : 0;
  const inss = calcINSS(v + terco), irrf = calcIRRF(v + terco, inss, c.dependentes);
  return { v, terco, ab, abT, d13, inss, irrf, liq: r2(v + terco + ab + abT + d13 - inss - irrf) };
}
function statusFerias(c, ferias) {

/* ---------- pendências (badges) ---------- */
function pendencias() {
  const docs = G('docs').filter(d => d.colabId === me() && d.status === 'pendente');
  const assin = G('assin').filter(a => a.colabId === me());
  const hol = G('holerites').filter(h => h.colabId === me() && !assin.some(a => a.tipo === 'holerite' && a.ref === h.comp));
  const pesq = G('pesq').filter(p => p.ativa && !(p.responderam || []).includes(me()));
  const chat = G('chat').filter(m => m.colabId === me() && m.de === 'rh' && !m.lido);
  const avisos = G('avisos').filter(a => !(a.lidos || []).includes(me()));
  const compAnt = iso(addM(new Date(hoje().getFullYear(), hoje().getMonth(), 1), -1)).slice(0, 7);
  const temPontoAnt = G('ponto').some(p => p.colabId === me() && p.data.startsWith(compAnt));
  const espelho = temPontoAnt && !assin.some(a => a.tipo === 'espelho' && a.ref === compAnt) ? compAnt : null;
  return {
    docs: docs.filter(d => d.categoria !== 'contrato'), contratos: docs.filter(d => d.categoria === 'contrato'), hol, pesq, chat, avisos, espelho,
    badge: { inicio: avisos.length, docs: docs.filter(d => d.categoria !== 'contrato').length, contratos: docs.filter(d => d.categoria === 'contrato').length, holerites: hol.length, pesq: pesq.length, chat: chat.length, espelho: espelho ? 1 : 0 }
  };
}
function badges() {
  const b = pendencias().badge;
  $$('[data-bdg]').forEach(el => { const k = el.dataset.bdg; const n = k === 'mais' ? ['docs', 'contratos', 'espelho'].reduce((s, x) => s + (b[x] || 0), 0) : (b[k] || 0); el.textContent = n || ''; });
}

/* =====================================================================
   LOGIN
   ===================================================================== */
function renderLogin() {
  const lembr = JSON.parse(localStorage.getItem('nexum:plembrar') || '{}');
  $('#root').innerHTML = `<div class="login">
    <div class="login-top"><div class="brand"><img class="marca" src="${LOGO_MARCA}" alt="NEXUM"><span class="brand-sub">Portal do Colaborador</span></div>
      <h1>Olá! Bom te ver por aqui.</h1><p>Ponto, holerites, férias e documentos na palma da mão.</p></div>
    <div class="login-card"><form id="lg" novalidate>
      <div class="fld"><label for="lg-cod">Código da empresa</label><input class="inp" id="lg-cod" name="cod" value="${esc(lembr.cod || '')}" autocapitalize="off" autocomplete="organization"></div>
      <div class="fld"><label for="lg-cpf">CPF</label><input class="inp" id="lg-cpf" name="cpf" inputmode="numeric" value="${esc(lembr.cpf || '')}" autocomplete="username"></div>
      <div class="fld"><label for="lg-s">Senha</label><input class="inp" id="lg-s" name="senha" type="password" autocomplete="current-password"></div>
      <label class="check"><input type="checkbox" name="lembrar" ${lembr.cod ? 'checked' : ''}> Lembrar empresa e CPF neste aparelho</label>
      <button class="btn block" type="submit">Entrar</button>
      <p class="hint" style="text-align:center;margin-top:18px">Primeiro acesso ou esqueceu a senha? Peça ao RH para gerar uma nova.</p>
    </form></div></div>`;
  const cpf = $('#lg-cpf'); cpf.oninput = () => cpf.value = cpfFmt(cpf.value);
  $('#lg').onsubmit = async e => {
    e.preventDefault(); const d = formData(e.target);
    if (FB_ON) {
      const cod = d.cod.toLowerCase(), dig = d.cpf.replace(/\D/g, ''), b = e.target.querySelector('button[type=submit]');
      if (!cod || dig.length !== 11 || !d.senha) return toast('Preencha o código da empresa, o CPF e a senha.', true);
      b.disabled = true;
      try {
        const lg = await FB.db.doc(`logins/${await sha(`${cod}:${dig}`)}`).get();
        if (!lg.exists) { b.disabled = false; return toast('Este CPF não tem acesso liberado nesta empresa. Procure o RH.', true); }
        localStorage.setItem('nexum:plembrar', d.lembrar ? JSON.stringify({ cod: d.cod, cpf: d.cpf }) : '{}');
        await FB.auth.signInWithEmailAndPassword(FB.emailColab(cod, dig, lg.data().v), d.senha);
      } catch (err) { toast(err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials' ? 'CPF ou senha incorretos.' : FB.erro(err), true); }
      b.disabled = false; return;
    }
    const t = Store.tenants().find(x => x.id === d.cod.toLowerCase());
    if (!t) return toast('Código da empresa não encontrado.', true);
    if (diffD(hoje(), pd(t.expira)) < 0) return toast('Portal indisponível no momento. Procure o RH da empresa.', true);
    const dig = d.cpf.replace(/\D/g, '');
    const c = Store.get(t.id, 'colab', []).find(x => (x.cpf || '').replace(/\D/g, '') === dig);
    if (!c || !c.portal || !c.portal.ativo || c.status === 'desligado') return toast('Este CPF não tem acesso liberado. Procure o RH.', true);
    if (c.portal.hash !== await sha(`${t.id}:colab:${dig}:${d.senha}`)) return toast('CPF ou senha incorretos.', true);
    localStorage.setItem('nexum:plembrar', d.lembrar ? JSON.stringify({ cod: d.cod, cpf: d.cpf }) : '{}');
    entrar(t, c);
  };
}
function entrar(t, c) {
  P.t = t; P.c = c; P.cfg = G('config');
  sessionStorage.setItem('nexum:psess', JSON.stringify({ t: t.id, c: c.id }));
  let trocar;
  if (FB_ON) mut('acessos', l => { const a = l.find(y => y.colabId === c.id); if (a) { a.ultimoAcesso = new Date().toISOString(); trocar = a.trocar; } });
  else mut('colab', l => { const x = l.find(y => y.id === c.id); if (x) { x.portal.ultimoAcesso = new Date().toISOString(); P.c = x; trocar = x.portal.trocar; } });
  renderApp();
  if (trocar) trocarSenha(true);
}
function sair() { sessionStorage.removeItem('nexum:psess'); P.t = P.c = null; closeModal(true); if (FB_ON) { FB.fechar(); FB.auth.signOut(); } renderLogin(); }
async function fbEntrarPortal(user) {
  try {
    const m = await FB.db.doc(`users/${user.uid}`).get(), u = m.exists ? m.data() : null;
    if (!u || u.tipo !== 'colab' || u.ativo === false) { await FB.auth.signOut(); return toast('Este acesso não está ativo. Procure o RH.', true); }
    const t = FB.tenant(await FB.db.doc(`tenants/${u.tenantId}`).get());
    if (diffD(hoje(), pd(t.expira)) < 0) { await FB.auth.signOut(); return toast('Portal indisponível no momento. Procure o RH da empresa.', true); }
    await FB.abrir(t.id, ['colab', 'config', ...FB.LIVRES, ...FB.PROPRIOS], { colabId: u.colabId });
    const c = FB.get('colab', [])[0];
    if (!c || c.status === 'desligado' || !c.portal || !c.portal.ativo) { FB.fechar(); await FB.auth.signOut(); return toast('Seu acesso ao portal foi encerrado. Procure o RH.', true); }
    entrar(t, c);
  } catch (err) { FB.falhou(err); await FB.auth.signOut(); }
}
function trocarSenha(obrig) {
  modal(obrig ? 'Crie sua senha' : 'Trocar senha', `${obrig ? '<p class="hint" style="margin-top:0">Por segurança, troque a senha provisória enviada pelo RH.</p>' : `<div class="fld"><label for="ts-a">Senha atual</label><input class="inp" type="password" id="ts-a" autocomplete="current-password"></div>`}
    <div class="fld"><label for="ts-n">Nova senha</label><input class="inp" type="password" id="ts-n" autocomplete="new-password"><span class="hint">Mínimo de 6 caracteres.</span></div>
    <div class="fld"><label for="ts-c">Repita a nova senha</label><input class="inp" type="password" id="ts-c" autocomplete="new-password"></div>`, {
    size: 'sm', foot: `${obrig ? '' : '<button class="btn sec" data-close>Cancelar</button>'}<button class="btn" id="ts-ok">Salvar senha</button>`,
    onClose: obrig ? () => setTimeout(() => trocarSenha(true), 0) : null,
    onMount: m => $('#ts-ok', m).onclick = async () => {
      const dig = P.c.cpf.replace(/\D/g, ''), n = $('#ts-n', m).value;
      if (n.length < 6) return toast('A nova senha precisa ter ao menos 6 caracteres.', true);
      if (n !== $('#ts-c', m).value) return toast('As senhas não conferem.', true);
      if (FB_ON) {
        const u = FB.auth.currentUser;
        try {
          if (!obrig) await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, $('#ts-a', m).value));
          await u.updatePassword(n);
        } catch (err) { return toast(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' ? 'A senha atual está incorreta.' : FB.erro(err), true); }
        mut('acessos', l => { const a = l.find(y => y.colabId === me()); if (a) a.trocar = false; });
        closeModal(true); return toast('Senha salva.');
      }

async function registrarPonto() {
  const modo = (P.cfg.bio || {}).modo || 'foto', revisao = [];
  let foto = null, bio = null, tent = 0;
  if (modo === 'facial') {
    let face = G('faces').find(f => f.colabId === me());
    if (!face) { const c = await cadastrarRosto(true); if (c.res === 'cancel') return; if (c.foto) foto = c.foto; revisao.push('Biometria aguardando aprovação do RH'); }

        if (!r) return;
        if (r.erro === 'camera' || r.erro === 'modelo') {
          if (!await perguntarP(r.erro === 'camera' ? 'Não foi possível abrir a câmera para o reconhecimento facial. Registrar o ponto sem biometria? O RH vai revisar.' : 'O reconhecimento facial não carregou (verifique a internet). Registrar com foto simples para o RH revisar?', 'Registrar', 'Cancelar')) return;
          revisao.push(r.erro === 'camera' ? 'Câmera indisponível' : 'Reconhecimento facial não carregou'); break;
        }
        const dist = r.descs.length ? Math.min(...r.descs.map(d => BIO.melhor(d, face.descs))) : Infinity;

          if (!await perguntarP('Não conseguimos confirmar seu rosto em 3 tentativas. Registrar mesmo assim? A marcação vai para revisão do RH com a foto.', 'Registrar', 'Cancelar')) return;
          foto = r.foto; bio = { status: 'falhou', dist: isFinite(dist) ? +dist.toFixed(3) : null, vivo: !!r.vivo }; revisao.push('Biometria não confirmada após 3 tentativas'); break;
        }

      }
    }
  }
  if (!foto && !(modo === 'facial' && revisao.some(x => x.startsWith('Câmera')))) { const f = await capturarFoto(); if (f === undefined) return; foto = f; }
  if (!foto) revisao.push('Registrado sem foto');
  toast('Registrando…');
  const geo = await pegarGeo(), lojas = P.cfg.lojas || [];

    if (!geo) revisao.push('Localização não informada');

      const perto = lojas.map(l => ({ l, d: distM(geo, l) })).sort((a, b) => a.d - b.d)[0];
      cerca = { loja: perto.l.nome, dist: Math.round(perto.d), dentro: perto.d <= (perto.l.raio || 150) + Math.min(geo.acc || 0, 100) };

  const agora = new Date(), h = hhmm(agora), dia = iso(hoje());
  const ok = mut('ponto', arr => {

}

/* =====================================================================
   BIOMETRIA FACIAL — face-api.js (roda no aparelho, sem enviar vídeo)
   Reconhecimento: descritor facial de 128 pontos comparado ao cadastro.
   Prova de vida: detecção de piscada pela abertura dos olhos (EAR).

const BIO = {
  URL: 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/',
  LIM_OK: 0.48,   // distância até aqui = mesma pessoa
  LIM_DUV: 0.58,  // entre OK e DUV = registra e manda para revisão
  pronto: null,
  carregar() {
    if (BIO.pronto) return BIO.pronto;
    BIO.pronto = new Promise((res, rej) => {
      const go = async () => { try { const tf = faceapi.tf; let okGl = false; try { okGl = await tf.setBackend('webgl'); } catch (e) { } if (!okGl || tf.getBackend() !== 'webgl') await tf.setBackend('cpu'); await tf.ready(); const M = BIO.URL + 'model/'; await faceapi.nets.tinyFaceDetector.loadFromUri(M); await faceapi.nets.faceLandmark68Net.loadFromUri(M); await faceapi.nets.faceRecognitionNet.loadFromUri(M); res(); } catch (e) { BIO.pronto = null; rej(e); } };
      if (window.faceapi) return go();
      const s = document.createElement('script'); s.src = BIO.URL + 'dist/face-api.js'; s.onload = go;
      s.onerror = () => { BIO.pronto = null; rej(new Error('download')); }; document.head.appendChild(s);

  },
  det: null,
  carregarDetector() {

      if (!faceapi.nets.tinyFaceDetector.isLoaded) { const tf = faceapi.tf; let okGl = false; try { okGl = await tf.setBackend('webgl'); } catch (e) { } if (!okGl || tf.getBackend() !== 'webgl') await tf.setBackend('cpu'); await tf.ready(); await faceapi.nets.tinyFaceDetector.loadFromUri(BIO.URL + 'model/'); }

  detectar: v => faceapi.detectSingleFace(v, BIO.opts(224)),
  /* posição do rosto em relação ao oval (área visível 3:4 da câmera) */
  posicao(box, v) {
    const vw = v.videoWidth || 640, vh = v.videoHeight || 480; let sw = vw, sh = vh; if (vw / vh > 0.75) sw = vh * 0.75; else sh = vw / 0.75;
    const ox = (vw - sw) / 2, oy = (vh - sh) / 2, nx = (box.x + box.width / 2 - ox) / sw, ny = (box.y + box.height / 2 - oy) / sh, nw = box.width / sw;
    if (nw < 0.3) return 'longe'; if (nw > 0.9) return 'perto';

function assinar(titulo, texto) {
  return new Promise(res => {
    let done = false;
    modal(titulo, `<p class="hint" style="margin-top:0">${texto}</p><canvas class="sig" id="sig" aria-label="Área para assinatura"></canvas><div class="row" style="margin-top:6px"><span class="hint">Assine com o dedo ou o mouse.</span><span class="sp"></span><button class="btn ghost sm" id="sig-l">Limpar</button></div>`, {
      foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="sig-ok">Assinar</button>',
      onClose: () => { if (!done) res(null); },
      onMount: m => {
        const cv = $('#sig', m), ctx = cv.getContext('2d'); let des = false, vazio = true;
        const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2; ctx.scale(2, 2);
        ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0A1733';
        const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
        cv.onpointerdown = e => { des = true; vazio = false; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
        cv.onpointermove = e => { if (!des) return; ctx.lineTo(...pos(e)); ctx.stroke(); };
        cv.onpointerup = cv.onpointercancel = () => des = false;
        $('#sig-l', m).onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); vazio = true; };
        $('#sig-ok', m).onclick = () => { if (vazio) return toast('Desenhe sua assinatura no quadro.', true); done = true; const img = cv.toDataURL('image/png'); closeModal(true); res(img); };
      }
    });
  });
}

          toast('Registrando assinatura…');

function formSolic(el, tipo = 'ajuste_ponto') {

      <div class="fld full"><label for="sx-mot">Motivo</label><input class="inp" id="sx-mot" name="motivo" placeholder="Ex.: esqueci de marcar a saída"></div>`,
    segunda_via: `<div class="fld"><label for="sx-doc">Documento</label><select class="inp" id="sx-doc" name="doc">${opts(['Holerite', 'Recibo de férias', 'Contrato de trabalho', 'Informe de rendimentos', 'Outro'].map(x => [x, x]), 'Holerite')}</select></div>
      <div class="fld"><label for="sx-det">Mês ou detalhe</label><input class="inp" id="sx-det" name="detalhe"></div>`,
    declaracao: `<div class="fld full"><label for="sx-fin">Para que você precisa?</label><input class="inp" id="sx-fin" name="finalidade" placeholder="Ex.: comprovar vínculo para financiamento"></div>`,
    adiantamento: `<div class="fld"><label for="sx-val">Valor (R$)</label><input class="inp" id="sx-val" name="valor" inputmode="decimal"></div>

      <div class="fld full"><label for="sx-tx">Descreva</label><textarea class="inp" id="sx-tx" name="texto"></textarea></div>`
  };
  modal('Nova solicitação', `<div class="fld"><label for="sx-t">O que você precisa?</label><select class="inp" id="sx-t">${opts([['ajuste_ponto', 'Ajuste de ponto'], ['segunda_via', '2ª via de documento'], ['declaracao', 'Declaração de vínculo'], ['adiantamento', 'Adiantamento salarial'], ['outro', 'Outro assunto']], tipo)}</select></div>
    <p class="hint" style="margin-top:-4px">Férias, horas extras, atestados e mudança de dados têm telas próprias no menu.</p><div class="grid" id="sx-f">${campos[tipo]}</div>`, {
    foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="sx-ok">Enviar ao RH</button>',
    onMount: m => {
      $('#sx-t', m).onchange = e => formSolic(el, e.target.value);
      $('#sx-ok', m).onclick = () => {
        const d = formData($('#sx-f', m));
        if (tipo === 'ajuste_ponto') {
          d.marc = d.marc.split(/[,;\s]+/).filter(Boolean);
          if (!d.data || !d.marc.length || !d.motivo) return toast('Informe o dia, os horários e o motivo.', true);
          if (d.marc.some(x => !/^([01]\d|2[0-3]):[0-5]\d$/.test(x))) return toast('Use o formato HH:MM, por exemplo 08:05.', true);
          d.marc.sort();
        }
        if (tipo === 'adiantamento') { d.valor = num(d.valor); if (!d.valor) return toast('Informe o valor.', true); }
        if (tipo === 'outro' && !d.assunto) return toast('Informe o assunto.', true);
        novaSolic(tipo, d); closeModal(true); toast('Solicitação enviada ao RH.'); go('solic');
      };
    }
  });
}

/* ---------- Comprovantes ---------- */
function lerArquivo(file) {
  return new Promise((res, rej) => {
    if (file.type === 'application/pdf') {
      if (file.size > 500 * 1024) return rej('O PDF precisa ter até 500 KB. Tire uma foto do documento em vez disso.');
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej('Não foi possível ler o arquivo.'); r.readAsDataURL(file); return;
    }
    if (!file.type.startsWith('image/')) return rej('Envie uma foto (JPG, PNG) ou um PDF.');
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = img.width * s; cv.height = img.height * s; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.66)); };
    img.onerror = () => rej('Não foi possível abrir a imagem.'); img.src = url;
  });
}
function vComprov(el) {
  const l = G('solic').filter(s => s.colabId === me() && s.tipo === 'atestado').sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));

      <div class="fld"><label for="cp-d">Data do afastamento</label><input class="inp" type="date" id="cp-d" name="data" value="${iso(hoje())}"></div>
      <div class="fld"><label for="cp-n">Dias</label><input class="inp" type="number" min="0" max="365" id="cp-n" name="dias" value="1"></div>
      <div class="fld full"><label for="cp-o">Observação</label><input class="inp" id="cp-o" name="obs" placeholder="Ex.: consulta médica, declaração de comparecimento"></div>
      <div class="fld full"><label for="cp-a">Foto ou PDF do documento</label><input class="inp" type="file" id="cp-a" accept="image/*,application/pdf" capture="environment"></div></form>
      <div class="row end"><button class="btn" id="cp-ok">Enviar ao RH</button></div>
      <p class="note">Entregue o atestado em até 48 horas ou conforme a regra da empresa. A imagem é reduzida automaticamente antes do envio.</p></section>
    <section class="panel"><h2>Enviados</h2>${l.length ? `<ul class="list">${l.map(s => `<li><div class="t"><div>${fd(s.dados.data)} · ${s.dados.dias} dia(s)</div><div>${esc(s.dados.obs || 'Sem observação')}${s.resposta ? ' · RH: ' + esc(s.resposta) : ''}</div></div>${stPill(s.status)}</li>`).join('')}</ul>` : '<div class="empty">Nenhum comprovante enviado.</div>'}</section>`;
  $('#cp-ok', el).onclick = async () => {
    const d = formData($('#cp-f', el)), f = $('#cp-a', el).files[0];
    if (!f) return toast('Anexe a foto ou o PDF do documento.', true);
    try { d.anexo = { nome: f.name, tipo: f.type.startsWith('image/') ? 'image/jpeg' : f.type, data: await lerArquivo(f) }; } catch (e) { return toast(e, true); }
    d.dias = parseInt(d.dias) || 0; novaSolic('atestado', d); toast('Comprovante enviado ao RH.'); vComprov(el);
  };
}

/* ---------- Pesquisa de clima ---------- */
function vPesq(el) {
  const l = G('pesq').filter(p => p.ativa);
  el.innerHTML = l.length ? l.map(p => (p.responderam || []).includes(me())
    ? `<section class="panel"><div class="panel-head"><h2>${esc(p.titulo)}</h2><span class="pill ok">Respondida</span></div><p class="hint" style="margin:0">Obrigado por participar. Suas respostas são anônimas.</p></section>`
    : `<section class="panel" data-p="${p.id}"><h2>${esc(p.titulo)}</h2><p class="hint" style="margin-top:-6px">Respostas anônimas: o RH vê apenas médias e comentários, sem o seu nome. 1 = discordo totalmente, 5 = concordo totalmente.</p>
      ${p.perguntas.map((q, i) => `<fieldset style="border:0;padding:0;margin:0 0 16px"><legend style="font-weight:600;margin-bottom:8px">${esc(q)}</legend><div class="escala">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="q${i}" value="${n}"><span>${n}</span></label>`).join('')}</div></fieldset>`).join('')}
      <div class="fld"><label for="pq-c-${p.id}">Comentário (opcional)</label><textarea class="inp" id="pq-c-${p.id}"></textarea></div>
      <div class="row end"><button class="btn" data-env="${p.id}">Enviar respostas</button></div></section>`).join('')
    : '<div class="panel empty"><b>Nenhuma pesquisa aberta</b>Quando o RH abrir uma pesquisa de clima, ela aparece aqui.</div>';
  $$('[data-env]', el).forEach(b => b.onclick = () => {
    const sec = $(`[data-p="${b.dataset.env}"]`, el), p = l.find(x => x.id === b.dataset.env);
    const notas = p.perguntas.map((_, i) => { const r = $(`input[name="q${i}"]:checked`, sec); return r ? +r.value : null; });
    if (notas.includes(null)) return toast('Responda todas as perguntas.', true);
    const coment = $(`#pq-c-${p.id}`, sec).value.trim();
    mut('pesq', arr => { const x = arr.find(y => y.id === p.id); x.respostas = x.respostas || []; x.respostas.splice(Math.floor(Math.random() * (x.respostas.length + 1)), 0, { notas, comentario: coment }); x.responderam = [...(x.responderam || []), me()]; });
    toast('Obrigado! Respostas enviadas.'); vPesq(el); badges();
  });
}

/* ---------- Chat ---------- */
function vChat(el) {
  el.innerHTML = `<div class="chat"><div class="msgs" id="ch-m" aria-live="polite"></div><div class="chat-in"><textarea class="inp" id="ch-t" placeholder="Escreva para o RH" aria-label="Mensagem"></textarea><button class="btn" id="ch-e">Enviar</button></div></div>`;
  renderThread();
  const enviar = () => { const t = $('#ch-t'); const v = t.value.trim(); if (!v) return; mut('chat', l => l.push({ id: uid(), colabId: me(), de: 'colab', texto: v.slice(0, 2000), em: new Date().toISOString(), lido: false })); t.value = ''; renderThread(); t.focus(); };
  $('#ch-e', el).onclick = enviar;
  $('#ch-t', el).onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } };
}
function renderThread() {
  const box = $('#ch-m'); if (!box) return;
  const l = G('chat').filter(m => m.colabId === me()).sort((a, b) => a.em.localeCompare(b.em));
  box.innerHTML = l.length ? l.map(m => `<div class="msg ${m.de === 'colab' ? 'eu' : ''}">${esc(m.texto)}<small>${m.de === 'rh' ? esc(m.por || 'RH') + ' · ' : ''}${fdt(m.em)}</small></div>`).join('')
    : '<div class="empty" style="margin:auto"><b>Fale com o RH</b>Tire dúvidas sobre holerite, ponto, férias ou benefícios.</div>';
  box.scrollTop = box.scrollHeight;
  if (l.some(m => m.de === 'rh' && !m.lido)) { mut('chat', arr => arr.forEach(m => { if (m.colabId === me() && m.de === 'rh') m.lido = true; })); badges(); }
}

    { size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="pa-ok">Enviar ao RH</button>', onMount: m => $('#pa-ok', m).onclick = () => {

    } });
}

/* ---------- sincronização com o RH (outras abas) ---------- */
window.addEventListener('storage', e => {
  if (!P.t || !e.key || !e.key.startsWith(`nexum:${P.t.id}:`)) return;
  const col = e.key.split(':')[2];
  if (col === 'colab') { const c = G('colab').find(x => x.id === me()); if (!c || !c.portal || !c.portal.ativo || c.status === 'desligado') { sair(); return toast('Seu acesso ao portal foi encerrado. Procure o RH.', true); } P.c = c; }
  if (col === 'config') P.cfg = G('config');
  badges();
  if (P.view === 'chat' && col === 'chat') return renderThread();
  if ($('#modal-root').innerHTML) return;
  const a = document.activeElement; if (a && a.matches('input,textarea,select')) return;
  go(P.view);
});

(function init() {
  if (FB_ON) { renderLogin(); FB.auth.onAuthStateChanged(u => { if (u && !P.c) fbEntrarPortal(u); else if (!u && P.c) { P.t = P.c = null; FB.fechar(); renderLogin(); } }); return; }
  try {
    const s = JSON.parse(sessionStorage.getItem('nexum:psess') || 'null');
    if (s) { const t = Store.tenants().find(x => x.id === s.t); const c = t && Store.get(t.id, 'colab', []).find(x => x.id === s.c && x.portal && x.portal.ativo && x.status !== 'desligado'); if (c) return entrar(t, c); }
  } catch (e) { }
  renderLogin();
})();
/* aviso quando o Firebase não pode funcionar */
(function avisoFirebase() {
  let msg = '';
  if (FIREBASE_CONFIG.apiKey && location.protocol === 'file:') msg = 'Você abriu o arquivo direto do computador. O Firebase só funciona com o sistema hospedado (ex.: GitHub Pages). Aqui ele roda em modo local, com dados só neste navegador.';
  else if (FIREBASE_CONFIG.apiKey && typeof firebase === 'undefined') msg = 'Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.';
  if (!msg) return;
  const el = document.createElement('div'); el.setAttribute('role', 'alert');
  el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:90;background:#B42318;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 44px 10px 16px;text-align:center';
  el.innerHTML = msg + '<button aria-label="Fechar aviso" style="position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer">×</button>';
  el.querySelector('button').onclick = () => el.remove(); document.body.appendChild(el);
})();
