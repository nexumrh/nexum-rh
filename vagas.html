<style>
:root{--pri:#1A5CFF;--ink:#0A1733;--txt:#17213A;--mut:#5B6782;--line:#E3E8F2;--bg:#F4F6FB;--ok:#14935B;--bad:#C93838}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
header{background:var(--ink);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 34px}
.wrap{max-width:760px;margin:0 auto}
header img{max-height:56px;max-width:200px;background:#fff;border-radius:10px;padding:6px;margin-bottom:14px}
header h1{margin:0 0 6px;font-size:clamp(26px,6vw,36px);letter-spacing:-.01em}header p{margin:0;opacity:.8}
main{padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.vaga{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.vaga h2{margin:0 0 4px;font-size:19px}.meta{color:var(--mut);font-size:14px}.vaga p{white-space:pre-line;margin:10px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--pri)}.btn:focus-visible,.inp:focus-visible{outline:3px solid #9DBBFF;outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}label{font-weight:600;font-size:14px}
.inp{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);min-height:44px;width:100%}
textarea.inp{min-height:110px;resize:vertical}.hint{color:var(--mut);font-size:13px}
.ok{background:#E8F6EF;border:1px solid #BFE7D2;color:#0E6B42;border-radius:12px;padding:20px}.erro{color:var(--bad);font-weight:600}
.vazio{text-align:center;color:var(--mut);padding:40px 10px}.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding-bottom:24px}
</style>
</head>
<body>
<header><div class="wrap" id="topo"><h1>Trabalhe conosco</h1><p>Carregando vagas…</p></div></header>
<main><div class="wrap" id="app"></div></main>
<footer>Vagas publicadas com NEXUM RH</footer>
<script>
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDdcLJdO2qnmiGsR1EsKFu-uJfs4FRNvA4',
  authDomain: 'nexum-30044.firebaseapp.com',
  projectId: 'nexum-30044',
  storageBucket: 'nexum-30044.firebasestorage.app',
  messagingSenderId: '988792881104',
  appId: '1:988792881104:web:c0517c2b62b6e9f14603d5'
};
const FB_ON = !!FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined' && location.protocol !== 'file:';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TID = (new URLSearchParams(location.search).get('empresa') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
let db = null; if (FB_ON) db = firebase.initializeApp(FIREBASE_CONFIG, 'nexum-vagas').firestore();
async function carregarVagas() {
  if (!TID) return [];
  if (db) { const s = await db.collection(`tenants/${TID}/vagas`).where('publica', '==', true).where('status', '==', 'aberta').get(); return s.docs.map(d => d.data()); }
  try { return (JSON.parse(localStorage.getItem(`nexum:${TID}:vagas`)) || []).filter(v => v.publica && v.status === 'aberta'); } catch (e) { return []; }
}
async function enviar(c) {
  if (db) return db.doc(`tenants/${TID}/cands/${c.id}`).set(c);
  const k = `nexum:${TID}:cands`, l = JSON.parse(localStorage.getItem(k) || '[]'); l.push(c); localStorage.setItem(k, JSON.stringify(l));
}
const lerArquivo = f => new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = err; r.readAsDataURL(f); });
function topo(v) {
  const e = v[0] || {}; document.title = e.empresa ? `Trabalhe na ${e.empresa}` : 'Trabalhe conosco';
  $('#topo').innerHTML = `${e.logo ? `<img src="${e.logo}" alt="${esc(e.empresa)}">` : ''}<h1>${e.empresa ? `Trabalhe na ${esc(e.empresa)}` : 'Trabalhe conosco'}</h1><p>${v.length ? `${v.length} vaga${v.length > 1 ? 's abertas' : ' aberta'}${e.cidade ? ' · ' + esc(e.cidade) : ''}` : 'Nenhuma vaga aberta no momento'}</p>`;
}
function lista(v) {
  topo(v);
  $('#app').innerHTML = v.length ? v.map(x => `<article class="vaga"><h2>${esc(x.titulo)}</h2><div class="meta">${esc(x.depto || '')}${x.salario ? `${x.depto ? ' · ' : ''}${brl(x.salario)}` : ''}</div>${x.desc ? `<p>${esc(x.desc)}</p>` : ''}<div style="margin-top:14px"><button class="btn" data-v="${esc(x.id)}">Quero me candidatar</button></div></article>`).join('')
    : `<div class="vazio">${TID ? 'No momento não há vagas abertas. Volte em breve!' : 'Link incompleto: peça à empresa o endereço correto da página de vagas.'}</div>`;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => form(v.find(x => x.id === b.dataset.v), v));
}
function form(vaga, todas) {
  window.scrollTo(0, 0);
  $('#app').innerHTML = `<button class="btn sec" id="volta" style="margin-bottom:14px">← Ver todas as vagas</button>
    <article class="vaga"><h2>Candidatura: ${esc(vaga.titulo)}</h2><div class="meta">${esc(vaga.depto || '')}</div></article>
    <form class="vaga" id="f" novalidate>
      <div class="fld"><label for="n">Nome completo *</label><input class="inp" id="n" autocomplete="name" required maxlength="110"></div>
      <div class="fld"><label for="t">WhatsApp *</label><input class="inp" id="t" type="tel" inputmode="tel" autocomplete="tel" placeholder="(45) 99999-9999" required></div>
      <div class="fld"><label for="e">E-mail</label><input class="inp" id="e" type="email" autocomplete="email"></div>
      <div class="fld"><label for="c">Cidade e bairro</label><input class="inp" id="c" autocomplete="address-level2"></div>
      <div class="fld"><label for="x">Conte sua experiência</label><textarea class="inp" id="x" maxlength="2500" placeholder="Onde trabalhou, quanto tempo, o que fazia, disponibilidade de horário…"></textarea></div>
      <div class="fld"><label for="a">Currículo (PDF ou foto, até 500 KB)</label><input class="inp" id="a" type="file" accept="application/pdf,image/jpeg,image/png"><span class="hint">Opcional, mas ajuda muito na seleção.</span></div>
      <label class="check" style="margin-bottom:16px"><input type="checkbox" id="l"> <span>Autorizo o uso dos meus dados para este processo seletivo, conforme a LGPD. Eles ficam só com a empresa e podem ser excluídos a meu pedido.</span></label>
      <p class="erro" id="er" role="alert"></p>
      <button class="btn" type="submit" id="ok" style="width:100%">Enviar candidatura</button></form>`;
  $('#volta').onclick = () => lista(todas);
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); const er = $('#er'), b = $('#ok'); er.textContent = '';
    const nome = $('#n').value.trim().replace(/\s+/g, ' '), tel = $('#t').value.replace(/\D/g, '');
    if (nome.split(' ').length < 2) return er.textContent = 'Informe seu nome completo.';
    if (tel.length < 10) return er.textContent = 'Informe um WhatsApp com DDD.';
    if (!$('#l').checked) return er.textContent = 'É preciso autorizar o uso dos dados para se candidatar.';
    let curriculo = null; const f = $('#a').files[0];
    if (f) { if (f.size > 512000) return er.textContent = 'O currículo passa de 500 KB. Envie uma foto ou um PDF menor.'; curriculo = { nome: f.name.slice(0, 80), tipo: f.type, data: await lerArquivo(f) }; }
    b.disabled = true; b.textContent = 'Enviando…';
    const tf = tel.length === 11 ? `(${tel.slice(0, 2)}) ${tel.slice(2, 7)}-${tel.slice(7)}` : `(${tel.slice(0, 2)}) ${tel.slice(2, 6)}-${tel.slice(6)}`;
    try {
      await enviar({ id: 'w' + uid(), vagaId: vaga.id, nome, telefone: tf, email: $('#e').value.trim().slice(0, 120), cidade: $('#c').value.trim().slice(0, 120), notas: $('#x').value.trim().slice(0, 2500), origem: 'Site de vagas', etapa: 'triagem', criado: new Date().toISOString().slice(0, 10), curriculo, lgpd: true });
      $('#app').innerHTML = `<div class="ok"><h2 style="margin-top:0">Candidatura enviada!</h2><p>Obrigado, ${esc(nome.split(' ')[0])}. A ${esc(vaga.empresa || 'empresa')} vai analisar seu perfil e, se avançar, entra em contato pelo WhatsApp.</p><button class="btn sec" id="volta2">Ver outras vagas</button></div>`;
      $('#volta2').onclick = () => lista(todas);
    } catch (e) { b.disabled = false; b.textContent = 'Enviar candidatura'; er.textContent = 'Não foi possível enviar agora. Verifique a internet e tente de novo.'; }
  };
}
carregarVagas().then(lista).catch(() => { topo([]); $('#app').innerHTML = '<div class="vazio">Não foi possível carregar as vagas. Verifique a internet e recarregue a página.</div>'; });
</script>
</body>
</html>
