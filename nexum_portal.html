<style>
:root{
  --ink:#0A1733;--ink2:#13244D;--ink3:#26406F;
  --bg:#F4F4F8;--card:#FFFFFF;--line:#E2E1EC;--line2:#EEEDF4;
  --txt:#1B1A2E;--mut:#696784;
  --pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;
  --r:12px;--rs:8px;
  --f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
#root{height:100%;min-height:100vh;min-height:100dvh}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.hidden{display:none!important}

/* login */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 0}
.login-top{max-width:420px;width:100%;margin:0 auto 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.02em}
.brand .marca{height:30px;width:auto;display:block}
.brand-sub{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:500;font-size:.9em;letter-spacing:.06em;color:rgba(255,255,255,.72);line-height:1.1}
.brand small{font-weight:500;opacity:.6;letter-spacing:0}
.login h1{font-size:30px;margin-top:34px;letter-spacing:-.03em}
.login p{opacity:.7;margin:8px 0 0}
.login-card{background:var(--card);color:var(--txt);border-radius:22px 22px 0 0;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));flex:1}
.login-card form{max-width:420px;margin:0 auto}

/* form */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:10px 12px;min-height:44px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}
textarea.inp{min-height:96px;resize:vertical}
.grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid .full{grid-column:1/-1}
.hint{font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:10px 18px;min-height:44px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--pri);padding:6px 10px;min-height:34px}
.btn.ghost:hover{background:var(--pri-s)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.check input{margin-top:3px;width:18px;height:18px;flex:none}

/* shell */
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto}
.side .brand{padding:4px 10px 20px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.66);padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.nav .lbl{flex:1}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#FF5C7A;color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.bdg:empty{display:none}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;flex:1}
.content{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px);position:relative}
.wrap{max-width:860px;margin:0 auto}
.bnav{display:none}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:12px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h2{margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.mut{background:var(--line2);color:var(--mut)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}
.list .t>div:first-child{font-weight:600}
.list .t>div+div{font-size:13.5px;color:var(--mut)}
.list li.link{cursor:pointer}
.empty{padding:26px 12px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--txt);margin-bottom:4px}
.res{border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.res>div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.res>div:last-child{border-bottom:0}
.res .h{background:#FAFAFC;font-weight:700;font-size:13px;color:var(--mut)}
.res .tot{background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFAFC;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:#FAFAFC;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--mut);margin-top:10px}

/* início */
.hello{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hello h2{font-size:22px;letter-spacing:-.02em}
.hello p{margin:4px 0 16px;opacity:.7}
.hello .btn{background:#fff;color:var(--ink)}
.hello .btn:hover{background:var(--pri-s)}
.hello .deco{position:absolute;right:-18px;top:-14px;width:150px;opacity:.22;pointer-events:none}
.alert{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--rs);background:var(--warn-s);color:#6B4608;margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left;font-weight:500}
.alert:hover{filter:brightness(.98)}
.alert b{font-weight:700}
.alert.pri{background:var(--pri-s);color:var(--pri-d)}

/* ponto */
.clock{text-align:center;padding:26px 16px 22px}
.clock .hora{font-size:clamp(52px,14vw,76px);font-weight:700;letter-spacing:-.04em;line-height:1}
.clock .data{color:var(--mut);margin:6px 0 20px;text-transform:capitalize}
.clock .prox{font-size:14px;color:var(--mut);margin-bottom:12px}
.clock .btn{font-size:17px;min-height:56px;padding:0 34px;border-radius:99px}
.marcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.marc{border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px}
.marc b{font-size:22px;display:block;letter-spacing:-.02em}
.marc span{font-size:13px;color:var(--mut)}
.marc.vazia{border-style:dashed;color:var(--mut)}
.cam{width:100%;aspect-ratio:3/4;max-height:52vh;background:#000;border-radius:var(--rs);object-fit:cover;transform:scaleX(-1)}
.sig{width:100%;height:190px;border:1.5px dashed var(--line);border-radius:var(--rs);background:#fff;touch-action:none;display:block}

/* bh */
.saldo{font-size:40px;font-weight:700;letter-spacing:-.03em}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:10px;background:var(--line2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar i.done{background:var(--ok)}
.escala{display:flex;gap:6px;flex-wrap:wrap}
.escala label{flex:1;min-width:44px;position:relative}
.escala input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.escala span{display:block;text-align:center;border:1px solid var(--line);border-radius:var(--rs);padding:9px 0;font-weight:700;cursor:pointer}
.escala input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.escala input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#FAFAFC}
.msg{max-width:80%;padding:9px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.msg.eu{align-self:flex-end;background:var(--pri);color:#fff;border-color:var(--pri)}
.msg small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-in textarea{min-height:44px;height:44px;resize:none}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(10,23,51,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto;z-index:50}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(10,23,51,.3);animation:pop .16s ease-out}
.modal.sm{max-width:440px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px;flex:1}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--mut);padding:4px 8px;border-radius:6px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--rs);font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(10,23,51,.3)}
.toast.bad{background:var(--bad)}
.doc-prev{border:1px solid var(--line);border-radius:var(--rs);padding:22px;max-height:58vh;overflow:auto;font-family:Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.7}
.doc-prev h2{text-align:center;font-size:17px;margin-bottom:16px;font-family:var(--f)}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:14px 6px;cursor:pointer;font-size:12.5px;font-weight:600;position:relative;text-align:center}
.sheet-grid svg{width:22px;height:22px;color:var(--pri)}
.sheet-grid .bdg{position:absolute;top:6px;right:6px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .content{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:600;padding:6px 0;cursor:pointer;position:relative}
  .bnav button.on{color:var(--pri)}
  .bnav svg{width:23px;height:23px}
  .bnav .bdg{position:absolute;top:0;left:calc(50% + 6px)}
  .chat{height:calc(100vh - 230px)}
}

.lc-top p{margin:0;color:rgba(255,255,255,.82);font-size:16px}
.lc-card{background:linear-gradient(165deg,#FFFFFF 0%,#F3F6FC 100%);color:#0E1A4A;border-radius:22px;padding:30px 26px 24px;box-shadow:0 34px 80px rgba(0,8,40,.5);animation:lxsobe .7s .1s ease-out both}
.lc-fld{margin-bottom:16px}.lc-fld>label{display:block;font-size:14px;font-weight:600;color:#2D3A64;margin-bottom:6px}
.lc-fld .lx-in{margin:0}.lc-fld .lx-in .inp{height:54px}
.lc-card .check{color:#3C4566;font-size:14.5px;margin:2px 0 18px;display:flex;gap:8px;align-items:center}
.lc-links{text-align:center;margin:18px 0 0;font-size:14.5px;color:#4A5578}.lc-links a{color:#1F5FE8;font-weight:700}
.lc-rod{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #DCE2EF;margin-top:20px;padding-top:16px;color:#4A5578;font-size:12.5px;line-height:1.45}
.lc-rod svg{flex:0 0 22px;width:22px;height:22px;color:#2D3A64}.lc-rod a{color:#4A5578}
.lc-top .lc-anim{opacity:0;animation:lxsobe .6s ease-out forwards}.lc-top .lc-anim:nth-child(2){animation-delay:.06s}.lc-top .lc-anim:nth-child(3){animation-delay:.12s}.lc-top .lc-anim:nth-child(4){animation-delay:.18s}
@media (max-width:560px){.lc{align-items:stretch}.lc-col{padding:0;display:flex;flex-direction:column}.lc-top{padding:44px 22px 26px;margin:0}.lc-top h1{font-size:26px;margin-top:22px}.lc-top .lx-marca{--s:.62}.lc-card{flex:1;border-radius:24px 24px 0 0;padding:28px 22px calc(24px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.lc *{animation:none!important}.lc-top .lc-anim{opacity:1}}
/* ===== Telas de entrada em pôster (Portal do RH e Portal do Colaborador) ===== */
.pz{min-height:100vh;min-height:100dvh;background:#030C26;position:relative;overflow:hidden;display:flex;justify-content:center;font-family:var(--f);color:#fff}
.pz-faixas{position:absolute;inset:0;pointer-events:none}
.pz-faixas i{position:absolute;background:linear-gradient(135deg,#1E6BFF,#0A2E8C);opacity:.9}
.pz-faixas .a{left:-12%;top:-8%;width:46%;height:30%;clip-path:polygon(0 0,100% 0,0 100%);opacity:.55;animation:pzf 14s ease-in-out infinite alternate}
.pz-faixas .b{right:-8%;bottom:-6%;width:40%;height:34%;clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.6;animation:pzf 17s ease-in-out infinite alternate-reverse}
.pz-faixas .c{right:6%;top:-10%;width:3px;height:70%;background:linear-gradient(transparent,#4FA3FF,transparent);transform:rotate(36deg);opacity:.7;animation:pzl 9s ease-in-out infinite}
.pz-faixas .d{left:4%;bottom:-12%;width:3px;height:70%;background:linear-gradient(transparent,#4FA3FF,transparent);transform:rotate(36deg);opacity:.6;animation:pzl 11s 2s ease-in-out infinite}
@keyframes pzf{to{transform:translate(18px,14px) scale(1.04)}}@keyframes pzl{0%,100%{opacity:.15;translate:0 0}50%{opacity:.8;translate:-30px 40px}}
.pz-col{position:relative;z-index:1;width:100%;max-width:540px;padding:56px 28px 24px;display:flex;flex-direction:column}
.pz-logo{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pz-logo .lx-marca{--s:.82}.pz-logo .lx-marca .lb,.pz-logo .lx-marca .lr{display:none}
.pz-logo small{font-size:11.5px;letter-spacing:.42em;color:rgba(255,255,255,.85);font-weight:600;white-space:nowrap;margin-top:4px}
.pz-tit{font-size:clamp(28px,6.5vw,38px);font-weight:500;line-height:1.12;margin:30px 0 0;letter-spacing:-.015em;color:#fff}
.pz-tit b{display:block;font-weight:800;color:#3B9BFF}
.pz-traco{display:block;width:40px;height:3px;background:#3B9BFF;border-radius:2px;margin:14px 0 12px}
.pz-txt{color:rgba(255,255,255,.85);font-size:15.5px;max-width:34ch;margin:0 0 24px;line-height:1.5}
.pz-card{background:linear-gradient(165deg,#FFFFFF,#F2F5FC);color:#0E1A4A;border-radius:20px;padding:26px 24px 22px;box-shadow:0 30px 70px rgba(0,8,40,.55);animation:lxsobe .7s .1s ease-out both}
.pz-cab{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.pz-cab .ic{flex:0 0 46px;height:46px;border-radius:12px;background:#EAF1FF;color:#1F5FE8;display:flex;align-items:center;justify-content:center}.pz-cab .ic svg{width:26px;height:26px}
.pz-cab small{display:block;font-size:10.5px;letter-spacing:.24em;color:#1F5FE8;font-weight:700}
.pz-cab h2{font-size:22px;font-weight:800;margin:2px 0 2px;color:#0E1A4A;letter-spacing:-.01em}.pz-cab p{margin:0;color:#4A5578;font-size:13.5px}
.pz-card .lx-in{margin-bottom:12px}.pz-card .lx-in .inp{height:52px;font-size:15.5px}
.pz-card .check{color:#3C4566;font-size:14px;margin:2px 0 14px;display:flex;gap:8px;align-items:center}
.pz-card .lx-ent{height:52px;font-size:17px}
.pz-lk{text-align:center;margin:16px 0 0;font-size:14.5px;color:#4A5578}.pz-lk a,.pz-lk button{color:#1F5FE8;font-weight:700;text-decoration:underline;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.pz-feat{display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0 0}
.pz-feat div{text-align:center;padding:4px 8px;opacity:0;animation:lxsobe .6s ease-out forwards}
.pz-feat div+div{border-left:1px solid rgba(90,162,255,.35)}
.pz-feat div:nth-child(2){animation-delay:.08s}.pz-feat div:nth-child(3){animation-delay:.16s}.pz-feat div:nth-child(4){animation-delay:.24s}
.pz-feat svg{width:26px;height:26px;color:#5AA2FF}.pz-feat b{display:block;font-size:13px;margin:6px 0 2px}.pz-feat span{display:block;font-size:11.5px;color:rgba(255,255,255,.72);line-height:1.3}
.pz-rod{display:flex;align-items:center;justify-content:center;gap:16px;margin:26px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
.pz-rod .lx-marca{--s:.38}.pz-rod .lx-marca .lb,.pz-rod .lx-marca .lr,.pz-rod .lx-orb{display:none}
.pz-rod small{font-size:9.5px;letter-spacing:.2em;color:rgba(255,255,255,.7);white-space:nowrap}
.pz-leg{text-align:center;font-size:11.5px;color:rgba(255,255,255,.55);margin:12px 0 0}.pz-leg a{color:rgba(255,255,255,.7)}
.pz-card .fld label{color:#2D3A64;font-weight:600;font-size:13.5px}.pz-card .fld .inp{height:48px;border-radius:10px;border:1.5px solid #D3DAEA;background:#fff;color:#0E1A4A}
.pz-card .btn.block{height:52px;border:0;border-radius:10px;background:linear-gradient(90deg,#1F5FE8,#2B7BFF);color:#fff;font-size:17px;font-weight:700}
.pz-card #auth-body h2{display:none}.pz-card #auth-body>p.hint{color:#3B5BA8;margin-top:0}
@media (max-width:420px){.pz-col{padding:50px 18px 18px}.pz-rod{gap:10px}.pz-rod small{font-size:8.5px;letter-spacing:.14em}.pz-logo small{font-size:10.5px;letter-spacing:.34em}.pz-feat b{font-size:12px}.pz-feat span{display:none}}
@media (prefers-reduced-motion:reduce){.pz *{animation:none!important}.pz-feat div{opacity:1}}
.pz-col>*:not(.pz-foto){position:relative;z-index:1}
.pz-foto{position:absolute;top:0;right:0;width:66%;max-width:380px;aspect-ratio:279/388;z-index:0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 42%),linear-gradient(0deg,transparent 0%,#000 30%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 42%),linear-gradient(0deg,transparent 0%,#000 30%);mask-composite:intersect}
.pz-foto::before{content:"";position:absolute;inset:0;background:var(--foto) center top/cover no-repeat;animation:pzzoom 22s ease-in-out infinite alternate;transform-origin:60% 30%}
.pz-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,12,38,.45) 0%,rgba(3,12,38,0) 50%),linear-gradient(180deg,rgba(3,12,38,.25) 0%,rgba(3,12,38,0) 18%)}
@media (min-width:561px){.pz-foto{-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%,#000 78%,transparent 100%),linear-gradient(0deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%,#000 78%,transparent 100%),linear-gradient(0deg,transparent 0%,#000 30%)}}
@keyframes pzzoom{to{transform:scale(1.08) translate(-6px,4px)}}
.pz-txt{max-width:26ch}
.pz-feat b{font-size:13px;line-height:1.25}.pz-feat span{font-size:11px}
.pz-emp{font-size:14px;color:#4A5578;margin:-2px 0 12px;display:flex;align-items:center;gap:8px}.pz-emp b{color:#0E1A4A}.pz-emp button{background:none;border:0;padding:0;color:#1F5FE8;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
@media (max-width:420px){.pz-feat span{display:block!important;font-size:10px}.pz-feat b{font-size:11.5px}.pz-feat div{padding:4px 4px}}
@media (prefers-reduced-motion:reduce){.pz-foto::before{animation:none}}

/* ---------- pendências (badges) ---------- */
function pendencias() {
  const docs = G('docs').filter(d => d.colabId === me() && d.status === 'pendente');
  const assin = G('assin').filter(a => a.colabId === me());
  const hol = G('holerites').filter(h => h.colabId === me() && !assin.some(a => a.tipo === 'holerite' && a.ref === h.comp));
  const pesq = G('pesq').filter(p => p.ativa && !(p.responderam || []).includes(me()));
  const chat = G('chat').filter(m => m.colabId === me() && m.de === 'rh' && !m.lido);
  const avisos = G('avisos').filter(a => !(a.lidos || []).includes(me()));
  const compAnt = iso(addM(new Date(hoje().getFullYear(), hoje().getMonth(), 1), -1)).slice(0, 7);
  const temPontoAnt = G('ponto').some(p => p.colabId === me() && p.data.startsWith(compAnt));
  const espelho = temPontoAnt && !assin.some(a => a.tipo === 'espelho' && a.ref === compAnt) ? compAnt : null, convites = convitesRecebidos();
  return {
    docs: docs.filter(d => d.categoria !== 'contrato'), contratos: docs.filter(d => d.categoria === 'contrato'), hol, pesq, chat, avisos, espelho, convites,
    badge: { inicio: avisos.length, docs: docs.filter(d => d.categoria !== 'contrato').length, contratos: docs.filter(d => d.categoria === 'contrato').length, holerites: hol.length, pesq: pesq.length, chat: chat.length, espelho: espelho ? 1 : 0 }
  };
}
function badges() {
  const b = pendencias().badge;
  $$('[data-bdg]').forEach(el => { const k = el.dataset.bdg; const n = k === 'mais' ? ['docs', 'contratos', 'espelho'].reduce((s, x) => s + (b[x] || 0), 0) : (b[k] || 0); el.textContent = n || ''; });
}

function redeLogin() {
  const c = $('#lx-rede'); if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return; const x = c.getContext('2d'); let W, H, pts;
  const ini = () => { W = c.width = c.offsetWidth * devicePixelRatio; H = c.height = c.offsetHeight * devicePixelRatio; pts = Array.from({ length: Math.min(60, Math.round(W * H / 26000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25 * devicePixelRatio, vy: (Math.random() - .5) * .25 * devicePixelRatio })); };
  ini(); addEventListener('resize', ini);

    pts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; });
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < L) { x.strokeStyle = `rgba(90,162,255,${(1 - d / L) * .35})`; x.lineWidth = devicePixelRatio; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); } }

}

async function fbEntrarPortal(user) {
  try {
    const m = await FB.db.doc(`users/${user.uid}`).get(), u = m.exists ? m.data() : null;
    if (!u || u.tipo !== 'colab' || u.ativo === false) { await FB.auth.signOut(); return toast('Este acesso não está ativo. Procure o RH.', true); }
    const t = FB.tenant(await FB.db.doc(`tenants/${u.tenantId}`).get());
    if (estagioLic(t) === 'bloqueada') { await FB.auth.signOut(); return telaPortalIndisp(); }
    await FB.abrir(t.id, ['colab', 'config', ...FB.LIVRES, ...FB.PROPRIOS, 'convites', 'vagas'], { colabId: u.colabId });
    const c = FB.get('colab', [])[0];
    if (!c || !acessoDesligOk(c) || !c.portal || !c.portal.ativo) { FB.fechar(); await FB.auth.signOut(); return c && c.status === 'desligado' ? telaEncerrado(c) : toast('Seu acesso ao portal foi encerrado. Procure o RH.', true); }

}

          await u.updatePassword(n);

        mut('acessos', l => { const a = l.find(y => y.colabId === me()); if (a) a.trocar = false; });
        closeModal(true); return toast('Senha salva.');
      }

      const h = await sha(`${P.t.id}:colab:${dig}:${n}`);

/* ---------- Comprovante de registro de ponto (Portaria 671) ---------- */
async function shaP(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
/* ---------- Comprovante de cada batida: tipo, situação em relação à escala, PDF e histórico ---------- */
function analisarBatida(dia, h) {

  const tipo = idx === 0 ? 'Entrada' : idx === 1 ? (temInt ? 'Saída para o intervalo' : 'Saída') : idx === 2 ? 'Volta do intervalo' : idx === 3 ? 'Saída' : 'Marcação adicional';
  let sit, cls = 'ok';
  if (!t) { sit = 'Dia sem jornada prevista na sua escala (folga)'; cls = 'info'; }
  else if (idx === 0) { const d = minutos(h) - minutos(t.ent); sit = d > tol ? `Atraso de ${d} min (entrada prevista às ${t.ent})` : d < -10 ? `Chegada ${-d} min antes do horário (previsto às ${t.ent})` : `No horário (entrada prevista às ${t.ent})`; cls = d > tol ? 'warn' : 'ok'; }
  else if ((idx === 1 && !temInt) || idx === 3) { const d = minutos(h) - minutos(t.sai); sit = d < -tol ? `Saída ${-d} min antes do horário (prevista às ${t.sai})` : d > tol ? `Saída ${d} min após o horário (prevista às ${t.sai}); pode gerar hora extra` : `No horário (saída prevista às ${t.sai})`; cls = d < -tol ? 'warn' : d > tol ? 'info' : 'ok'; }
  else if (idx === 1) sit = `Início do intervalo (previsto: ${prevInt} min)`;
  else if (idx === 2) { const iv = minutos(h) - minutos(marc[1]); sit = iv < prevInt - tol ? `Intervalo de ${iv} min, menor que o previsto (${prevInt} min)` : `Intervalo de ${iv} min`; cls = iv < prevInt - tol ? 'warn' : 'ok'; }
  else { sit = 'Marcação além das quatro previstas para o dia'; cls = 'info'; }
  const todas = G('ponto').filter(p => p.colabId === me()).flatMap(p => (p.marc || []).map(x => `${p.data}T${x}`)).sort(), nsr = todas.indexOf(`${dia}T${h}`) + 1;
  return { reg, tipo, sit, cls, nsr, ev: (reg.ev || {})[h] || {}, prevista: t };
}

  const c = P.c, adm = pd(c.admissao), h = hoje(); let anos = 0, meses = 0;
  if (adm) { meses = (h.getFullYear() - adm.getFullYear()) * 12 + h.getMonth() - adm.getMonth() - (h.getDate() < adm.getDate() ? 1 : 0); anos = Math.floor(meses / 12); meses %= 12; }
  const rot = { salario: 'Reajuste salarial', cargo: 'Mudança de cargo', escala: 'Mudança de escala', status: 'Mudança de situação', loja: 'Mudança de loja' };
  const hist = (c.historico || []).filter(x => ['salario', 'cargo', 'escala', 'loja'].includes(x.tipo)).sort((a, b) => b.data.localeCompare(a.data));
  const fv = x => x.tipo === 'salario' ? `${brl(x.de)} → <b>${brl(x.para)}</b>${num(x.de) ? ` <span class="pill ok">+${(((num(x.para) / num(x.de)) - 1) * 100).toFixed(1).replace('.', ',')}%</span>` : ''}` : `${esc(String(x.de || '—'))} → <b>${esc(String(x.para || '—'))}</b>`;
  el.innerHTML = `<section class="panel"><div class="kpis"><div class="kpi"><b>${anos ? `${anos} ano${anos > 1 ? 's' : ''}` : ''}${anos && meses ? ' e ' : ''}${meses || !anos ? `${meses} ${meses === 1 ? 'mês' : 'meses'}` : ''}</b><span>de empresa</span></div><div class="kpi"><b>${esc(c.cargo || '—')}</b><span>cargo atual</span></div><div class="kpi"><b>${brl(c.salario)}</b><span>salário atual</span></div></div></section>
    <section class="panel"><h2>Sua trajetória</h2><ul class="list">${hist.map(x => `<li><div class="t"><div>${fd(x.data)} · ${rot[x.tipo]}</div><div>${fv(x)}${x.motivo ? ` · ${esc(x.motivo)}` : ''}</div></div></li>`).join('')}<li><div class="t"><div>${fd(c.admissao)} · Admissão</div><div>${esc((c.historico || []).filter(x => x.tipo === 'cargo').sort((a, b) => a.data.localeCompare(b.data))[0]?.de || c.cargo || '')}</div></div></li></ul></section>`;
}
/* ---------- Declarações na hora ---------- */
async function declaracaoHtml(tipo, comSal) {
  const c = P.c, e = P.cfg.empresa || {}, hs = G('holerites').filter(x => x.colabId === me()).sort((a, b) => b.comp.localeCompare(a.comp)).slice(0, 3);
  const corpo = tipo === 'vinculo' ? `<p>Declaramos, para os devidos fins, que <b>${esc(c.nome)}</b>, CPF ${esc(c.cpf || '—')}, trabalha nesta empresa desde ${fd(c.admissao)}, com registro em Carteira de Trabalho, exercendo a função de <b>${esc(c.cargo || '—')}</b>${comSal ? `, com salário mensal de <b>${brl(c.salario)}</b>` : ''}.</p>`
    : `<p>Declaramos, para os devidos fins, que <b>${esc(c.nome)}</b>, CPF ${esc(c.cpf || '—')}, trabalha nesta empresa desde ${fd(c.admissao)} na função de <b>${esc(c.cargo || '—')}</b>, e recebeu nos últimos meses:</p>
      <table><tr><th>Mês</th><th class="n">Rendimento bruto</th><th class="n">Líquido</th></tr>${hs.map(h => { const k = folhaItem(h.item); return `<tr><td style="text-transform:capitalize">${mesNome(h.comp)}</td><td class="n">${brl(r2(k.bruto + num(h.item.salFam)))}</td><td class="n">${brl(k.liq)}</td></tr>`; }).join('')}</table>
      <p>Média bruta mensal: <b>${brl(hs.length ? r2(hs.reduce((s, h) => s + folhaItem(h.item).bruto, 0) / hs.length) : num(c.salario))}</b>.</p>`;
  const cod = (await shaP(`${P.t.id}|${me()}|${tipo}|${iso(hoje())}|${corpo}`)).slice(0, 16).toUpperCase().match(/.{4}/g).join('-');
  return { cod, html: `<h2>${tipo === 'vinculo' ? 'Declaração de vínculo empregatício' : 'Declaração de rendimentos'}</h2><p><b>${esc(e.nome || P.t.nome || '')}</b>, CNPJ ${esc(e.cnpj || '—')}${e.endereco ? `, com sede em ${esc([e.endereco, e.cidade].filter(Boolean).join(', '))}` : ''}.</p>${corpo}
    <p>${esc(e.cidade || '')}${e.cidade ? ', ' : ''}${new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}.</p><div class="ass"><div>${esc(e.responsavel || e.nome || 'Departamento Pessoal')}<br><small>Departamento Pessoal</small></div></div>
    <p style="font-size:11px;color:#555;margin-top:18px">Documento emitido pelo Portal do Colaborador em ${new Date().toLocaleString('pt-BR')}. Código de verificação ${cod}: a empresa confirma a autenticidade pelo telefone ou e-mail do RH.</p>` };
}

/* ---------- Meus dados (LGPD, art. 18) ---------- */
/* ---------- Cópia dos meus dados (LGPD): relatório legível em PDF ou arquivo de dados ---------- */
function docMeusDados(d) {
  const f = v => { if (v === null || v === undefined || v === '') return '—'; if (typeof v === 'boolean') return v ? 'Sim' : 'Não'; if (Array.isArray(v)) return v.length ? v.map(f).join(', ') : '—'; if (typeof v === 'object') { const K = { banco: 'Banco', agencia: 'Agência', conta: 'Conta', pix: 'PIX', tipo: 'Tipo', titular: 'Titular', aceito: 'Aceito', em: 'Em', versao: 'Versão' }; return Object.entries(v).filter(([k]) => !/^(id|uid|hash|img|selfie|foto|ua)$/.test(k)).map(([k, x]) => `${K[k] || k} ${f(x)}`).join(', ') || '—'; }
    const s = String(v); if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return new Date(s).toLocaleString('pt-BR').slice(0, 17); if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.split('-').reverse().join('/'); if (s.startsWith('data:')) return '[arquivo]'; return s; };
  const R = { nome: 'Nome', cpf: 'CPF', rg: 'RG', pis: 'PIS', nascimento: 'Nascimento', cargo: 'Cargo', cbo: 'CBO', depto: 'Setor', loja: 'Loja', admissao: 'Admissão', tipo: 'Tipo de contrato', salario: 'Salário', status: 'Situação', telefone: 'Telefone', email: 'E-mail', endereco: 'Endereço', cidade: 'Cidade', cep: 'CEP', banco: 'Dados bancários', dependentes: 'Dependentes', escalaId: 'Escala', asoData: 'Último exame ocupacional', asos: 'Exames ocupacionais', lgpd: 'Consentimento LGPD', criadoEm: 'Cadastro criado em', desligamento: 'Desligamento' };
  const c = d.cadastro || {}, linhas = Object.keys(R).filter(k => k in c).concat(Object.keys(c).filter(k => !(k in R) && !/^(id|colabId|faceRef|portal)$/.test(k)));
  const escalas = [].concat((P.cfg && P.cfg.escalas) || [], typeof ESCALAS_PADRAO !== 'undefined' ? (Array.isArray(ESCALAS_PADRAO) ? ESCALAS_PADRAO : Object.entries(ESCALAS_PADRAO).map(([id, x]) => ({ id, ...(typeof x === 'object' ? x : { nome: x }) }))) : []);
  const val = (k, v) => k === 'status' ? ({ ativo: 'Ativo', desligado: 'Desligado', afastado: 'Afastado', ferias: 'Em férias' }[v] || f(v)) : k === 'escalaId' ? (((escalas.find(e => e && e.id === v) || {}).nome) || f(v)) : k === 'salario' ? brl(+v || 0) : k === 'tipo' ? ({ clt: 'CLT', pj: 'PJ', estagio: 'Estágio', aprendiz: 'Aprendiz', temporario: 'Temporário' }[v] || f(v)) : k === 'asos' && Array.isArray(v) ? (v.map(a => `${f(a.tipo)} em ${f(a.data)}${a.resultado ? ' (' + f(a.resultado) + ')' : ''}`).join('; ') || '—') : f(v);
  const tab = (cols, rows) => rows.length ? `<table class="tb"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(x => `<td>${esc(String(x))}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p class="vz">Nenhum registro.</p>';
  const sec = (t, n, h) => `<div class="sc"><span>${t}</span><span>${n} registro${n === 1 ? '' : 's'}</span></div>${h}`;
  const TS = { atestado: 'Atestado', ferias: 'Férias', folga: 'Folga', adiantamento: 'Adiantamento', ajuste_ponto: 'Ajuste de ponto', dados: 'Atualização de dados', troca: 'Troca de turno', divergencia_pag: 'Divergência no pagamento', aso: 'Exame ocupacional', lgpd: 'Pedido LGPD', senha: 'Nova senha' };
  const ST = { pendente: 'Pendente', aprovada: 'Aprovada', recusada: 'Recusada', assinado: 'Assinado', recusado: 'Recusado' };
  const ms = c2 => { const [a, m] = String(c2 || '').split('-'); return m ? `${m}/${a}` : f(c2); };
  return `<style>.md{font-family:Arial,Helvetica,sans-serif;color:#111827;font-size:10.5px;line-height:1.4}.md .tp{display:flex;align-items:center;gap:10px;background:#0B1E4A;color:#fff;padding:11px 14px;border-radius:6px 6px 0 0}.md .tp .t{flex:1;text-align:right}.md .tp .t b{display:block;font-size:13px}.md .tp .t span{font-size:9.5px;opacity:.85}
    .md .in{border:1px solid #9FB3D3;border-top:0;padding:8px 10px;background:#F4F7FC;font-size:10px;color:#273449}.md .sc{display:flex;justify-content:space-between;background:#DCE6F5;border:1px solid #9FB3D3;padding:5px 8px;font-weight:700;color:#0B1E4A;margin-top:12px}
    .md table{width:100%;border-collapse:collapse}.md td,.md th{border:1px solid #9FB3D3;padding:4px 6px;vertical-align:top;text-align:left}.md th{background:#EEF3FB;font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:#4B5B7A}.md .cd td:first-child{width:32%;background:#F8FAFD;font-weight:700;color:#273449}
    .md .vz{border:1px solid #9FB3D3;border-top:0;padding:6px 8px;color:#8A93AB;font-style:italic;margin:0}.md .rod{margin-top:14px;padding-top:6px;border-top:2px solid #0B1E4A;font-size:9px;color:#4B5B7A}</style>
  <div class="md"><div class="tp"><svg width="28" height="25" viewBox="20 20 580 520" aria-hidden="true"><path d="M30 528V196c0-30 18-48 46-50L226 260v136z" fill="#5AA2FF"/><path d="M404 124 578 30v330H404z" fill="#3B82F6"/><path d="M36 168c8-32 42-56 78-82 26-19 50-44 74-54 22-9 44-4 60 12l316 290c16 15 16 32 2 46l-96 90c-16 15-38 15-54 0L104 166c-18-16-48-20-68 2z" fill="#9CC8FF"/></svg><b style="font-size:15px">NEXUM</b><span class="t"><b>RELATÓRIO DOS MEUS DADOS PESSOAIS</b><span>Lei Geral de Proteção de Dados (Lei 13.709/2018)</span></span></div>
  <div class="in"><b>${esc(d.titular || '')}</b>, este relatório reúne os dados pessoais que <b>${esc(d.empresa || '')}</b> mantém sobre você no NEXUM RH, gerado em ${f(d.geradoEm)}. Arquivos como fotos e assinaturas aparecem indicados como [arquivo]. Para corrigir algum dado, use Meus dados &gt; Fazer um pedido no Portal do Colaborador.</div>
  <div class="sc"><span>Dados cadastrais</span><span></span></div><table class="cd"><tbody>${linhas.map(k => `<tr><td>${esc(R[k] || k)}</td><td>${esc(val(k, c[k]))}</td></tr>`).join('')}</tbody></table>
  ${sec('Registros de ponto', (d.ponto || []).length, tab(['Data', 'Marcações'], (d.ponto || []).slice().sort((a, b) => (b.data || '').localeCompare(a.data || '')).map(p => [f(p.data), (p.marc || []).join(', ') || '—'])))}
  ${sec('Férias', (d.ferias || []).length, tab(['Início', 'Dias', 'Abono'], (d.ferias || []).map(x => [f(x.inicio), f(x.dias), x.abono ? 'Sim' : 'Não'])))}
  ${sec('Holerites', (d.holerites || []).length, tab(['Mês', 'Bruto', 'INSS', 'IRRF', 'Outros descontos', 'Líquido'], (d.holerites || []).map(h => [ms(h.comp), brl(+h.bruto || 0), brl(+h.inss || 0), brl(+h.irrf || 0), brl(+h.desc || 0), brl(+h.liq || 0)])))}
  ${sec('Documentos', (d.documentos || []).length, tab(['Documento', 'Enviado em', 'Situação', 'Assinado em'], (d.documentos || []).map(x => [f(x.titulo), f(x.enviadoEm), ST[x.status] || f(x.status), f(x.assinadoEm)])))}
  ${sec('Pedidos e solicitações', (d.solicitacoes || []).length, tab(['Tipo', 'Data', 'Situação', 'Resposta do RH'], (d.solicitacoes || []).map(x => [TS[x.tipo] || f(x.tipo), f(x.criadoEm), ST[x.status] || f(x.status), f(x.resposta)])))}
  ${sec('Ocorrências', (d.ocorrencias || []).length, tab(['Tipo', 'Data', 'Descrição'], (d.ocorrencias || []).map(x => [f(x.tipo), f(x.data), f(x.motivo || x.desc)])))}
  ${sec('Assinaturas e confirmações', (d.assinaturas || []).length, tab(['Tipo', 'Referência', 'Data'], (d.assinaturas || []).map(x => [f(x.tipo), f(x.ref), f(x.em)])))}
  ${sec('Conversas com o RH', (d.chat || []).length, tab(['Data', 'De', 'Mensagem'], (d.chat || []).map(x => [f(x.em), x.de === 'rh' ? 'RH' : 'Você', f(x.texto)])))}
  ${sec('Acessos ao portal', (d.acessos || []).length, tab(['Data', 'Aparelho', 'Tipo'], (d.acessos || []).map(x => [f(x.em), f(x.aparelho || x.dev), f(x.tipo)])))}
  <div class="rod">Emitido pelo NEXUM RH a pedido do titular dos dados (art. 18 e 19 da LGPD).</div></div>`;
}

        const v = $('#cf-v', m); v.srcObject = st; let pv = null; BIO.esperarVideo(v).then(() => { if (document.contains(v)) pv = BIO.previa(v, $('#cf-box', m)); });
        const vigia = setInterval(() => { if (!document.contains(v)) { clearInterval(vigia); if (pv) pv(); if (!feito) { parar(); ok(null); } } }, 300);
        $('#cf-t', m).onclick = () => { if (!v.videoWidth) return toast('Aguarde a câmera abrir.', true); const w = Math.min(480, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth), c = document.createElement('canvas'); c.width = w; c.height = h;
          const x = c.getContext('2d'); x.translate(w, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, w, h); feito = true; clearInterval(vigia); parar(); closeModal(true); ok({ metodo: 'foto', foto: c.toDataURL('image/jpeg', 0.72) }); }; } });
  });

}
function avisoDeslig(el) {

const RO_OK = /baixar|imprimir|pdf|^ver\b|abrir|voltar|fechar|cancelar|detalhes|entendi|^‹/i, ehRescisao = t => /rescis|trct|desligamento|dispensa|aviso pr[eé]vio|demiss|não prorroga/i.test(t || '');

/* ---------- Assistente automático do chat (sem custo: usa os seus próprios dados) ---------- */

    return `${h && h.comp ? `Seu holerite mais recente é o de ${mesNome(h.comp)}, no menu Holerites.` : 'Ainda não há holerite publicado para você.'} O salário é pago até o 5º dia útil do mês seguinte (CLT, art. 459).` + rod; }

    return `Seus próximos dias:\n${l.join('\n')}\n\nA escala completa está em Minha escala, onde também dá para pedir folga ou trocar o turno com um colega.` + rod; }

function lerArquivo(file) {
  return new Promise((res, rej) => {
    if (file.type === 'application/pdf') {
      if (file.size > 500 * 1024) return rej('O PDF precisa ter até 500 KB. Tire uma foto do documento em vez disso.');
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej('Não foi possível ler o arquivo.'); r.readAsDataURL(file); return;
    }
    if (!file.type.startsWith('image/')) return rej('Envie uma foto (JPG, PNG) ou um PDF.');
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = img.width * s; cv.height = img.height * s; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.66)); };
    img.onerror = () => rej('Não foi possível abrir a imagem.'); img.src = url;
  });
}

/* liga as notificações deste aparelho (pede a permissão só se "silencioso" for falso) */
async function pushAtivar(silencioso) {
  try {
    if (!FB_ON || !FB.tid || !FB.auth.currentUser) return false;
    if (!pushOk()) { if (!silencioso) toast(pushIOS() ? 'No iPhone, primeiro instale o app: toque em Compartilhar e em "Adicionar à Tela de Início". Depois abra o NEXUM pelo ícone e ative de novo.' : 'Este navegador não recebe notificações. Use o Chrome ou instale o app.', true); return false; }

}

/* manda o aviso pelo conector (não trava a tela se falhar) */
async function pushEnviar(para, titulo, corpo, url, tag) {

<script>

/* toca o vídeo sem deixar adiantar; chama fim() quando termina */
async function treinoPlayer(box, t, fim, livre) {

  const guarda = () => { if (livre) return; try { localStorage.setItem(treinoPosKey(t.id), String(Math.floor(max))); } catch (e) { } };
