<style>
:root{
  --ink:#0A1733;--ink2:#13244D;--ink3:#26406F;
  --bg:#F4F4F8;--card:#FFFFFF;--line:#E2E1EC;--line2:#EEEDF4;
  --txt:#1B1A2E;--mut:#696784;
  --pri:#1A5CFF;--pri-d:#0B47D6;--pri-s:#E8F0FF;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;
  --soft:#FAFAFC;--hover:#F7F6FB;
  --r:10px;--rs:6px;
  --f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
#root{height:100%;min-height:100vh;min-height:100dvh}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- Login ---------- */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;min-height:100dvh}
.auth-art{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px)}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%}
.auth-art>*:not(canvas){position:relative}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.02em}
.brand .marca{height:30px;width:auto;display:block}
.brand-sub{border-left:2px solid #1E7BFF;padding-left:10px;font-weight:500;font-size:.9em;letter-spacing:.06em;color:rgba(255,255,255,.72);line-height:1.1}
.brand small{font-weight:500;opacity:.6;letter-spacing:0}
.auth-claim{font-size:clamp(34px,4.6vw,60px);font-weight:700;line-height:1.02;letter-spacing:-.035em;max-width:11ch}
.auth-sub{opacity:.72;max-width:40ch;margin-top:16px}
.auth-foot{font-size:13px;opacity:.5}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--card)}
.auth-box{width:100%;max-width:400px}
.seg{display:flex;background:var(--bg);border-radius:var(--r);padding:4px;margin-bottom:28px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(10,23,51,.12)}

/* ---------- Form ---------- */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}
.inp.err{border-color:var(--bad)}
textarea.inp{min-height:90px;resize:vertical}
.grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--rs);padding:9px 16px;min-height:40px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--pri);padding:6px 10px;min-height:32px}
.btn.ghost:hover{background:var(--pri-s)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;height:100dvh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.side .brand{padding:4px 8px 22px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.66);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side-foot .who{font-weight:600}
.side-foot .role{opacity:.55}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:20px}
.menu-btn{display:none;border:0;background:none;padding:6px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px)}
.wrap{max-width:1240px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.pill.mut{background:var(--line2);color:var(--mut)}
.banner{padding:10px 16px;background:var(--warn-s);color:var(--warn);font-size:14px;font-weight:500;border-bottom:1px solid #F1DDB8}
.banner.bad{background:var(--bad-s);color:var(--bad);border-color:#F2C9C9}

/* ---------- Blocks ---------- */

.adl-bg{position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(3,8,22,.35),rgba(3,8,22,0) 55%)}.adl-bg>*{display:none!important}
.adl-bg canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.adl-bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.adl-bg .l1{width:420px;height:420px;left:48%;top:-120px;background:#1E4FD8}.adl-bg .l2{width:340px;height:340px;right:-80px;bottom:-60px;background:#123A9C}.adl-bg .l3{width:260px;height:260px;left:-60px;top:30%;background:#0B2A75;opacity:.45}
.adl-bg b{position:absolute;display:block;background:linear-gradient(90deg,transparent,#2B6BFF,#5AA2FF,transparent);transform:rotate(-38deg);opacity:.7;border-radius:4px}
.adl-bg .f1{width:520px;height:5px;left:-120px;top:70px}.adl-bg .f2{width:380px;height:3px;left:-60px;top:120px;opacity:.45}
.adl-bg .f3{width:560px;height:5px;right:-160px;bottom:90px}.adl-bg .f4{width:420px;height:3px;right:-110px;bottom:40px;opacity:.45}
.adl-art,.adl-card{position:relative;z-index:1;min-width:0;zoom:var(--z,1)}
.adl-mk{display:flex;align-items:center;gap:16px}.adl-mk img{height:52px;width:auto}.adl-mk i{width:3px;height:52px;background:#2B7BFF;border-radius:2px}.adl-mk span{font-size:46px;font-weight:600;letter-spacing:.02em;color:#8FB4FF;line-height:1}
.adl-sub{letter-spacing:.42em;font-size:13.5px;color:#C9D6F2;margin:18px 0 44px;font-weight:500}
.adl-art h1{font-size:clamp(30px,3.2vw,46px);font-weight:500;line-height:1.15;margin:0}.adl-art h1 b{display:block;font-weight:800;background:linear-gradient(90deg,#2F80FF,#4FA3FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.adl-art p{color:#C9D3EA;font-size:17px;max-width:48ch;margin:18px 0 44px;line-height:1.55}
.adl-tag{border-left:3px solid #2B7BFF;padding-left:30px;letter-spacing:.3em;font-size:13.5px;line-height:1.9;color:#E3EAF8}
.adl-card{justify-self:end;width:560px;background:linear-gradient(160deg,rgba(16,26,56,.72),rgba(6,12,30,.80));border:1px solid rgba(91,140,255,.35);border-radius:24px;padding:44px 46px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset,0 0 40px rgba(43,107,255,.12);backdrop-filter:blur(14px)}
.adl-card .adl-mk{justify-content:center;margin-bottom:34px}.adl-card .adl-mk img{height:40px}.adl-card .adl-mk i{height:40px}.adl-card .adl-mk span{font-size:36px}
.adl-card h2{font-size:28px;font-weight:700;margin:0 0 8px;color:#fff}.adl-p{color:#C9D3EA;margin:0 0 28px;font-size:16px;line-height:1.5}
.adl-in{display:flex;align-items:center;gap:12px;border:1px solid rgba(143,170,230,.32);background:rgba(10,18,42,.65);border-radius:12px;padding:0 16px;height:58px;margin-bottom:18px;transition:border-color .15s,box-shadow .15s}
.adl-in:focus-within{border-color:#3D86FF;box-shadow:0 0 0 3px rgba(43,107,255,.22)}
.adl-in svg{width:24px;height:24px;color:#B9C6E4;flex:none}.adl-in input{flex:1;background:none;border:0;outline:none;color:#fff;font:inherit;font-size:16.5px;min-width:0}.adl-in input::placeholder{color:#93A2C4}

/* ---------- PIX (padrão BR Code do Banco Central) ---------- */
function pixCRC(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let k = 0; k < 8; k++) { c = c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1; c &= 0xFFFF; } } return c.toString(16).toUpperCase().padStart(4, '0'); }
function pixCodigo({ chave, nome, cidade, valor, txid, desc }) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const limpa = (s, n) => (String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim().slice(0, n)) || 'NEXUM';
  const conta = f('00', 'br.gov.bcb.pix') + f('01', String(chave).trim()) + (desc ? f('02', limpa(desc, 40)) : '');
  const ref = String(txid || '***').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***';
  const p = f('00', '01') + f('26', conta) + f('52', '0000') + f('53', '986') + (valor ? f('54', (+valor).toFixed(2)) : '') + f('58', 'BR') + f('59', limpa(nome, 25)) + f('60', limpa(cidade, 15)) + f('62', f('05', ref)) + '6304';
  return p + pixCRC(p);
}

const fmtCnpj = c => { c = String(c || '').replace(/\D/g, ''); return c.length === 14 ? `${c.slice(0, 2)}.${c.slice(2, 5)}.${c.slice(5, 8)}/${c.slice(8, 12)}-${c.slice(12)}` : c; };
